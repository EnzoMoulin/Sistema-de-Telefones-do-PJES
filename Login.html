Arquivo: Login.html — Acesso Administrativo (e-mail + senha 20)
==========================================================
-->
<style>
  .lg-wrap{ max-width:520px; margin:28px auto; }
  .lg-card{ background:#fff; border-radius:16px; border:1px solid #e2e8f0; box-shadow:0 12px 28px -10px rgba(15,23,42,.18); overflow:hidden; }
  .lg-head{ background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 45%,#1e40af 100%); padding:22px 26px; color:#fff; position:relative; }
  .lg-head::after{ content:"🔐"; position:absolute; right:18px; top:50%; transform:translateY(-50%); font-size:36px; opacity:.22; }
  .lg-head h2{ margin:0 0 6px; font-size:18px; font-weight:800; }
  .lg-head p{ margin:0; font-size:12.5px; opacity:.9; line-height:1.5; max-width:420px; }
  .lg-body{ padding:22px 26px 24px; }
  .lg-field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .lg-field label{ font-size:12.5px; font-weight:700; color:#334155; }
  .lg-field input{ width:100%; box-sizing:border-box; padding:11px 13px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:13.5px; color:#0f172a; background:#f8fafc; transition:.15s; }
  .lg-field input:focus{ outline:none; border-color:#2563eb; background:#fff; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  .lg-senha-wrap{ position:relative; }
  .lg-senha-wrap input{ padding-right:40px; }
  .lg-eye{ position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; cursor:pointer; font-size:16px; color:#64748b; padding:4px 6px; border-radius:6px; }
  .lg-eye:hover{ background:#f1f5f9; color:#0f172a; }
  .lg-msg{ margin-top:12px; border-radius:10px; padding:12px 14px; font-size:12.5px; font-weight:600; line-height:1.5; }
  .lg-msg.hidden{ display:none; }
  .lg-acoes{ margin-top:18px; display:flex; gap:10px; justify-content:flex-end; }
  .lg-btn{ padding:11px 22px; border:0; border-radius:10px; font-size:13.5px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,#2563eb 0%,#3b82f6 100%); color:#fff; box-shadow:0 4px 12px -4px rgba(37,99,235,.45); transition:.15s; }
  .lg-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 16px -4px rgba(37,99,235,.55); }
  .lg-btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }
  .lg-foot{ margin-top:14px; text-align:center; font-size:12.5px; color:#64748b; }
  .lg-foot a{ color:#2563eb; font-weight:700; text-decoration:none; }
  .lg-foot a:hover{ text-decoration:underline; }
</style>

<div class="lg-wrap">
  <div class="lg-card">
    <div class="lg-head">
      <h2>Acesso Administrativo</h2>
      <p>Entre com seu e-mail institucional e sua senha de 20 caracteres.<br><small style="opacity:.85">Se seu acesso ainda não foi aprovado, verá: <em>Acesso em andamento. Quando sua conta for aprovada você conseguirá entrar.</em></small></p>
    </div>
    <div class="lg-body">
      <div class="lg-field">
        <label for="login-email">📧 E-mail institucional</label>
        <div style="display:flex;align-items:stretch;">
          <input id="login-email" type="text" maxlength="80" autocomplete="off" placeholder="nome" style="flex:1;border-radius:10px 0 0 10px;">
          <span class="dominio-sufixo" style="display:flex;align-items:center;padding:0 12px;background:#f1f5f9;border:1.5px solid #cbd5e1;border-left:0;border-radius:0 10px 10px 0;font-size:13px;color:#475569;font-weight:600;white-space:nowrap;">@tjes.jus.br</span>
        </div>
      </div>
      <div class="lg-field">
        <label for="login-senha">🔑 Senha de acesso (20 caracteres)</label>
        <div class="lg-senha-wrap">
          <input id="login-senha" type="password" maxlength="20" autocomplete="current-password" placeholder="Digite sua senha">
          <button type="button" class="lg-eye" onclick="alternarSenhaLogin()" title="Mostrar/ocultar senha" aria-label="Mostrar senha">👁️</button>
        </div>
      </div>
      <div id="login-mensagem" class="lg-msg hidden" role="alert"></div>
      <div class="lg-acoes">
        <button type="button" id="btn-login-consulta" class="lg-btn" onclick="fazerLoginConsulta()">Entrar →</button>
      </div>
      <div class="lg-foot">
        Não tem senha? <a href="#" onclick="mostrarView('formulario-acesso-view'); return false;">Solicite aqui no Formulário de Acesso</a>
      </div>
    </div>
  </div>
</div>

<script>
var LOGIN_TENTATIVAS = 0;

function alternarSenhaLogin(){
  var el = document.getElementById("login-senha");
  if(!el) return;
  el.type = el.type === "password" ? "text" : "password";
}

function exibirMensagemLogin(msg, tipo){
  var el = document.getElementById("login-mensagem");
  if(!el) return;
  var ok = tipo === "success";
  var warn = tipo === "warning";
  el.textContent = (ok ? "✅ " : "⚠️ ") + String(msg||"");
  if(ok){ el.style.background="#dcfce7"; el.style.border="1px solid #bbf7d0"; el.style.color="#166534"; }
  else if(warn){ el.style.background="#fef9c3"; el.style.border="1px solid #fde68a"; el.style.color="#854d0e"; }
  else { el.style.background="#fee2e2"; el.style.border="1px solid #fecaca"; el.style.color="#991b1b"; }
  el.classList.remove("hidden");
}

function limparMensagemLogin(){
  var el = document.getElementById("login-mensagem");
  if(!el) return;
  el.textContent = "";
  el.className = "lg-msg hidden";
}

function fazerLoginConsulta(){
  limparMensagemLogin();
  var emailRaw = String(document.getElementById("login-email")?.value || "").trim().toLowerCase();
  var _domLogin = (typeof window.DOMINIO_INSTITUCIONAL!=="undefined"&&window.DOMINIO_INSTITUCIONAL)||"tjes.jus.br";
  var email = emailRaw.includes("@") ? emailRaw : (emailRaw ? emailRaw + "@" + _domLogin : "");
  var senha = String(document.getElementById("login-senha")?.value || "").trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    exibirMensagemLogin("Informe um e-mail válido.", "error"); return;
  }
  if(!email.toLowerCase().endsWith("@" + _domLogin.toLowerCase())){
    exibirMensagemLogin("Use o e-mail institucional (@" + _domLogin + ").", "error"); return;
  }
  if(!senha || senha.length !== 20){
    exibirMensagemLogin("A senha deve ter 20 caracteres.", "error"); return;
  }
  if(typeof API==="undefined" || typeof API.autenticarConsulta!=="function"){
    exibirMensagemLogin("Serviço de login indisponível.", "error"); return;
  }
  var btn = document.getElementById("btn-login-consulta");
  if(btn){ btn.disabled=true; btn.textContent="Entrando..."; }
  API.autenticarConsulta(email, senha,
    function(resp){
      if(btn){ btn.disabled=false; btn.textContent="Entrar →"; }
      if(resp && resp.sucesso===true && resp.dados){
        try{
          sessionStorage.setItem("pjes_auth_sessao", JSON.stringify({
            token: resp.dados.token,
            expiraEm: resp.dados.expiraEm,
            email: resp.dados.email,
            nome: resp.dados.nome,
            perfil: resp.dados.perfil,
            nivel: resp.dados.nivel,
            comarcas: resp.dados.comarcas || [],
            unidades: resp.dados.unidades || []
          }));
          localStorage.removeItem("pjes_consulta_sessao");
        }catch(e){}
        usuarioAtual = { nome: resp.dados.nome || email.split("@")[0], email: resp.dados.email, perfil: resp.dados.perfil || "GESTOR_CONTEUDO", logado: true, ativo: true, comarcas: Array.isArray(resp.dados.comarcas)?resp.dados.comarcas:[], unidades: Array.isArray(resp.dados.unidades)?resp.dados.unidades:[], viaConsulta:true };
        try{ atualizarInterfaceUsuario(); }catch(e){}
        exibirMensagemLogin("Login realizado! Bem-vindo, " + (resp.dados.nome||"") + ".", "success");
        if(typeof mostrarToast==="function") mostrarToast("Login realizado!", "success");
        // v3.32: sempre que fizer login a aba Telefones deve ser recarregada
        try{ if(typeof recarregarTelefonesAposLogin==="function") recarregarTelefonesAposLogin(); else if(typeof carregarTelefones==="function") carregarTelefones(); }catch(eRL){}
        try{ if(typeof sincronizarSolicitacoesPendentes==="function") setTimeout(sincronizarSolicitacoesPendentes, 350); }catch(e){}
        try{ if(typeof sincronizarSolicitacoesPendentesDashboard==="function") setTimeout(sincronizarSolicitacoesPendentesDashboard, 350); }catch(e){}
        try{ if(typeof renderizarMapaConsulta==="function") setTimeout(function(){ try{ renderizarMapaConsulta(); }catch(e){} }, 600); }catch(e){}
        try{ if(typeof tentarInicializarMapa==="function") setTimeout(function(){ try{ tentarInicializarMapa(); }catch(e){} }, 700); }catch(e){}
        setTimeout(function(){ try{ var p=(resp.dados.perfil||"").toUpperCase(); mostrarView('consulta-telefones-view'); /* v3.33 GS e GC usam mapa */ }catch(e){} }, 600);
      } else {
        var msg = (resp&&resp.erro)||"E-mail ou senha incorretos.";
        var isPending = String(msg).indexOf("Acesso em andamento")!==-1;
        exibirMensagemLogin(msg, isPending ? "warning" : "error");
      }
    },
    function(err){
      if(btn){ btn.disabled=false; btn.textContent="Entrar →"; }
      var msg2 = (err&&err.message)||"Falha de comunicação.";
      var isPending2 = String(msg2).indexOf("Acesso em andamento")!==-1;
      exibirMensagemLogin(msg2, isPending2 ? "warning" : "error");
    }
  );
}

// Sincroniza sufixo de dominio com CONFIG
document.addEventListener("DOMContentLoaded", function(){
  try{
    var d=(typeof window.DOMINIO_INSTITUCIONAL!=="undefined"&&window.DOMINIO_INSTITUCIONAL)||"tjes.jus.br";
    document.querySelectorAll(".dominio-sufixo").forEach(function(el){ el.textContent="@" + d; });
    // atualiza hint se houver
    var hint=document.querySelector(".lg-foot a");
  }catch(e){}
});
// Enter para logar
document.addEventListener("keydown", function(e){
  var view = document.getElementById("login-view");
  if(view && !view.classList.contains("hidden") && e.key==="Enter"){
    var ae = document.activeElement;
    if(ae && (ae.id==="login-email" || ae.id==="login-senha")) fazerLoginConsulta();
  }
});
</script>
