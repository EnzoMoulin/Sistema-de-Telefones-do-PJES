<script>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: APIJS.html
 * ==========================================================
 * API de compatibilidade: os nomes antigos permanecem para não
 * quebrar o frontend, mas os caminhos de dados agora apontam para
 * MUNICIPIOS -> FORUM -> UNIDADES -> SETORES -> CONTATOS.
 */

function criarRunnerAPI(sucesso, erro) {
  let runner = google.script.run.withSuccessHandler(typeof sucesso === "function" ? sucesso : function () {});
  if (typeof erro === "function") runner = runner.withFailureHandler(erro);
  else runner = runner.withFailureHandler(function (falha) { console.error("Erro na comunicação com o servidor:", falha); });
  return runner;
}

function obterAutenticacaoAPI() {
  try {
    const bruto = sessionStorage.getItem("pjes_auth_sessao");
    if (!bruto) return null;
    const sessao = JSON.parse(bruto);
    if (!sessao || !sessao.token) return null;
    if (Number(sessao.expiraEm || 0) <= Date.now()) {
      sessionStorage.removeItem("pjes_auth_sessao");
      return null;
    }
    return { token: sessao.token };
  } catch (erro) {
    return null;
  }
}

const API = {
  usuarioAtual(sucesso, erro) { criarRunnerAPI(sucesso, erro).v4ObterUsuarioAtual(obterAutenticacaoAPI()); },
  dashboard(sucesso, erro) { criarRunnerAPI(sucesso, erro).v4CarregarDashboard(obterAutenticacaoAPI()); },
  listarTelefones(sucesso, erro) { criarRunnerAPI(sucesso, erro).v4ListarContatos(obterAutenticacaoAPI()); },

  autenticarConsulta(email, senha, sucesso, erro) {
