<script>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: APIJS.html
 * ==========================================================
 * API de compatibilidade: os nomes antigos permanecem para não
 * quebrar o frontend, mas os caminhos de dados agora apontam para
 * MUNICIPIOS -> FORUM -> UNIDADES -> SETORES -> CONTATOS.
 */

function criarRunnerAPI(sucesso, erro) {
  let runner = google.script.run.withSuccessHandler(typeof sucesso === "function" ? sucesso : function () {});
  if (typeof erro === "function") runner = runner.withFailureHandler(erro);
  else runner = runner.withFailureHandler(function (falha) { console.error("Erro na comunicação com o servidor:", falha); });
  return runner;
}

const API = {
  usuarioAtual(sucesso, erro) { criarRunnerAPI(sucesso, erro).v4ObterUsuarioAtual(); },
  dashboard(sucesso, erro) { criarRunnerAPI(sucesso, erro).v4CarregarDashboard(); },
  listarTelefones(sucesso, erro) { criarRunnerAPI(sucesso, erro).v4ListarContatos(); },
  listarComarcas(sucesso, erro) { criarRunnerAPI(sucesso, erro).v4ListarMunicipios(); },
  pesquisarTelefones(texto, sucesso, erro) { criarRunnerAPI(sucesso, erro).v4PesquisarContatos(texto); },
  criarTelefone(dados, sucesso, erro) { criarRunnerAPI(sucesso, erro).v4CriarContato(dados); },
  atualizarTelefone(id, dados, sucesso, erro) { criarRunnerAPI(sucesso, erro).v4AtualizarContato(id, dados); },
  excluirTelefone(id, sucesso, erro) { criarRunnerAPI(sucesso, erro).v4ExcluirContato(id); },
  historico(id, sucesso, erro) { criarRunnerAPI(sucesso, erro).v4HistoricoContato(id); },

  solicitarAcesso(nome, nivel, justificativa, unidadeIds, sucesso, erro) {
    criarRunnerAPI(sucesso, erro).solicitarAcesso(nome, nivel, justificativa, unidadeIds);
  },
  listarUnidadesParaAcesso(sucesso, erro) { criarRunnerAPI(sucesso, erro).listarUnidadesParaAcesso(); },
  enviarFormularioAcesso(dados, sucesso, erro) { criarRunnerAPI(sucesso, erro).enviarFormularioAcesso(dados); },
  listarSolicitacoes(sucesso, erro) { criarRunnerAPI(sucesso, erro).listarSolicitacoes(); },
  contarSolicitacoesPendentes(sucesso, erro) { criarRunnerAPI(sucesso, erro).contarSolicitacoesPendentes(); },
  aprovarSolicitacao(id, sucesso, erro) { criarRunnerAPI(sucesso, erro).aprovarSolicitacao(id); },
  rejeitarSolicitacao(id, sucesso, erro) { criarRunnerAPI(sucesso, erro).rejeitarSolicitacao(id); },

  // Compatibilidade para componentes antigos de solicitação/permissão.
  solicitarPermissaoComarca(comarca, sucesso, erro) {
    criarRunnerAPI(sucesso, erro).solicitarPermissaoComarca(comarca);
  },
  cancelarSolicitacaoComarca(comarca, sucesso, erro) {
    criarRunnerAPI(sucesso, erro).cancelarSolicitacaoComarca(comarca);
  },

  listarUsuarios(sucesso, erro) { criarRunnerAPI(sucesso, erro).listarUsuarios(); },
  atualizarUsuario(email, dados, sucesso, erro) { criarRunnerAPI(sucesso, erro).atualizarUsuario(email, dados); },
  criarUsuario(dados, sucesso, erro) { criarRunnerAPI(sucesso, erro).criarUsuario(dados); },
  excluirUsuario(email, sucesso, erro) { criarRunnerAPI(sucesso, erro).excluirUsuario(email); },
  logout(sucesso, erro) { criarRunnerAPI(sucesso, erro).encerrarSessao(); },

  // Método explícito da nova arquitetura para telas novas.
  hierarquiaForum(termo, sucesso, erro) { criarRunnerAPI(sucesso, erro).obterHierarquiaPublicaForum(termo || ""); },
  pesquisarHierarquiaForum(termo, sucesso, erro) { criarRunnerAPI(sucesso, erro).pesquisarHierarquiaPublicaForum(termo || ""); },
  validarArquiteturaForum(sucesso, erro) { criarRunnerAPI(sucesso, erro).validarArquiteturaForum(); },
  validarDadosReaisForumV4(sucesso, erro) { criarRunnerAPI(sucesso, erro).validarDadosReaisForumV4(); },

  listarNotificacoes(email, sucesso, erro) { criarRunnerAPI(sucesso, erro).listarNotificacoes(email); },
  marcarNotificacaoLida(id, sucesso, erro) { criarRunnerAPI(sucesso, erro).marcarNotificacaoLida(id); },
  marcarTodasLidas(email, sucesso, erro) { criarRunnerAPI(sucesso, erro).marcarTodasLidas(email); },
  contarNaoLidas(email, sucesso, erro) { criarRunnerAPI(sucesso, erro).contarNaoLidas(email); }
};

</script>
