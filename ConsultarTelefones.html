<div class="telefones-container">

  <div class="telefones-header">

    <button id="btn-imprimir-consulta" class="hidden" style="display:none;" onclick="imprimirConsultaPDF()" aria-hidden="true" tabindex="-1"></button>

  </div>

  <div class="consulta-layout">

    <!-- =====================================================
         COLUNA ESQUERDA — MAPA RESPONSIVO (ocupa todo esquerdo)
         ===================================================== -->

    <aside class="consulta-esquerda">

      <div id="consulta-mapa"></div>

      <!-- DETALHES DO SETOR (sobrepoe mapa quando selecionado) -->

      <div id="consulta-detalhes-conteudo" style="display:none;"></div>

    </aside>

    <!-- =====================================================
         COLUNA DIREITA — CONTATOS DO PJES (lista)
         ===================================================== -->

    <section id="consulta-detalhes" class="consulta-detalhes">

      <div class="consulta-lista-wrapper">

        <div
          id="consulta-lista"
          class="consulta-lista"
        >
          <div class="panel consulta-lista-vazio">
            Selecione um município no mapa para ver os detalhes.
          </div>
        </div>

      </div>

    </section>

  </div>

</div>
