<script>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: SolicitacoesJS.html
 * ==========================================================
 */

function carregarSolicitacoes() {
  API.listarSolicitacoes(
    function(resposta) {
      if (
        !resposta ||
        resposta.sucesso !== true
      ) {
        mostrarToast(
          resposta &&
          resposta.erro
            ? resposta.erro
            : "Erro ao carregar solicitações.",
          "error"
        );

        return;
      }

      renderizarSolicitacoes(
        resposta.dados
      );
    },
    function(erro) {
      mostrarToast(
        erro && erro.message
          ? erro.message
          : "Falha de conexão com o servidor.",
        "error"
      );
    }
  );
}

function criarCelulaSolicitacao(
  valor
) {
  const td =
    document.createElement(
      "td"
    );

  td.textContent =
    valor === null ||
    valor === undefined ||
    String(valor).trim() === ""
      ? "-"
      : String(valor);

  return td;
}

function getStatusBadge(status) {
  const span =
    document.createElement(
      "span"
    );

  const statusUpper =
    String(status || "")
      .trim()
      .toUpperCase();

  span.textContent =
    statusUpper || "-";

  span.style.padding =
    "3px 10px";

  span.style.borderRadius =
    "12px";

  span.style.fontSize =
    "11px";

  span.style.fontWeight =
    "700";

  if (
    statusUpper ===
    "PENDENTE"
  ) {
    span.style.background =
      "#fef3c7";

    span.style.color =
      "#92400e";
  } else if (
    statusUpper ===
    "APROVADO"
  ) {
    span.style.background =
      "#dcfce7";

    span.style.color =
      "#166534";
  } else if (
    statusUpper ===
    "REJEITADO"
  ) {
    span.style.background =
      "#fee2e2";

    span.style.color =
      "#991b1b";
  }

  return span;
}

function renderizarSolicitacoes(
  lista
) {
  const tbody =
    document.getElementById(
      "corpo-tabela-solicitacoes"
    );

  if (!tbody) {
    return;
  }

  tbody.textContent =
    "";

  const dados =
    Array.isArray(lista)
      ? lista
      : [];

  if (
    dados.length === 0
  ) {
    const tr =
      document.createElement(
        "tr"
      );

    const td =
      document.createElement(
        "td"
      );

    td.colSpan =
      6;

    td.textContent =
      "Nenhuma solicitação pendente.";

    td.style.textAlign =
      "center";

    td.style.color =
      "#64748b";

    td.style.padding =
      "20px";

    tr.appendChild(td);
    tbody.appendChild(tr);

    return;
  }

  dados.forEach(sol => {
    const tr =
      document.createElement(
        "tr"
      );

    tr.appendChild(
      criarCelulaSolicitacao(
        sol.email
      )
    );

    tr.appendChild(
      criarCelulaSolicitacao(
        sol.nome
      )
    );

    const unidades = Array.isArray(sol.unidades) ? sol.unidades : [];
    const celulaUnidades = criarCelulaSolicitacao(
      String(sol.perfilSolicitado || "").toUpperCase() === "GESTOR_SISTEMA"
        ? "Todas as unidades (acesso total)"
        : unidades.map(function(unidade) {
            return unidade.municipio + " › " + unidade.forum + " › " + unidade.nome;
          }).join("\n")
    );
    celulaUnidades.style.whiteSpace = "pre-line";
    celulaUnidades.style.minWidth = "260px";
    tr.appendChild(celulaUnidades);

    tr.appendChild(
      criarCelulaSolicitacao(
        sol.justificativa
      )
    );

    const tdStatus =
      document.createElement(
        "td"
      );

    tdStatus.appendChild(
      getStatusBadge(
        sol.status
      )
    );

    tr.appendChild(tdStatus);

    const tdAcoes =
      document.createElement(
        "td"
      );

    tdAcoes.style.whiteSpace =
      "nowrap";

    const status =
      String(sol.status || "")
        .trim()
        .toUpperCase();

    if (
      status ===
      "PENDENTE"
    ) {
      const aprovar =
        document.createElement(
          "button"
        );

      aprovar.type =
        "button";

      aprovar.className =
        "btn btn-primary";

      aprovar.textContent =
        "✅ Aprovar";

      aprovar.style.padding =
        "5px 10px";

      aprovar.style.fontSize =
        "12px";

      aprovar.addEventListener(
        "click",
        function() {
          aprovarSolicitacao(
            sol.id
          );
        }
      );

      const rejeitar =
        document.createElement(
          "button"
        );

      rejeitar.type =
        "button";

      rejeitar.className =
        "btn btn-danger";

      rejeitar.textContent =
        "❌ Rejeitar";

      rejeitar.style.padding =
        "5px 10px";

      rejeitar.style.fontSize =
        "12px";

      rejeitar.style.marginLeft =
        "5px";

      rejeitar.addEventListener(
        "click",
        function() {
          rejeitarSolicitacao(
            sol.id
          );
        }
      );

      tdAcoes.appendChild(
        aprovar
      );

      tdAcoes.appendChild(
        rejeitar
      );
    } else {
      tdAcoes.textContent =
        status || "-";
    }

    tr.appendChild(tdAcoes);
    tbody.appendChild(tr);
  });
}

function aprovarSolicitacao(id) {
  if (
    !confirm(
      "Confirma a aprovação desta solicitação e das unidades selecionadas?"
    )
  ) {
    return;
  }

  API.aprovarSolicitacao(
    id,
    function(resposta) {
      if (
        !resposta ||
        resposta.sucesso !== true
      ) {
        mostrarToast(
          resposta &&
          resposta.erro
            ? resposta.erro
            : "Erro ao aprovar solicitação.",
          "error"
        );

        return;
      }

      mostrarToast(
        "Usuário aprovado com sucesso!",
        "success"
      );

      carregarSolicitacoes();
    },
    function(erro) {
      mostrarToast(
        erro && erro.message
          ? erro.message
          : "Erro de comunicação com o servidor.",
        "error"
      );
    }
  );
}

function rejeitarSolicitacao(id) {
  if (
    !confirm(
      "Deseja realmente rejeitar esta solicitação?"
    )
  ) {
    return;
  }

  API.rejeitarSolicitacao(
    id,
    function(resposta) {
      if (
        !resposta ||
        resposta.sucesso !== true
      ) {
        mostrarToast(
          resposta &&
          resposta.erro
            ? resposta.erro
            : "Erro ao rejeitar solicitação.",
          "error"
        );

        return;
      }

      mostrarToast(
        "Solicitação rejeitada.",
        "info"
      );

      carregarSolicitacoes();
    },
    function(erro) {
      mostrarToast(
        erro && erro.message
          ? erro.message
          : "Erro de comunicação com o servidor.",
        "error"
      );
    }
  );
}
</script>
