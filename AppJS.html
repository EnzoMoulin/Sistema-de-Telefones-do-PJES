<script>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: AppJS.html
 * ==========================================================
 */

let usuarioAtual = {
  nome: "Visitante",
  email: "",
  perfil: "USUARIO_CONSULTA",
  logado: false,
  ativo: false
};

document.addEventListener("DOMContentLoaded", iniciarSistema);

function restaurarSessaoConsulta(){
  try{
    var raw = sessionStorage.getItem("pjes_auth_sessao");
    if(!raw) return false;
    var sess = JSON.parse(raw);
    if(!sess || !sess.token || !sess.email || !sess.perfil) return false;
    if(Number(sess.expiraEm||0) <= Date.now()){ sessionStorage.removeItem("pjes_auth_sessao"); return false; }
    // se já logado via Google gestor, não sobrescreve
    if(usuarioAtual && usuarioAtual.logado && (usuarioAtual.perfil==="GESTOR_SISTEMA"||usuarioAtual.perfil==="GESTOR_CONTEUDO")) return true;
    usuarioAtual = { nome: sess.nome||sess.email.split("@")[0], email: sess.email, perfil: sess.perfil || "USUARIO_CONSULTA", logado: true, ativo: true, comarcas: Array.isArray(sess.comarcas)?sess.comarcas:[], viaConsulta: true };
    return true;
  }catch(e){ return false; }
}

function encerrarSessaoConsulta(){
  try{ sessionStorage.removeItem("pjes_auth_sessao"); }catch(e){}
  try{ localStorage.removeItem("pjes_consulta_sessao"); }catch(eLegado){}
}

function usuarioVisitante() {
  return {
    nome: "Visitante",
    email: "",
    perfil: "USUARIO_CONSULTA",
    logado: false,
    ativo: false
  };
}

function mensagemErroFrontend(erro, fallback) {
  if (erro?.message) return String(erro.message);
  if (typeof erro === "string" && erro.trim()) return erro;
  return fallback || "Ocorreu um erro inesperado.";
}

/**
 * Inicialização pública.
 *
 * A consulta carrega os telefones uma única vez.
 * O DashboardJS utiliza a mesma resposta para alimentar
 * o dashboard e a consulta.
 */
function iniciarSistema() {
  var sessaoSenhaRestaurada = false;
  try{ sessaoSenhaRestaurada = restaurarSessaoConsulta(); }catch(eRestaura){}
  /*
   * A sessão administrativa chega pronta do servidor:
   * com a versão única, o doGet já identificou a conta Google
   * e injetou PERFIL_ADMIN quando ela possui cargo ativo.
   */
  var perfilInjetado = String(
    (typeof window.PERFIL_ADMIN !== "undefined" && window.PERFIL_ADMIN) || ""
  ).trim();

  var emailInjetado = String(
    (typeof window.SESSAO_EMAIL !== "undefined" && window.SESSAO_EMAIL) || ""
  ).trim();

  if (perfilInjetado && emailInjetado) {
    usuarioAtual = {
      nome: emailInjetado.split("@")[0],
      email: emailInjetado,
      perfil: perfilInjetado,
      logado: true,
      ativo: true
    };
  } else if (!sessaoSenhaRestaurada) {
    usuarioAtual = usuarioVisitante();
  }

  /*
   * A ativação da interface nunca pode ser bloqueada por um erro
   * em uma rotina secundária (ex.: dark mode) — cada etapa é
   * protegida individualmente.
   */
  try {
    atualizarInterfaceUsuario();
  } catch (erro) {
    console.error("Falha ao atualizar interface:", erro);
  }

  try {
    carregarTelefones();
  } catch (erro) {
    console.error("Falha ao carregar telefones:", erro);
  }

  try {
    if (typeof iniciarDarkMode === "function") {
      iniciarDarkMode();
    }
  } catch (erro) {
    console.error("Falha ao iniciar dark mode:", erro);
  }

  /*
   * Atualiza os dados completos da sessão (nome, comarcas
   * permitidas etc.) de forma assíncrona.
   */
  if (typeof API !== "undefined" && typeof API.usuarioAtual === "function") {
    API.usuarioAtual(
      function(resposta) {
        if (!resposta || resposta.sucesso !== true || !resposta.dados) {
          return;
        }

        var dados = resposta.dados || {};

        if (dados.logado === true && dados.email) {
          usuarioAtual = {
            nome: dados.nome || dados.email.split("@")[0],
            email: dados.email,
            perfil: dados.perfil || "USUARIO_CONSULTA",
            logado: true,
            ativo: dados.ativo === true,
            comarcas: Array.isArray(dados.comarcas) ? dados.comarcas : []
          };

          atualizarInterfaceUsuario();
          // v3.32: garante recarregar Telefones quando comarcas chegam async apos login Google
          try{ if(typeof recarregarTelefonesAposLogin==="function" && dados && dados.perfil){ var _p=dados.perfil; if(_p==="GESTOR_CONTEUDO"||_p==="GESTOR_SISTEMA") setTimeout(function(){ try{ recarregarTelefonesAposLogin(); }catch(e){} }, 800); } }catch(e){}

          /*
           * As comarcas chegam de forma assíncrona:
           * re-renderiza a tabela e os filtros para que
           * os botões de edição reflitam a permissão.
           */
          try {
            if (
              typeof atualizarTabelaComFiltros ===
              "function"
            ) {
              atualizarTabelaComFiltros();
            } else if (
              typeof renderizarTabela ===
                "function" &&
              typeof listaTelefones !==
                "undefined"
            ) {
              renderizarTabela(
                listaTelefones
              );
            }
          } catch (erro) {
            console.error(
              "Falha ao atualizar tabela:",
              erro
            );
          }

          try {
            if (
              typeof carregarFiltros ===
              "function"
            ) {
              carregarFiltros();
            }
          } catch (erro) {
            console.error(
              "Falha ao atualizar filtros:",
              erro
            );
          }
        }
      },
      function() {}
    );
  }
  // v3.32: Telefones como aba inicial do Sistema
  try {
    setTimeout(function(){
      try{
        if (typeof navegarParaTelefones === "function") {
          navegarParaTelefones();
        } else if (typeof mostrarView === "function") {
          var _p = (typeof usuarioAtual !== "undefined" && usuarioAtual) ? String(usuarioAtual.perfil || "") : "";
          var _log = !!(typeof usuarioAtual !== "undefined" && usuarioAtual && usuarioAtual.logado === true);
          var _isGS = _log && _p === "GESTOR_SISTEMA";
          mostrarView("consulta-telefones-view"); // v3.33 GS usa mapa como GC/visitante
        }
      }catch(eInitTel){}
    }, 90);
  } catch(eInit){}
}

/**
 * Re-sincroniza a interface quando a página volta do cache
 * do navegador (botão voltar / bfcache).
 *
 * Corrige o problema em que, após entrar/sair do acesso
 * administrativo, a tela voltava com o mapa sumido e partes
 * da interface em estado antigo.
 */
window.addEventListener("pageshow", function(evento) {
  if (evento.persisted) {
    atualizarInterfaceUsuario();

    if (
      typeof mostrarMapaConsulta === "function" &&
      document.getElementById("consulta-telefones-view") &&
      !document
        .getElementById("consulta-telefones-view")
        .classList.contains("hidden") &&
      document.getElementById("consulta-detalhes-conteudo") &&
      getComputedStyle(
        document.getElementById("consulta-detalhes-conteudo")
      ).display === "none"
    ) {
      mostrarMapaConsulta();
    }
  }
});

function atualizarInterfaceUsuario() {
  const usuario = usuarioAtual || {};
  const nome = String(usuario.nome || "Visitante");
  const perfil = String(
    usuario.perfil || "USUARIO_CONSULTA"
  );
  const email = String(usuario.email || "").trim();
  const logado =
    usuario.logado === true &&
    Boolean(email);

  const userInfo =
    document.getElementById("user-info");

  if (userInfo) {
    userInfo.textContent = logado
      ? nome
      : "Visitante";
  }

  const sidebarUser =
    document.getElementById("sidebar-user");

  if (sidebarUser) {
    var emailSessao = String(
      (typeof window.SESSAO_EMAIL !== "undefined" && window.SESSAO_EMAIL) || ""
    ).trim();

    if (logado) {
      sidebarUser.textContent =
        "👤 " +
        email +
        "\nPerfil: " +
        formatarPerfil(perfil);
    } else if (emailSessao) {
      sidebarUser.textContent =
        "👤 " +
        emailSessao +
        "\nSem cargo administrativo";
    } else {
      sidebarUser.textContent =
        "Perfil: Usuário de Consulta";
    }
  }

  const configConta =
    document.getElementById("config-conta-conectada");

  if (configConta) {
    var emailSessao2 = String(
      (typeof window.SESSAO_EMAIL !== "undefined" && window.SESSAO_EMAIL) || ""
    ).trim();

    configConta.textContent = logado
      ? email
      : emailSessao2
        ? emailSessao2
        : "Nenhuma (acesso an\u00f4nimo)";
  }

  // --- Config premium: perfil, badge e comarcas ---
  try {
    var configPerfilEl = document.getElementById("config-conta-perfil");
    if (configPerfilEl) {
      if (logado) {
        configPerfilEl.textContent = formatarPerfil(perfil);
      } else {
        var emailSessaoP = String(
          (typeof window.SESSAO_EMAIL !== "undefined" && window.SESSAO_EMAIL) || ""
        ).trim();
        configPerfilEl.textContent = emailSessaoP
          ? "Sem cargo administrativo"
          : "Acesso an\u00f4nimo \u2014 consulta liberada";
      }
    }

    var configBadge = document.getElementById("config-conta-badge");
    if (configBadge) {
      var badgeTexto = "visitante";
      var badgeClasse = "config-conta-badge--visitante";
      if (logado && perfil === "GESTOR_SISTEMA") {
        badgeTexto = "Gestor do Sistema";
        badgeClasse = "config-conta-badge--sistema";
      } else if (logado && perfil === "GESTOR_CONTEUDO") {
        badgeTexto = "Gestor de Conte\u00fado";
        badgeClasse = "config-conta-badge--conteudo";
      } else if (logado) {
        badgeTexto = formatarPerfil(perfil);
        badgeClasse = "config-conta-badge--visitante";
      } else {
        var es = String(
          (typeof window.SESSAO_EMAIL !== "undefined" && window.SESSAO_EMAIL) || ""
        ).trim();
        badgeTexto = es ? "sem cargo" : "visitante";
        badgeClasse = "config-conta-badge--visitante";
      }
      configBadge.textContent = badgeTexto;
      configBadge.className = "config-conta-badge " + badgeClasse;
    }

    var comarcasWrap = document.getElementById("config-conta-comarcas-wrap");
    var comarcasList = document.getElementById("config-conta-comarcas");
    if (comarcasWrap && comarcasList) {
      var comarcasUsuario = Array.isArray(usuario.comarcas) ? usuario.comarcas : [];
      // Fallback: se usuarioAtual tiver comarcas em window
      if (!comarcasUsuario.length && Array.isArray(usuarioAtual.comarcas)) {
        comarcasUsuario = usuarioAtual.comarcas;
      }
      comarcasList.innerHTML = "";
      if (logado && perfil === "GESTOR_SISTEMA") {
        var chipAll = document.createElement("span");
        chipAll.className = "config-comarca-chip config-comarca-chip--all";
        chipAll.textContent = "Todas as comarcas";
        comarcasList.appendChild(chipAll);
        comarcasWrap.classList.remove("hidden");
      } else if (logado && perfil === "GESTOR_CONTEUDO" && comarcasUsuario.length) {
        comarcasUsuario.forEach(function(c){
          var chip = document.createElement("span");
          chip.className = "config-comarca-chip";
          chip.textContent = String(c);
          comarcasList.appendChild(chip);
        });
        comarcasWrap.classList.remove("hidden");
      } else if (logado && perfil === "GESTOR_CONTEUDO") {
        var chipTodas = document.createElement("span");
        chipTodas.className = "config-comarca-chip config-comarca-chip--all";
        chipTodas.textContent = "Todas as comarcas";
        comarcasList.appendChild(chipTodas);
        comarcasWrap.classList.remove("hidden");
      } else {
        comarcasWrap.classList.add("hidden");
      }
    }
  } catch (ePrem) {}

  const btnAcesso =
    document.getElementById(
      "btn-status-acesso"
    );

  const textoAcesso =
    document.getElementById(
      "texto-status-acesso"
    );

  if (btnAcesso && textoAcesso) {
    if (logado) {
      configurarBotaoAcesso(
        btnAcesso,
        textoAcesso,
        {
          texto: "SAIR",
          fundo: "#fee2e2",
          borda: "#dc2626",
          cor: "#991b1b",
          acao: tratarCliqueAcesso
        }
      );
    } else if (
      String(
        (typeof window.SESSAO_EMAIL !== "undefined" && window.SESSAO_EMAIL) || ""
      ).trim() &&
      !logado
    ) {
      /* Conta Google identificada, porém sem cargo administrativo. */
      var emailSessao3 = String(
        (typeof window.SESSAO_EMAIL !== "undefined" && window.SESSAO_EMAIL) || ""
      ).trim();

      var dominioSessao = String(
        (typeof window.DOMINIO_INSTITUCIONAL !== "undefined" && window.DOMINIO_INSTITUCIONAL) || ""
      ).trim();

      var ehInstitucional =
        dominioSessao &&
        emailSessao3.toLowerCase().endsWith("@" + dominioSessao.toLowerCase());

      configurarBotaoAcesso(
        btnAcesso,
        textoAcesso,
        ehInstitucional
          ? {
              texto: "Acesso Administrativo",
              fundo: "#dbeafe",
              borda: "#93c5fd",
              cor: "#1e40af",
              acao: function() {
                mostrarView("login-view");
              }
            }
          : {
              texto: "Trocar de conta Google",
              fundo: "#fee2e2",
              borda: "#dc2626",
              cor: "#991b1b",
              acao: fazerLogin
            }
      );
    } else if (
      perfil === "USUARIO_CONSULTA"
    ) {
      configurarBotaoAcesso(
        btnAcesso,
        textoAcesso,
        {
          texto: "Acesso Administrativo",
          fundo: "#dbeafe",
          borda: "#93c5fd",
          cor: "#1e40af",
          acao: function() {
            mostrarView("login-view");
          }
        }
      );
    } else {
      configurarBotaoAcesso(
        btnAcesso,
        textoAcesso,
        {
          texto: "Acesso Administrativo",
          fundo: "#fef3c7",
          borda: "#f59e0b",
          cor: "#92400e",
          acao: window.EH_CONTEXTO_ADMIN === true
            ? fazerLogin
            : irParaAdmin
        }
      );
    }
  }

  // --- Visibilidade por perfil ---
  // Usuário de Consulta: Dashboard oculto; Registro visível (adicionado).
  // Gestor de Conteúdo: como está.
  // Gestor de Sistema: todas menos Formulário de Acesso.

  const ehGestorSistema = logado && perfil === "GESTOR_SISTEMA";
  const ehGestorConteudo = logado && perfil === "GESTOR_CONTEUDO";
  const ehVisitante = !logado || perfil === "USUARIO_CONSULTA";

  const menuDashboard = document.getElementById("menu-dashboard");
  if (menuDashboard) {
    // Dashboard visível para todos (inclui Usuário de Consulta)
    menuDashboard.classList.remove("hidden");
  }

  const menuFormulario = document.getElementById("menu-formulario");
  if (menuFormulario) {
    // Formulário somente para visitantes / quem quer pedir acesso.
    // Gestor do Sistema não vê.
    menuFormulario.classList.toggle("hidden", ehGestorSistema);
  }

  const menuTelefones = document.getElementById("menu-telefones");
  if (menuTelefones) {
    // Telefones sempre visível (todos consultam); admin vê com edição
    menuTelefones.classList.remove("hidden");
  }

  const menuManual = document.getElementById("menu-manual");
  if (menuManual) {
    menuManual.classList.remove("hidden");
  }

  const menuSolicitacoes =
    document.getElementById(
      "menu-solicitacoes"
    );

  if (menuSolicitacoes) {
    menuSolicitacoes.classList.toggle(
      "hidden",
      !ehGestorSistema
    );
    if (ehGestorSistema) {
      try { atualizarBadgeSolicitacoes(); } catch(e){}
      try { iniciarPollingSolicitacoes(); } catch(e){}
    } else {
      try { pararPollingSolicitacoes(); } catch(e){}
    }
  }

  const menuNotificacoes =
    document.getElementById(
      "menu-notificacoes"
    );

  if (menuNotificacoes) {
    const mostrarNotificacoes = ehGestorConteudo;
    menuNotificacoes.classList.toggle(
      "hidden",
      !mostrarNotificacoes
    );
    if (mostrarNotificacoes) {
      try { atualizarBadgeNotificacoes(); } catch(e){}
      try { iniciarPollingNotificacoes(); } catch(e){}
    } else {
      try { pararPollingNotificacoes(); } catch(e){}
    }
  }

  const menuAlteracoes =
    document.getElementById(
      "menu-alteracoes"
    );

  if (menuAlteracoes) {
    // v3.32: Registro de Alterações oculto para Usuário de Consulta (visitante); GC/GS visível
    menuAlteracoes.classList.toggle("hidden", ehVisitante);
  }

  const menuUsuarios =
    document.getElementById(
      "menu-usuarios"
    );

  if (menuUsuarios) {
    menuUsuarios.classList.toggle(
      "hidden",
      !ehGestorSistema
    );
  }

  const menuLogin = document.getElementById("menu-login");
  if (menuLogin) {
    // Removido da sidebar para Usuário de Consulta (duplicado com botão azul inferior) — sempre oculto para visitante
    menuLogin.classList.add("hidden");
  }

  const menuFormularioLogin = document.getElementById("menu-formulario");
  if (menuFormularioLogin) {
    // Formulário visível sempre (para pedir consulta ou gestor), exceto Gestor Sistema
    menuFormularioLogin.classList.toggle("hidden", ehGestorSistema);
  }

  const btnNovo =
    document.getElementById(
      "btn-novo-telefone"
    );

  if (btnNovo) {
    btnNovo.style.display =
      logado &&
      perfil !== "USUARIO_CONSULTA"
        ? ""
        : "none";
  }

  // Hint de escopo na aba Telefones (gestor de conteúdo limitado)
  try {
    var subtitulo = document.getElementById("telefones-subtitulo");
    var escopoInfo = document.getElementById("telefones-escopo-info");

    if (subtitulo && escopoInfo) {
      if (logado && perfil === "GESTOR_CONTEUDO" && Array.isArray(usuario.comarcas) && usuario.comarcas.length > 0) {
        subtitulo.textContent = "Gerenciamento de telefones — suas comarcas: " + usuario.comarcas.join(", ");
        escopoInfo.textContent = "Você só pode adicionar/editar/excluir contatos das comarcas acima. Outras comarcas aparecem com 🔒 Solicitar acesso.";
        escopoInfo.style.display = "block";
      } else if (logado && perfil === "GESTOR_CONTEUDO") {
        subtitulo.textContent = "Gerenciamento de telefones do Poder Judiciário do Estado do Espírito Santo";
        escopoInfo.textContent = "";
        escopoInfo.style.display = "none";
      } else if (logado && perfil === "GESTOR_SISTEMA") {
        subtitulo.textContent = "Gerenciamento de telefones do Poder Judiciário do Estado do Espírito Santo";
        escopoInfo.textContent = "Gestor do Sistema — acesso a todas as comarcas.";
        escopoInfo.style.display = "block";
      } else {
        subtitulo.textContent = "Gerenciamento de telefones do Poder Judiciário do Estado do Espírito Santo";
        escopoInfo.style.display = "none";
      }
    }
  } catch (e) {}

  // --- Botões de impressão por perfil e view ---
  try {
    var isDashboard = (function(){ var el=document.getElementById("dashboard-view"); return !!(el && !el.classList.contains("hidden")); })();
    var isTelefones = (function(){ var el=document.getElementById("telefones-view"); return !!(el && !el.classList.contains("hidden")); })();
    var isConsulta = (function(){ var el=document.getElementById("consulta-telefones-view"); return !!(el && !el.classList.contains("hidden")); })();
    var isUsuarios = (function(){ var el=document.getElementById("usuarios-view"); return !!(el && !el.classList.contains("hidden")); })();
    var ehGestor = logado && (perfil === "GESTOR_SISTEMA" || perfil === "GESTOR_CONTEUDO");

    var btnDashboard = document.getElementById("btn-imprimir-dashboard");
    if (btnDashboard) {
      btnDashboard.style.display = isDashboard ? "" : "none";
    }
    var btnTelefones = document.getElementById("btn-imprimir-telefones");
    if (btnTelefones) {
      // Apenas Gestor do Sistema vê o Imprimir da tabela; Gestor Conteúdo usa o botão da consulta
      btnTelefones.style.display = (ehGestorSistema && isTelefones) ? "" : "none";
    }
    var btnNovoTelefone = document.getElementById("btn-novo-telefone");
    if (btnNovoTelefone) {
      // Gestor Sistema sempre; Gestor Conteúdo agora usa o botão da consulta (mapa)
      btnNovoTelefone.style.display = (ehGestorSistema && isTelefones) ? "" : "none";
      btnNovoTelefone.disabled = !ehGestorSistema;
    }
    var btnConsultaTodos = document.getElementById("btn-imprimir-consulta-todos");
    if (btnConsultaTodos) {
      // Visitante e Gestor de Conteúdo (mapa) podem imprimir todos os contatos; Gestor Sistema usa Imprimir/PDF da tabela
      var podeImprimirConsulta = isConsulta && (ehVisitante || ehGestorConteudo || ehGestorSistema); // v3.33 GS usa mapa
      btnConsultaTodos.style.display = podeImprimirConsulta ? "" : "none";
    }
    // Novo Contato no mapa para Gestor de Conteúdo
    var btnNovoNoConsulta = document.getElementById("btn-novo-telefone-consulta");
    if (btnNovoNoConsulta) {
      btnNovoNoConsulta.style.display = ((ehGestorConteudo || ehGestorSistema) && isConsulta) ? "" : "none"; // v3.33 GS usa mapa
    }
    var btnUsuarios = document.getElementById("btn-imprimir-usuarios");
    if (btnUsuarios) {
      btnUsuarios.style.display = (ehGestorSistema && isUsuarios) ? "" : "none";
    }
    // Compatibilidade: esconde stubs legados permanentemente
    ["btn-imprimir-todas-comarcas","btn-imprimir-todos-numeros","btn-imprimir-esta-pagina","btn-imprimir-consulta"].forEach(function(id){
      var el=document.getElementById(id);
      if(el){ el.style.display="none"; el.classList.add("hidden"); el.setAttribute("aria-hidden","true"); }
    });
    // M6/L4: Setor filter visibility — only Gestor Sistema in Telefones view
    var gSetor=document.getElementById("grupo-filtro-setor"); if(gSetor) gSetor.style.display = (ehGestorSistema && isTelefones) ? "" : "none";
  } catch(ePrint){}

  // v3.29: GC never renders tabela — evita hijack dashboard→consulta quando GC navega
  try{
    const _isGCNoRender = (typeof usuarioAtual!=="undefined" && usuarioAtual && usuarioAtual.logado===true && (String(usuarioAtual.perfil||"").toUpperCase()==="GESTOR_CONTEUDO" || String(usuarioAtual.perfil||"").toUpperCase()==="GESTOR_SISTEMA")); // v3.33 GS tambem usa mapa p/ Telefones
    if(!_isGCNoRender && typeof listaTelefones !==
      "undefined" &&
    document.getElementById(
      "corpo-tabela-telefones"
    ) &&
    typeof renderizarTabela ===

function fazerLogin() {
  /*
   * Várias contas Google logadas no navegador: o Google pode usar
   * a conta errada (ex.: conta pessoal), deixando o usuário como
   * visitante. O seletor de contas com dica de domínio institucional
   * (hd=) força a escolha da conta @<dominio>.
   *
   * continue usa a URL ADMINISTRATIVA canônica (nunca a URL do
   * iframe script.googleusercontent.com — que o Google rejeita
   * com erro 400).
   */
  var dominio = String(
    (typeof window.DOMINIO_INSTITUCIONAL !== "undefined" && window.DOMINIO_INSTITUCIONAL) || ""
  ).trim();

  var destino =
    String(
      (typeof window.URL_ADMIN !== "undefined" && window.URL_ADMIN) || ""
    ).trim() ||
    String(
      (typeof window.URL_SISTEMA !== "undefined" && window.URL_SISTEMA) || ""
    ).trim();

  if (!destino) {
    mostrarToast("URL do sistema não disponível.", "error");
    return;
  }

  var urlLogin =
    "https://accounts.google.com/AccountChooser" +
    "?continue=" +
    encodeURIComponent(destino) +
    (dominio ? "&hd=" + encodeURIComponent(dominio) : "") +
    "&flowName=GlifWebSignIn" +
    "&flowEntry=AccountChooser";

  window.location.href = urlLogin;
}

let _pollingNotificacoesTimer = null;

function atualizarBadgeNotificacoes(){
  try{
    const badge = document.getElementById("badge-notificacoes");
    if(!badge) return;
    const ehGestor = (usuarioAtual && usuarioAtual.logado === true && (usuarioAtual.perfil === "GESTOR_SISTEMA" || usuarioAtual.perfil === "GESTOR_CONTEUDO"));
    if(!ehGestor){
      badge.classList.add("hidden");
      badge.textContent = "0";
      return;
    }
    const email = (usuarioAtual && usuarioAtual.email) ? String(usuarioAtual.email).trim() : "";
    if(!email){
      badge.classList.add("hidden");
      badge.textContent = "0";
      return;
    }
    if(typeof API === "undefined" || typeof API.contarNaoLidas !== "function") return;
    API.contarNaoLidas(email,
      function(resposta){
        try{
          let total = 0;
          if(resposta && resposta.sucesso === true && resposta.dados){
            if(typeof resposta.dados.total === "number") total = resposta.dados.total;
            else if(typeof resposta.dados.count === "number") total = resposta.dados.count;
            else if(typeof resposta.dados === "number") total = resposta.dados;
            else if(typeof resposta.dados.naoLidas === "number") total = resposta.dados.naoLidas;
          }
          if(total > 0){
            badge.textContent = total > 99 ? "99+" : String(total);
            badge.classList.remove("hidden");
          } else {
            badge.textContent = "0";
            badge.classList.add("hidden");
          }
        }catch(e){}
      },
      function(){}
    );
  }catch(e){}
}

/**
 * "SAIR" — logout suave para Usuário de Consulta.
 *
 * Antes fazia redirect para accounts.google.com/logout?continue=SCRIPT_URL,
 * mas com implantação morta (404/403) o Google devolvia 403. Agora não navega:
 * limpa a sessão no servidor (encerrarSessao) e localmente volta ao estado
 * visitante, sem depender do continue=. O Google só volta a ser tocado via
 * "Acesso Administrativo" -> AccountChooser quando o usuário quiser logar de novo.
 */
function tratarCliqueAcesso() {
  if (
    !confirm(
      "Deseja sair e voltar ao modo visitante?"
    )
  ) {
    return;
  }

  function finalizarSaidaLocal() {
    usuarioAtual = usuarioVisitante();
    try{ encerrarSessaoConsulta(); }catch(eSess){}

    try {
      window.PERFIL_ADMIN = "";
    } catch (erro) {}

    try {
      window.SESSAO_EMAIL = "";
    } catch (erro) {}

    atualizarInterfaceUsuario();

    try {
      mostrarView("consulta-telefones-view");
    } catch (erro) {
      try {
        mostrarView("dashboard-view");
      } catch (erro2) {}
    }

    mostrarToast("Você saiu do acesso administrativo.", "info");
  }

  if (
    typeof API !== "undefined" &&
    typeof API.logout === "function"
  ) {
    API.logout(
      function() {
        finalizarSaidaLocal();
      },
      function(erro) {
        console.warn("logout falhou, saindo localmente", erro);
        finalizarSaidaLocal();
      }
    );
  } else {
    finalizarSaidaLocal();
  }
}

/**

function mostrarView(viewId) {
  // --- Bloqueio por perfil ---
  try {
    var p = (typeof usuarioAtual !== "undefined" && usuarioAtual) ? String(usuarioAtual.perfil || "USUARIO_CONSULTA") : "USUARIO_CONSULTA";
    var logado = !!(typeof usuarioAtual !== "undefined" && usuarioAtual && usuarioAtual.logado === true);
    var ehGestorSistema = logado && p === "GESTOR_SISTEMA";
    var ehVisitante = !logado || p === "USUARIO_CONSULTA";

    if (viewId === "formulario-acesso-view" && ehGestorSistema) {
      mostrarToast("Gestores não precisam solicitar acesso.", "info");
      viewId = "dashboard-view";
    }

    // v3.32: Registro de Alterações bloqueado para visitante; liberado para Gestor Conteúdo/Sistema
    if (viewId === "registro-alteracoes-view" && ehVisitante) {
      mostrarToast("Acesso restrito. Faça login como Gestor para ver o Registro de Alterações.", "warning");
      viewId = "dashboard-view";
    }

    // login/senha-gerada são públicas — quando já logado, redireciona ao dashboard
    if ((viewId === "login-view" || viewId === "senha-gerada-view") && logado) {
      // Consulta já logado não precisa ver login novamente — vai ao dashboard
      if (p === "USUARIO_CONSULTA") {
        viewId = "dashboard-view";
      }
    }

    // manual-view é livre para todos os perfis — sem bloqueio.

  } catch (e) {}

  // v3.30: ao sair de Telefones, reset para próximo entrar limpo
  try{
    var _prevTelefones = document.getElementById("telefones-view");
    var _prevConsulta = document.getElementById("consulta-telefones-view");
    var _wasTelefones = (_prevTelefones && !_prevTelefones.classList.contains("hidden")) || (_prevConsulta && !_prevConsulta.classList.contains("hidden"));
    var _isAtTelefones = viewId==="telefones-view" || viewId==="consulta-telefones-view";
    if(_wasTelefones && !_isAtTelefones){
      try{ resetarTelefonesView(); }catch(e){}
    }
  }catch(e){}
  const views =
    document.querySelectorAll(
      ".view, [id$='-view']"
    );

  views.forEach(view =>
    view.classList.add("hidden")
  );

  const target =
    document.getElementById(
      viewId
    );

  if (!target) {
    mostrarToast(
      "Esta tela não foi encontrada.",
      "warning"
    );
    return;
  }

  try{ target.classList.remove(
    "hidden"
  ); }catch(e){ try{ target.style.display=""; }catch(e2){} }

  document
    .querySelectorAll(".menu-item")
    .forEach(botao => {
      botao.classList.remove(
        "active"
      );

      const onclick =
        botao.getAttribute(
          "onclick"
        ) || "";

      if (
        onclick.includes(viewId)
      ) {
        botao.classList.add(
          "active"
        );
      }
    });

  // v3.32: Telefones abrange telefones-view e consulta-telefones-view — marca menu-telefones como ativo
  try {
    if (viewId === "telefones-view" || viewId === "consulta-telefones-view") {
      var _btnTel = document.getElementById("menu-telefones");
      if (_btnTel) _btnTel.classList.add("active");
    }
  } catch(eActiveTel) {}

  try{ if(typeof atualizarInterfaceUsuario==="function") atualizarInterfaceUsuario(); }catch(eUpd){}
  if(viewId==="consulta-telefones-view"){
    try{ if(typeof aoEntrarConsultaTelefonesView==="function") setTimeout(aoEntrarConsultaTelefonesView, 80); }catch(e){}
    try{ if(typeof renderizarMapaConsulta==="function" && typeof mapaPendenteInit!=="undefined") setTimeout(function(){ if(typeof tentarInicializarMapa==="function") tentarInicializarMapa(); }, 160); }catch(e2){}
  }

  if (
    viewId ===
      "registro-alteracoes-view" &&
    typeof carregarRegistroAlteracoes ===
      "function"
  ) {
    carregarRegistroAlteracoes();
  }

  if (
    viewId ===
      "solicitacoes-view" &&
    typeof carregarSolicitacoes ===
      "function"
  ) {
    carregarSolicitacoes();
    try{ setTimeout(atualizarBadgeSolicitacoes, 400); }catch(e){}
  }

  if (
    viewId ===
      "notificacoes-view"
  ) {
    const _pNotif = (typeof usuarioAtual!=="undefined" && usuarioAtual) ? String(usuarioAtual.perfil||"").toUpperCase() : "";
    const _logNotif = !!(typeof usuarioAtual!=="undefined" && usuarioAtual && usuarioAtual.logado===true);
    if(!(_logNotif && _pNotif==="GESTOR_CONTEUDO")){
      mostrarToast("Acesso restrito a Gestor de Conteúdo.", "warning");
      viewId="dashboard-view";
      const _t2=document.getElementById(viewId);
      if(_t2) _t2.classList.remove("hidden");
      return;
    }
    if(typeof carregarNotificacoes ==="function") carregarNotificacoes();
    if(typeof atualizarBadgeNotificacoes ==="function") try{ setTimeout(atualizarBadgeNotificacoes, 400); }catch(e){}
  }

  if (
    viewId ===
      "usuarios-view" &&
    typeof carregarUsuarios ===
      "function"
  ) {
    carregarUsuarios();
  }
}

/**
 * ----------------------------------------------------------
 * DARK MODE
 * ----------------------------------------------------------
 */

function iniciarDarkMode() {
  aplicarModoEscuro();
}

function aplicarModoEscuro() {
  const ativo =
    localStorage.getItem("darkMode") === "true";

  document.body.classList.toggle(
    "dark-mode",
    ativo
  );

  const toggle =
    document.getElementById(
      "toggle-dark-mode"
    );

  if (toggle) {
    toggle.checked = ativo;
  }
}

function alternarModoEscuro(ativo) {
  document.body.classList.toggle(
    "dark-mode",
    Boolean(ativo)
  );

  localStorage.setItem(
    "darkMode",
    ativo ? "true" : "false"
  );

  try {
    var light = document.querySelector(".config-preview-light");
    var dark = document.querySelector(".config-preview-dark");
    if (light && dark) {
      if (ativo) {
        dark.style.outline = "2px solid #2563eb";
        dark.style.outlineOffset = "1px";
        light.style.outline = "none";
      } else {
        light.style.outline = "2px solid #2563eb";
        light.style.outlineOffset = "1px";
        dark.style.outline = "none";
      }
    }
  } catch(e){}
}
// Sincroniza preview da aparencia ao carregar
document.addEventListener("DOMContentLoaded", function() {
  try {
    var ativo = localStorage.getItem("darkMode") === "true";
    var light = document.querySelector(".config-preview-light");
    var dark = document.querySelector(".config-preview-dark");
    if (light && dark) {
      if (ativo) {
        dark.style.outline = "2px solid #2563eb";
        dark.style.outlineOffset = "1px";
      } else {
        light.style.outline = "2px solid #2563eb";
        light.style.outlineOffset = "1px";
      }
      // Clique nos previews alterna o toggle
      light.style.cursor = "pointer";
      dark.style.cursor = "pointer";
      light.addEventListener("click", function(){ var t=document.getElementById("toggle-dark-mode"); if(t){ t.checked=false; alternarModoEscuro(false); }});
      dark.addEventListener("click", function(){ var t=document.getElementById("toggle-dark-mode"); if(t){ t.checked=true; alternarModoEscuro(true); }});
    }
  } catch(e){}
});

document.addEventListener(
  "DOMContentLoaded",
  aplicarModoEscuro
);
