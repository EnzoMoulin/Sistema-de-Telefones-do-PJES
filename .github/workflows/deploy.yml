name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Adicione outro item com target: interno e secret_name: CLASPRC_INTERNO
          # quando o deploy interno voltar a ser habilitado.
          - target: externo
            secret_name: CLASPRC_EXTERNO
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Clasp
      run: npm install -g @google/clasp

    - name: Create clasprc.json
      env:
        CLASPRC_CONTENT: ${{ secrets[matrix.secret_name] }}
      run: |
        test -n "$CLASPRC_CONTENT" || { echo "Secret ${SECRET_NAME} não configurado." >&2; exit 1; }
        printf '%s' "$CLASPRC_CONTENT" > ~/.clasprc.json
      shell: bash
      env:
        CLASPRC_CONTENT: ${{ secrets[matrix.secret_name] }}
        SECRET_NAME: ${{ matrix.secret_name }}

    - name: Select Clasp project
      run: cp ".clasp.${{ matrix.target }}.json.example" .clasp.json

    - name: Push code to Apps Script (${{ matrix.target }})
      run: clasp push -f
