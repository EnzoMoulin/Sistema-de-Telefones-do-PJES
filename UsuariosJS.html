<script>
var unidadesUsuarios = [];

function carregarUsuarios(){
  API.listarUnidadesParaAcesso(function(respUnidades){
    unidadesUsuarios = respUnidades && respUnidades.sucesso === true ? (respUnidades.dados || []) : [];
    preencherUnidadesNovoUsuario();
    API.listarUsuarios(function(resp){
      if(!resp || resp.sucesso !== true){ mostrarToast((resp&&resp.erro)||"Erro ao carregar usuários.","error"); return; }
      renderizarUsuarios(resp.dados || []);
    }, function(erro){ mostrarToast((erro&&erro.message)||"Falha de comunicação.","error"); });
  }, function(erro){ mostrarToast((erro&&erro.message)||"Falha ao carregar Unidades.","error"); });
}

function seletorUnidadesUsuario(ids, nivel){
  var select=document.createElement("select"); select.multiple=true; select.size=5; select.style.minWidth="260px"; select.disabled=Number(nivel)!==1;
  var atuais=new Set(Array.isArray(ids)?ids:[]);
  unidadesUsuarios.forEach(function(u){ var op=document.createElement("option"); op.value=u.id; op.textContent=[u.municipio,u.forum,u.nome].filter(Boolean).join(" — "); op.selected=atuais.has(u.id); select.appendChild(op); });
  return select;
}

function renderizarUsuarios(lista){
  var tbody=document.getElementById("corpo-tabela-usuarios"); if(!tbody)return; tbody.textContent="";
  if(!lista.length){ var tr0=document.createElement("tr"); var td0=document.createElement("td"); td0.colSpan=6; td0.textContent="Nenhum usuário cadastrado."; tr0.appendChild(td0); tbody.appendChild(tr0); return; }
  lista.forEach(function(u){
    var tr=document.createElement("tr");
    var tdEmail=document.createElement("td"); tdEmail.textContent=u.email; tr.appendChild(tdEmail);
    var tdNome=document.createElement("td"); var nome=document.createElement("input"); nome.value=u.nome||""; nome.maxLength=150; tdNome.appendChild(nome); tr.appendChild(tdNome);
    var tdNivel=document.createElement("td"); var nivel=document.createElement("select"); nivel.innerHTML='<option value="1">1 — Conteúdo</option><option value="2">2 — Sistema</option>'; nivel.value=String(u.nivel); tdNivel.appendChild(nivel); tr.appendChild(tdNivel);
    var tdUnidades=document.createElement("td"); var unidades=seletorUnidadesUsuario(u.unidadeIds,u.nivel); tdUnidades.appendChild(unidades); tr.appendChild(tdUnidades);
    nivel.addEventListener("change",function(){ unidades.disabled=Number(nivel.value)!==1; if(unidades.disabled) Array.from(unidades.options).forEach(function(o){o.selected=false;}); });
    var tdAtivo=document.createElement("td"); var ativo=document.createElement("input"); ativo.type="checkbox"; ativo.checked=u.ativo===true; tdAtivo.appendChild(ativo); tr.appendChild(tdAtivo);
    var tdAcoes=document.createElement("td");
    var salvar=document.createElement("button"); salvar.type="button"; salvar.className="btn btn-primary"; salvar.textContent="Salvar"; salvar.onclick=function(){ salvarUsuario(u.email,{nome:nome.value,nivel:Number(nivel.value),ativo:ativo.checked,unidadeIds:Array.from(unidades.selectedOptions).map(function(o){return o.value;})},salvar); };
    var excluir=document.createElement("button"); excluir.type="button"; excluir.className="btn btn-danger"; excluir.textContent="Excluir"; excluir.style.marginLeft="6px"; excluir.onclick=function(){ excluirUsuario(u.email,excluir); };
    tdAcoes.appendChild(salvar); tdAcoes.appendChild(excluir); tr.appendChild(tdAcoes); tbody.appendChild(tr);
  });
}

function salvarUsuario(email,dados,botao){
  if(Number(dados.nivel)===1 && !dados.unidadeIds.length){ mostrarToast("Selecione ao menos uma Unidade para o nível 1.","warning"); return; }
  botao.disabled=true; API.atualizarUsuario(email,dados,function(resp){ botao.disabled=false; if(resp&&resp.sucesso===true){mostrarToast("Usuário atualizado.","success");carregarUsuarios();}else mostrarToast((resp&&resp.erro)||"Falha ao atualizar.","error"); },function(erro){botao.disabled=false;mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");});
}

function excluirUsuario(email,botao){
  if(!confirm("Excluir o acesso de "+email+"?"))return; botao.disabled=true;
  API.excluirUsuario(email,function(resp){botao.disabled=false;if(resp&&resp.sucesso===true){mostrarToast("Usuário excluído.","success");carregarUsuarios();}else mostrarToast((resp&&resp.erro)||"Falha ao excluir.","error");},function(erro){botao.disabled=false;mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");});
}

function preencherUnidadesNovoUsuario(){
  var select=document.getElementById("novo-usuario-unidades"); if(!select)return; select.textContent="";
  unidadesUsuarios.forEach(function(u){var op=document.createElement("option");op.value=u.id;op.textContent=[u.municipio,u.forum,u.nome].filter(Boolean).join(" — ");select.appendChild(op);});
}
function abrirModalAdicionarUsuario(){document.getElementById("modal-adicionar-usuario")?.classList.remove("hidden");preencherUnidadesNovoUsuario();alternarUnidadesNovoUsuario();}
function fecharModalAdicionarUsuario(){document.getElementById("modal-adicionar-usuario")?.classList.add("hidden");}
function alternarUnidadesNovoUsuario(){var nivel=Number(document.getElementById("novo-usuario-nivel")?.value||0);var grupo=document.getElementById("grupo-novo-usuario-unidades");if(grupo)grupo.style.display=nivel===1?"":"none";}
function salvarNovoUsuario(){
  var email=String(document.getElementById("novo-usuario-email")?.value||"").trim(); var nome=String(document.getElementById("novo-usuario-nome")?.value||"").trim(); var nivel=Number(document.getElementById("novo-usuario-nivel")?.value||0); var ativo=document.getElementById("novo-usuario-ativo")?.checked===true; var select=document.getElementById("novo-usuario-unidades"); var unidadeIds=select?Array.from(select.selectedOptions).map(function(o){return o.value;}):[];
  if(nivel===1&&!unidadeIds.length){mostrarToast("Selecione ao menos uma Unidade.","warning");return;} var btn=document.getElementById("btn-salvar-novo-usuario");btn.disabled=true;
  API.criarUsuario({email:email,nome:nome,nivel:nivel,ativo:ativo,unidadeIds:unidadeIds},function(resp){btn.disabled=false;if(resp&&resp.sucesso===true){fecharModalAdicionarUsuario();mostrarToast("Usuário criado.","success");carregarUsuarios();}else mostrarToast((resp&&resp.erro)||"Falha ao criar.","error");},function(erro){btn.disabled=false;mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");});
}
function imprimirUsuarios(){window.print();}
</script>
