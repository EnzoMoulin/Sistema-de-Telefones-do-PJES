<script>
function carregarSolicitacoes(){
  API.listarSolicitacoes(function(resp){
    if(!resp||resp.sucesso!==true){mostrarToast((resp&&resp.erro)||"Erro ao carregar solicitações.","error");return;}
    renderizarSolicitacoes(resp.dados||[]);
  },function(erro){mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");});
}
var solicitacaoEmDetalhe=null;
function celulaSolicitacao(valor){var td=document.createElement("td");td.textContent=valor===null||valor===undefined||String(valor).trim()===""?"-":String(valor);return td;}
function renderizarSolicitacoes(lista){
  var tbody=document.getElementById("corpo-tabela-solicitacoes");if(!tbody)return;tbody.textContent="";
  if(!lista.length){var tr0=document.createElement("tr"),td0=document.createElement("td");td0.colSpan=4;td0.textContent="Nenhuma solicitação pendente.";td0.style.textAlign="center";tr0.appendChild(td0);tbody.appendChild(tr0);return;}
  lista.forEach(function(sol){
    var tr=document.createElement("tr");tr.tabIndex=0;tr.style.cursor="pointer";tr.title="Clique para ver e decidir esta solicitação";
    tr.appendChild(celulaSolicitacao(sol.nome));tr.appendChild(celulaSolicitacao(sol.email));tr.appendChild(celulaSolicitacao(sol.nivelTexto));tr.appendChild(celulaSolicitacao(sol.status));
    tr.onclick=function(){abrirModalSolicitacao(sol);};tr.onkeydown=function(evento){if(evento.key==="Enter"||evento.key===" "){evento.preventDefault();abrirModalSolicitacao(sol);}};tbody.appendChild(tr);
  });
}
function abrirModalSolicitacao(sol){solicitacaoEmDetalhe=sol;var alvo=document.getElementById("detalhes-solicitacao");alvo.textContent="";[["Nome",sol.nome],["E-mail",sol.email],["Nível de acesso",sol.nivelTexto],["Localidades solicitadas",(sol.acessosSolicitados||[]).join(" • ")||"Nenhuma"],["Justificativa",sol.justificativa||"Não informada"],["Status",sol.status]].forEach(function(item){var bloco=document.createElement("div");bloco.style.marginBottom="14px";var titulo=document.createElement("strong");titulo.textContent=item[0];var valor=document.createElement("div");valor.textContent=item[1];valor.style.marginTop="4px";valor.style.whiteSpace="pre-wrap";bloco.appendChild(titulo);bloco.appendChild(valor);alvo.appendChild(bloco);});document.getElementById("modal-solicitacao").classList.remove("hidden");}
function fecharModalSolicitacao(){document.getElementById("modal-solicitacao").classList.add("hidden");solicitacaoEmDetalhe=null;}
function decidirSolicitacao(status){if(!solicitacaoEmDetalhe)return;var aprovando=status==="APROVADO";confirmarAcaoSistema({titulo:aprovando?"Aprovar solicitação":"Rejeitar solicitação",mensagem:(aprovando?"Aprovar":"Rejeitar")+" esta solicitação de acesso?",textoConfirmar:aprovando?"Aprovar":"Rejeitar",perigo:!aprovando,icone:aprovando?"✓":"!"}).then(function(confirmado){if(!confirmado||!solicitacaoEmDetalhe)return;var api=aprovando?API.aprovarSolicitacao:API.rejeitarSolicitacao;api(solicitacaoEmDetalhe.id,function(resp){if(resp&&resp.sucesso===true){fecharModalSolicitacao();mostrarToast(aprovando?"Solicitação aprovada.":"Solicitação rejeitada.",aprovando?"success":"info");carregarSolicitacoes();}else mostrarToast((resp&&resp.erro)||"Falha ao processar solicitação.","error");},function(erro){mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");});});}
function aprovarSolicitacaoAtual(){decidirSolicitacao("APROVADO");}
function rejeitarSolicitacaoAtual(){decidirSolicitacao("REJEITADO");}
</script>
