<script>
function carregarSolicitacoes(){
  API.listarSolicitacoes(function(resp){
    if(!resp||resp.sucesso!==true){mostrarToast((resp&&resp.erro)||"Erro ao carregar solicitações.","error");return;}
    renderizarSolicitacoes(resp.dados||[]);
  },function(erro){mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");});
}
function celulaSolicitacao(valor){var td=document.createElement("td");td.textContent=valor===null||valor===undefined||String(valor).trim()===""?"-":String(valor);return td;}
function renderizarSolicitacoes(lista){
  var tbody=document.getElementById("corpo-tabela-solicitacoes");if(!tbody)return;tbody.textContent="";
  if(!lista.length){var tr0=document.createElement("tr"),td0=document.createElement("td");td0.colSpan=7;td0.textContent="Nenhuma solicitação pendente.";td0.style.textAlign="center";tr0.appendChild(td0);tbody.appendChild(tr0);return;}
  lista.forEach(function(sol){
    var tr=document.createElement("tr");tr.appendChild(celulaSolicitacao(sol.email));tr.appendChild(celulaSolicitacao(sol.nome));
    tr.appendChild(celulaSolicitacao(sol.nivelSolicitado+" — "+(sol.nivelSolicitado===1?"Gestor de Conteúdo":"Gestor do Sistema")));
    tr.appendChild(celulaSolicitacao((sol.unidadesSolicitadas||sol.unidadeIds||[]).join(", ")));tr.appendChild(celulaSolicitacao(sol.justificativa));tr.appendChild(celulaSolicitacao(sol.status));
    var acoes=document.createElement("td");var aprovar=document.createElement("button");aprovar.type="button";aprovar.className="btn btn-primary";aprovar.textContent="Aprovar";aprovar.onclick=function(){aprovarSolicitacao(sol.id,sol.nivelSolicitado);};var rejeitar=document.createElement("button");rejeitar.type="button";rejeitar.className="btn btn-danger";rejeitar.textContent="Rejeitar";rejeitar.style.marginLeft="6px";rejeitar.onclick=function(){rejeitarSolicitacao(sol.id);};acoes.appendChild(aprovar);acoes.appendChild(rejeitar);tr.appendChild(acoes);tbody.appendChild(tr);
  });
}
function aprovarSolicitacao(id,nivel){if(!confirm("Aprovar esta solicitação de nível "+nivel+"?"))return;API.aprovarSolicitacao(id,function(resp){if(resp&&resp.sucesso===true){mostrarToast("Solicitação aprovada.","success");carregarSolicitacoes();}else mostrarToast((resp&&resp.erro)||"Falha ao aprovar.","error");},function(erro){mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");});}
function rejeitarSolicitacao(id){if(!confirm("Rejeitar esta solicitação?"))return;API.rejeitarSolicitacao(id,function(resp){if(resp&&resp.sucesso===true){mostrarToast("Solicitação rejeitada.","info");carregarSolicitacoes();}else mostrarToast((resp&&resp.erro)||"Falha ao rejeitar.","error");},function(erro){mostrarToast((erro&&erro.message)||"Falha de comunicação.","error");});}
</script>
