<script>
function atualizarVersaoSidebar() {
  var elemento = document.getElementById("sidebar-version-num");
  if (!elemento) return;

  var versao =
    (typeof window.SISTEMA_VERSAO !== "undefined" && window.SISTEMA_VERSAO) ||
    "5.0";

  elemento.textContent = String(versao);
}

document.addEventListener("DOMContentLoaded", atualizarVersaoSidebar);
</script>
