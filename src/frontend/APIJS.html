function criarRunnerAPI(sucesso, erro) {
  let runner = google.script.run.withSuccessHandler(
    typeof sucesso === "function" ? sucesso : function () {}
  );
  if (typeof erro === "function") runner = runner.withFailureHandler(erro);
  else runner = runner.withFailureHandler(function (falha) {
    console.error("Erro na comunicação com o servidor:", falha);
  });
  return runner;
}
