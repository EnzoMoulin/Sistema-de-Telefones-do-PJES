<script>
(function () {
  "use strict";

  function normalizarNome(valor) {
    return String(valor == null ? "" : valor)
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]/g, "")
      .toUpperCase();
  }

  function nomeFeature(feature) {
    var p = feature && feature.properties || {};
    return String(p.name || p.NOME || p.NM_MUN || p.description || "").trim();
  }

  function codigoFeature(feature) {
    var p = feature && feature.properties || {};
    return String(p.id || p.CD_MUN || p.codmun || p.code || "").replace(/\D/g, "");
  }

  function localizarCardMunicipio(nome) {
    var alvo = normalizarNome(nome);
    if (!alvo) return null;
    return Array.prototype.slice.call(
      document.querySelectorAll('#fc-content .fc-card[data-mun]')
    ).find(function (card) {
      var titulo = card.querySelector("h4");
      return normalizarNome(titulo ? titulo.textContent : "") === alvo;
    }) || null;
  }

  function localizarOpcaoMunicipio(nome) {
    var select = document.getElementById("fc-search");
    if (!select || String(select.tagName || "").toUpperCase() !== "SELECT") return null;
    var alvo = normalizarNome(nome);
    var opcao = Array.prototype.slice.call(select.options || []).find(function (item) {
      return normalizarNome(item.textContent || "") === alvo;
    });
    return opcao ? { select: select, option: opcao } : null;
  }

  function executarAbertura(nome) {
    var card = localizarCardMunicipio(nome);
    if (card) {
      card.click();
      return true;
    }

    var opcao = localizarOpcaoMunicipio(nome);
    if (opcao) {
      opcao.select.value = opcao.option.value;
      opcao.select.dispatchEvent(new Event("change", { bubbles: true }));
      return true;
    }

    return false;
  }

  function abrirMunicipioPorNome(nome) {
    if (executarAbertura(nome)) return true;

    if (typeof window.fcInicio !== "function") return false;
    window.fcInicio();

    var tentativas = 0;
    var timer = setInterval(function () {
      tentativas += 1;
      if (executarAbertura(nome) || tentativas >= 20) {
        clearInterval(timer);
      }
    }, 25);
    return true;
  }

  function instalarCliqueDeterministicoMapa() {
    if (!window.L || typeof window.L.geoJSON !== "function") return false;
    if (window.L.geoJSON.__pjesMapClickFixV2) return true;

    var geoJsonOriginal = window.L.geoJSON;

    function geoJsonComCliqueDeterministico(data, options) {
      var opcoesOriginais = options || {};
      var onEachOriginal = opcoesOriginais.onEachFeature;
      var opcoes = Object.assign({}, opcoesOriginais, {
        onEachFeature: function (feature, layer) {
          if (typeof onEachOriginal === "function") {
            onEachOriginal(feature, layer);
          }

          if (!layer || typeof layer.on !== "function") return;
          var nome = nomeFeature(feature);
          if (!nome) return;

          // O handler original depende de CODIGO_IBGE e qtdContatos. Como o
          // GeoJSON oficial já fornece `properties.id` e `properties.name`,
          // substituímos o clique por uma resolução direta e previsível pelo nome.
          // O código IBGE continua disponível para diagnóstico/destaque.
          layer.off("click");
          layer.on("click", function (evento) {
            try {
              if (window.L && window.L.DomEvent && evento) {
                window.L.DomEvent.stopPropagation(evento);
              }
            } catch (e) {}

            var abriu = abrirMunicipioPorNome(nome);
            if (!abriu) {
              console.warn("Município do mapa não encontrado na navegação:", {
                nome: nome,
                codigoIbge: codigoFeature(feature)
              });
            }
          });
        }
      });

      return geoJsonOriginal.call(this, data, opcoes);
    }

    Object.keys(geoJsonOriginal).forEach(function (chave) {
      try { geoJsonComCliqueDeterministico[chave] = geoJsonOriginal[chave]; } catch (e) {}
    });
    geoJsonComCliqueDeterministico.__pjesMapClickFixV2 = true;
    window.L.geoJSON = geoJsonComCliqueDeterministico;
    return true;
  }

  if (!instalarCliqueDeterministicoMapa()) {
    var tentativas = 0;
    var timer = setInterval(function () {
      tentativas += 1;
      if (instalarCliqueDeterministicoMapa() || tentativas >= 40) {
        clearInterval(timer);
      }
    }, 50);
  }
})();
</script>
