<div class="usuarios-container">
  <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div><h2>Usuários</h2><p>Gerencie níveis e vínculos ativos por Unidade</p></div>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn btn-secondary" onclick="carregarUsuarios()">Atualizar</button>
      <button type="button" class="btn btn-primary" onclick="abrirModalAdicionarUsuario()">+ Adicionar</button>
    </div>
  </div>
  <div class="panel" style="margin-bottom:16px;padding:12px 16px;font-size:13px;color:#475569">
    <strong>Nível 1:</strong> Gestor de Conteúdo, limitado estritamente às Unidades selecionadas.
    <strong>Nível 2:</strong> Gestor do Sistema, com escopo global.
  </div>
  <div class="table-panel" style="overflow-x:auto">
    <table class="data-table" id="tabela-usuarios">
      <thead><tr><th>E-mail</th><th>Nome</th><th>Nível</th><th>Unidades do nível 1</th><th>Ativo</th><th>Ações</th></tr></thead>
      <tbody id="corpo-tabela-usuarios"><tr><td colspan="6">Carregando...</td></tr></tbody>
    </table>
  </div>
</div>

<div id="modal-adicionar-usuario" class="modal hidden" onclick="if(event.target===this)fecharModalAdicionarUsuario()">
  <div class="modal-content" style="width:min(620px,95vw)">
    <div class="modal-header"><h2>Adicionar usuário</h2><button type="button" class="modal-close" onclick="fecharModalAdicionarUsuario()">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full"><label>E-mail *</label><input id="novo-usuario-email" type="email"></div>
        <div class="form-group full"><label>Nome *</label><input id="novo-usuario-nome" maxlength="150"></div>
        <div class="form-group"><label>Nível *</label><select id="novo-usuario-nivel" onchange="alternarUnidadesNovoUsuario()"><option value="1">1 — Gestor de Conteúdo</option><option value="2">2 — Gestor do Sistema</option></select></div>
        <div class="form-group"><label><input id="novo-usuario-ativo" type="checkbox" checked> Ativo</label></div>
        <div id="grupo-novo-usuario-unidades" class="form-group full"><label>Unidades *</label><select id="novo-usuario-unidades" multiple size="9" style="width:100%"></select></div>
      </div>
      <div id="novo-usuario-erro" class="modal-alert hidden"></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn" onclick="fecharModalAdicionarUsuario()">Cancelar</button><button id="btn-salvar-novo-usuario" type="button" class="btn btn-primary" onclick="salvarNovoUsuario()">Adicionar</button></div>
  </div>
</div>
