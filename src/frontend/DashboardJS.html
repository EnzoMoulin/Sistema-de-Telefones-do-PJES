<script>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: DashboardJS.html
 * ==========================================================
 */

let todosTelefones = [];
let setoresPorComarca = {};
let telefonesPorSetor = {};
let microrregioesPorComarca = {};
let comarcasPorMicrorregiao = {};
let ordemComarcas = [];
let microrregiaoSelecionada = "";

// shared with ConsultarJS/SearchJS — frontend duplicate intentional; GS canonical in 02_Utils.gs.txt
function normalizarChave(valor) {
  return String(valor ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9]/g, "")
    .toUpperCase();
}

function campoTelefone(item, nomes) {
  if (!item) return "";

  const chaves = Object.keys(item);

  for (const nome of nomes) {
    if (Object.prototype.hasOwnProperty.call(item, nome)) {
      return item[nome];
    }

    const alvo = normalizarChave(nome);
    const chave = chaves.find(c => normalizarChave(c) === alvo);

    if (chave !== undefined) {
      return item[chave];
    }
  }

  return "";
}

function escaparConsulta(valor) {
  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escaparJs(valor) {
  return String(valor ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r?\n/g, "\\n");
}

function linkEnderecoDashboard(v){ var s=String(v||"").trim(); if(!s) return ""; return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s); }
function chaveSegura(valor) {
  return String(valor || "").replace(/[^a-zA-Z0-9]/g, "_");
}

function normalizarTexto(valor) {
  return String(valor || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function iniciarConsultaTelefones() {
  if (
    typeof API === "undefined" ||
    typeof API.listarTelefones !== "function"
  ) {
    console.error("API.listarTelefones não está disponível.");
    return;
  }

  API.listarTelefones(
    function(resp) {
      if (!resp || resp.sucesso !== true) {
        mostrarErroConsulta(
          resp?.erro || "Erro ao carregar telefones."
        );
        return;
      }

      todosTelefones = Array.isArray(resp.dados) ? resp.dados : [];

      if (typeof listaTelefones !== "undefined") {
        listaTelefones = Array.isArray(resp.dados) ? resp.dados.slice() : [];
      }

      processarDados();
      preencherFiltroMicrorregiao();
      renderizarComarcas();
      try{ if(typeof popularFiltrosConsulta==="function") popularFiltrosConsulta(); }catch(e){}
      try{ sincronizarSolicitacoesPendentesDashboard(); }catch(e){}
      atualizarDashboardPublico(todosTelefones);

      // v3.33 guard: Gestor Conteudo e Gestor Sistema usam mapa (remove race/double render) — GS com todas comarcas
      var _isGC_dash = !!(typeof usuarioAtual!=="undefined" && usuarioAtual && (String(usuarioAtual.perfil||"").toUpperCase()==="GESTOR_CONTEUDO" || String(usuarioAtual.perfil||"").toUpperCase()==="GESTOR_SISTEMA") && usuarioAtual.logado===true);
      if(_isGC_dash){
        var _tvDash = document.getElementById("telefones-view");
        if(_tvDash) _tvDash.classList.add("hidden");
        // v3.33 GS via mapa: garante que tabela nao seja injetada no arranque; tabela acessivel via navegarParaTabelaTelefones()
      } else {
        if (typeof carregarFiltros === "function") {
          try { carregarFiltros(); } catch (e) { console.error("carregarFiltros:", e); }
        }

        if (typeof atualizarTabelaComFiltros === "function") {
          try { atualizarTabelaComFiltros(); } catch (e) { console.error("atualizarTabelaComFiltros:", e); }
        }
      }

      /* Estado inicial: mapa visível e impressão oculta. */
      mostrarMapaConsulta();
    },
    function(erro) {
      console.error("Falha ao carregar telefones:", erro);

      mostrarErroConsulta(
        erro?.message || "Falha na comunicação com o servidor."
      );
    }
  );
}

function mostrarErroConsulta(mensagem) {
  const lista = document.getElementById("consulta-lista");

  if (lista) {
    lista.innerHTML =
      '<div class="panel">' +
        '<p style="color:#dc2626;">' +
          escaparConsulta(mensagem) +
        '</p>' +
      '</div>';
  }
}

function processarDados() {
  setoresPorComarca = {};
  telefonesPorSetor = {};
  microrregioesPorComarca = {};
  comarcasPorMicrorregiao = {};
  ordemComarcas = [];

  const vistosComarcas = {};
  const vistosSetores = {};

  todosTelefones.forEach(tel => {
    const comarca = String(
      campoTelefone(tel, ["comarca","COMARCA","forum","FORUM","municipio","MUNICIPIO"]) || "Sem comarca"
    ).trim();

    const setor = String(
      campoTelefone(tel, ["setor"]) || "Sem setor"
    ).trim();

    const micro = String(
      campoTelefone(tel, ["microrregiao", "microrregião"]) ||
      "Sem microrregião"
    ).trim();

    const chave = comarca + "||" + setor;

    if (!setoresPorComarca[comarca]) {
      setoresPorComarca[comarca] = [];
      vistosSetores[comarca] = new Set();
      ordemComarcas.push(comarca);
    }

    if (!vistosSetores[comarca].has(setor)) {
      vistosSetores[comarca].add(setor);
      setoresPorComarca[comarca].push(setor);
    }

    microrregioesPorComarca[comarca] = micro;

    if (!comarcasPorMicrorregiao[micro]) {
      comarcasPorMicrorregiao[micro] = [];
      vistosComarcas[micro] = new Set();
    }

    if (!vistosComarcas[micro].has(comarca)) {
      vistosComarcas[micro].add(comarca);
      comarcasPorMicrorregiao[micro].push(comarca);
    }

    if (!telefonesPorSetor[chave]) {
      telefonesPorSetor[chave] = [];
    }

    telefonesPorSetor[chave].push(tel);
  });
}

function preencherFiltroMicrorregiao() {
  const select = document.getElementById(
    "filtro-microrregiao-consulta"
  );

  if (!select) return;

  const atual = microrregiaoSelecionada;

  select.innerHTML =
    '<option value="">Selecione uma microrregião</option>';

  Object.keys(comarcasPorMicrorregiao)
    .forEach(micro => {
      const option = document.createElement("option");

      option.value = micro;
      option.textContent = micro;

      select.appendChild(option);
    });

  select.value = atual;
}

function selecionarMicrorregiaoConsulta(valor) {
  microrregiaoSelecionada = String(valor || "").trim();

  const campo = document.getElementById(
    "campo-pesquisa-consulta"
  );

  if (campo) campo.value = "";

  renderizarComarcas();
}
function pesquisar(){
  if(typeof filtrarSetoresConsultaDebounced==="function") return filtrarSetoresConsultaDebounced();
  if(typeof filtrarSetoresConsulta==="function") return filtrarSetoresConsulta();
}

function renderizarComarcas() {
  const container = document.getElementById("consulta-lista");
  if (!container) return;

  const campo = document.getElementById("campo-pesquisa-consulta");
  const termo = normalizarTexto(campo?.value || "");

  let comarcas;

  if (termo) {
    // v3.25 B: Busca ativa ignora microrregião e usa ordem global da planilha (ordemComarcas = sheet order)
    // Para Gestor Conteúdo: permite busca em todas comarcas (consulta liberada), mas impressão permanece bloqueada por permissão
    // Mantém ordemComarcas completa para case-insensitive search; botões Imprimir/PDF já verificam podeEditarComarca
    comarcas = ordemComarcas;
  } else if (microrregiaoSelecionada) {
    var _rawMicro = comarcasPorMicrorregiao[microrregiaoSelecionada] || [];
    var _isGCMicro = !!(typeof usuarioAtual !== "undefined" && usuarioAtual && String(usuarioAtual.perfil||"").toUpperCase()==="GESTOR_CONTEUDO");
    if(_isGCMicro && typeof comarcasPermitidasDoUsuario==="function"){
      var _permMicro = comarcasPermitidasDoUsuario();
      if(Array.isArray(_permMicro) && _permMicro.length){
        comarcas = [];
        for(var _mi=0; _mi<_rawMicro.length; _mi++){
          var _cm = _rawMicro[_mi];
          var _ckm = typeof normalizarChaveTabela==="function" ? normalizarChaveTabela(_cm) : String(_cm).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase();
          if(_permMicro.indexOf(_ckm)!==-1) comarcas.push(_cm);
        }
      } else {
        comarcas = _rawMicro.slice();
      }
    } else {
      comarcas = _rawMicro.slice();
    }
  } else {
    // Sem termo e sem microrregião: entrada inicial
    // Gestor Conteúdo vê apenas suas comarcas permitidas em ordemComarcas (sem precisar filtrar/clicar)
    var _isGC = !!(typeof usuarioAtual !== "undefined" && usuarioAtual && String(usuarioAtual.perfil||"").toUpperCase()==="GESTOR_CONTEUDO");
    if (_isGC) {
      var _perm2 = null;
      try { if (typeof comarcasPermitidasDoUsuario==="function") _perm2 = comarcasPermitidasDoUsuario(); } catch(e){ _perm2=null; }
      if (_perm2 === null) {
        comarcas = (typeof ordemComarcas!=="undefined" && ordemComarcas) ? ordemComarcas.slice() : [];
      } else if (Array.isArray(_perm2) && _perm2.length) {
        comarcas = [];
        for (var _j=0; _j<ordemComarcas.length; _j++) {
          var _cc = ordemComarcas[_j];
          var _cck = typeof normalizarChaveTabela==="function" ? normalizarChaveTabela(_cc) : String(_cc).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase();
          if (_perm2.indexOf(_cck)!==-1) comarcas.push(_cc);
        }
      } else {
        comarcas = (typeof ordemComarcas!=="undefined" && ordemComarcas) ? ordemComarcas.slice() : [];
      }
      if (!comarcas || !comarcas.length) {
        container.innerHTML =
          '<div class="panel consulta-lista-vazio">' +
            'Nenhuma comarca encontrada.' +
          '</div>';
        return;
      }
    } else {
      container.innerHTML =
        '<div class="panel consulta-lista-vazio">' +
          'Selecione um município no mapa para ver os detalhes.' +
        '</div>';
      return;
    }
  }

  if (!comarcas.length) {
    container.innerHTML =
      '<div class="panel consulta-lista-vazio">' +
        'Nenhuma comarca encontrada.' +
      '</div>';
    return;
  }

  let html = '<div class="list-group">';

  comarcas.forEach(comarca => {
    const id = chaveSegura(comarca);

    html +=
      '<div class="comarca-item" ' +
        'data-comarca="' +
          escaparConsulta(normalizarTexto(comarca)) +
        '" ' +
        'onclick="toggleComarca(\'' +
          escaparJs(id) +
        '\')">' +

        '<span class="comarca-nome">' +
          escaparConsulta(comarca) +
        '</span>' +

        '<span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">' +
          '<span class="setor-count">' +
            (setoresPorComarca[comarca] || []).length +
            ' setores' +
          '</span>' +
          (function(_cc2){
            try{
              var _isGC2 = typeof usuarioAtual!=="undefined" && usuarioAtual && String(usuarioAtual.perfil||"").toUpperCase()==="GESTOR_CONTEUDO";
              if(_isGC2){
                var _pode=true;
                try{ if(typeof podeEditarComarca==="function") _pode=podeEditarComarca(_cc2); else if(typeof comarcasPermitidasDoUsuario==="function"){ var _al=comarcasPermitidasDoUsuario(); if(_al!==null){ var _ck2=typeof normalizarChaveTabela==="function"?normalizarChaveTabela(_cc2):String(_cc2).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase(); _pode=_al.indexOf(_ck2)!==-1; }} }catch(e){ _pode=true; }
                if(!_pode) return "";
              }
            }catch(e){}
            return '<button type="button" class="btn btn-secondary" style="padding:3px 8px;font-size:11px;white-space:nowrap;" onclick="event.stopPropagation(); imprimirTodosSetoresDaComarca(\'' + escaparJs(_cc2) + '\')" title="Imprimir todos os setores desta comarca">\uD83D\uDDA8\uFE0F Imprimir / PDF</button>';
          })(comarca) +
          (function(c){
            try{
              var ehGC = typeof usuarioAtual!=="undefined" && usuarioAtual && usuarioAtual.logado===true && String(usuarioAtual.perfil||"").toUpperCase()==="GESTOR_CONTEUDO";
              if(!ehGC) return "";
              var pode = true;
              try{ if(typeof podeEditarComarca==="function") pode = podeEditarComarca(c); else if(typeof comarcasPermitidasDoUsuario==="function"){ var allow=comarcasPermitidasDoUsuario(); if(allow!==null){ var ck=String(c||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase(); pode = allow.indexOf(ck)!==-1; }} }catch(e){ pode=true; }
              if(pode) return "";
              var isSoli=false;
              try{
                var k="solicitacao_comarca_"+String(c||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase();
                var v=sessionStorage.getItem(k);
                if(v){ var ts=Number(v); if(Date.now()-ts>10*60*1000){ sessionStorage.removeItem(k); } else isSoli=true; }
              }catch(e){}
              if(isSoli) return '<button type="button" class="btn btn-secondary" style="padding:3px 8px;font-size:11px;white-space:nowrap;background:#fee2e2;border-color:#fca5a5;color:#991b1b;" onclick="event.stopPropagation(); handleSolicitarComarcaClick(\'' + escaparJs(c) + '\', this)" title="Clique para cancelar a solicitação">✕ Cancelar</button>';
              return '<button type="button" class="btn btn-secondary" style="padding:3px 8px;font-size:11px;white-space:nowrap;" onclick="event.stopPropagation(); handleSolicitarComarcaClick(\'' + escaparJs(c) + '\', this)">🔓 Solicitar acesso</button>';
            }catch(e){ return ""; }
          })(comarca) +
        '</span>' +

      '</div>' +

      '<div class="setores-list hidden" id="setores-' +
        id +
      '">';

    (
      setoresPorComarca[comarca] || []
    ).forEach(setor => {
      const chave =
        comarca + "||" + setor;

      html +=
        '<div class="setor-item" ' +
          'onclick="selecionarSetor(event,\'' +
            escaparJs(id) +
            '\',\'' +
            escaparJs(setor) +
            '\',\'' +
            escaparJs(chave) +
          '\')">' +
          escaparConsulta(setor) +
        '</div>';
    });

    html += '</div>';
  });

  container.innerHTML =
    html + '</div>';

  if (termo) {
    filtrarSetoresConsulta();
  }
  try{ destacarMapaPorBusca(normalizarTexto(termo)); }catch(e){}
  try{ if(!termo && !microrregiaoSelecionada) sincronizarSolicitacoesPendentesDashboard(); }catch(e){}
}

function toggleComarca(id) {
  const el = document.getElementById(
    "setores-" + id
  );

  if (!el) return;

  const willShow = el.classList.contains("hidden");

  if (willShow) {
    try {
      const campo = document.getElementById("campo-pesquisa-consulta");
      const termo = normalizarTexto(campo?.value || "");
      if (termo) {
        const comarca = Object.keys(setoresPorComarca).find(c => chaveSegura(c) === id) || "";
        const comarcaMatch = normalizarTexto(comarca).includes(termo);
        const itens = Array.from(el.querySelectorAll(".setor-item"));
        if (comarcaMatch) {
          itens.forEach(s => s.style.display = "");
        } else {
          itens.forEach(s => {
            const hit = normalizarTexto(s.textContent).includes(termo);
            s.style.display = hit ? "" : "none";
          });
        }
      } else {
        Array.from(el.querySelectorAll(".setor-item")).forEach(s => s.style.display = "");
      }
    } catch (e) {}
  }

  el.classList.toggle("hidden");
  try{
    if(typeof estadoColapsadoComarca!=="undefined"){
      estadoColapsadoComarca[id] = el.classList.contains("hidden");
    }
  }catch(e){}
}

function selecionarSetor(
  evento,
  idSeguro,
  setor,
  chave
) {
  const comarca =
    Object.keys(setoresPorComarca).find(
      c => chaveSegura(c) === idSeguro
    ) || "";

  const contatos =
    telefonesPorSetor[chave] || [];

  renderizarDetalhes(
    comarca,
    setor,
    contatos
  );

  document
    .querySelectorAll(".setor-item")
    .forEach(el => {
      el.style.background = "";
    });

  if (evento?.currentTarget) {
    evento.currentTarget.style.background =
      "#e2e8f0";
  }
}

function atualizarDashboardPublico(telefonesRaw) {
  // v3.27: filtra por comarcas permitidas APENAS para Gestor Conteúdo — público e Gestor Sistema veem tudo
  // v3.32 verificado: filtro correto — somente GC filtra; null=vazia significa todas (compatível com comarcasPermitidasDoUsuario que retorna null para GC sem restricao)
  let telefones = Array.isArray(telefonesRaw) ? telefonesRaw.slice() : [];
  try{
    const perfil = (typeof usuarioAtual !== "undefined" && usuarioAtual) ? String(usuarioAtual.perfil || "") : "";
    const isGC = perfil === "GESTOR_CONTEUDO" && usuarioAtual && usuarioAtual.logado === true;
    if(isGC && typeof comarcasPermitidasDoUsuario==="function"){
      const perm = comarcasPermitidasDoUsuario();
      if(perm!==null){
        if(!Array.isArray(perm) || perm.length===0){
          // v3.32: perm vazio ou invalido para GC => tratar como sem restricao (todas) para manter compatibilidade com TableJS (length 0 => null => todas)
          // Mantém telefones intacto (sem filtro). Antigo comportamento (telefones=[]) ocultava tudo e foi corrigido.
        } else {
          telefones = telefones.filter(function(item){
            const comarca = String(campoTelefone(item, ["comarca"]) || "").trim();
            let ck="";
            try{
              ck = (typeof normalizarChaveTabela==="function" ? normalizarChaveTabela(comarca) : String(comarca).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase());
            }catch(e){ ck = String(comarca).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase(); }
            return perm.indexOf(ck)!==-1;
          });
        }
      }
    }
  }catch(eFiltro){}

  const setores = new Set();
  const tipos = new Set();
  const porTipo = {};
  const porComarca = {};

  (
    Array.isArray(telefones)
      ? telefones
      : []
  ).forEach(item => {
    const comarca = String(
      campoTelefone(item, ["comarca"]) ||
      "Sem comarca"
    ).trim();

    const setor = String(
      campoTelefone(item, ["setor"]) ||
      "Sem setor"
    ).trim();

    const tipo = String(
      campoTelefone(item, ["tipo"]) ||
      "Não informado"
    ).trim();

    setores.add(comarca + "||" + setor);
    tipos.add(tipo);

    porTipo[tipo] =
      (porTipo[tipo] || 0) + 1;

    porComarca[comarca] =
      (porComarca[comarca] || 0) + 1;
  });

  atualizarTexto(
    "total-telefones",
    Array.isArray(telefones)
      ? telefones.length
      : 0
  );

  atualizarTexto(
    "total-setores",
    setores.size
  );

  atualizarTexto(
    "total-tipos",
    tipos.size
  );

  renderizarResumoDashboard(
    document.getElementById("grafico-tipos"),
    porTipo
  );

  renderizarResumoDashboard(
    document.getElementById("grafico-comarcas"),
    porComarca
  );
}

function atualizarTexto(id, valor) {
  const el =
    document.getElementById(id);

  if (el) {
    el.textContent =
      String(valor);
  }
}

function renderizarResumoDashboard(
  container,
  dados
) {
  if (!container) return;

  container.innerHTML = "";

  const entradas =
    Object.entries(dados || {})
      .map(([nome, valor]) => ({
        nome,
        valor: Number(valor) || 0
      }))
      .sort(
        (a, b) =>
          b.valor - a.valor ||
          a.nome.localeCompare(
            b.nome,
            "pt-BR"
          )
      );

  if (!entradas.length) {
    container.innerHTML =
      '<p style="color:#94a3b8;margin:0;">' +
        'Nenhum contato cadastrado.' +
      '</p>';
    return;
  }

  entradas
    .slice(0, 15)
    .forEach(item => {
      const linha =
        document.createElement("div");

      linha.style.cssText =
        "display:flex;" +
        "justify-content:space-between;" +
        "align-items:center;" +
        "gap:12px;" +
        "padding:8px 0;" +
        "border-bottom:1px solid #e2e8f0;";

      const nome =
        document.createElement("span");

      nome.textContent =
        item.nome;

      const numero =
        document.createElement("strong");

      numero.textContent =
        String(item.valor);

      linha.append(
        nome,
        numero
      );

      container.appendChild(
        linha
      );
    });
}


function chaveSolicitacaoComarcaGC(c){ return "solicitacao_comarca_"+String(c||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase(); }
function sincronizarSolicitacoesPendentesDashboard(){
  try{
    if(typeof API==="undefined"||typeof API.listarSolicitacoes!=="function") return;
    if(typeof usuarioAtual==="undefined"||!usuarioAtual||!usuarioAtual.email) return;
    if(String(usuarioAtual.perfil||"").toUpperCase()!=="GESTOR_CONTEUDO") return;
    var emailAtual = String(usuarioAtual.email||"").trim().toLowerCase();
    if(!emailAtual) return;
    API.listarSolicitacoes(function(res){
      try{
        if(!res||res.sucesso!==true||!Array.isArray(res.dados)) return;
        var chavesAfetadas=false;
        res.dados.forEach(function(s){
          try{
            var em=String(s.email||s.EMAIL||"").trim().toLowerCase();
            var st=String(s.status||s.STATUS||"").trim().toUpperCase();
            var com=String(s.comarca||s.COMARCA||"").trim();
            if(em===emailAtual && st==="PENDENTE" && com){

    w.document.open(); w.document.write(html); w.document.close();
  }catch(e){ console.error(e); if(typeof mostrarToast==="function") mostrarToast("N\u00e3o foi poss\u00edvel imprimir.","error"); }
}
function imprimirTodosSetoresDaComarca(comarcaNome){ return imprimirComarcaSetoresCards(comarcaNome); }
</script>
