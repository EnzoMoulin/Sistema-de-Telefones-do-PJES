<script>
/**
 * ==========================================================
 * NAVEGAÇÃO DE CONTATOS — MUNICÍPIO > FÓRUM > UNIDADE > SETOR
 * ==========================================================
 *
 * Este módulo é deliberadamente isolado: ele NÃO redefine
 * iniciarConsultaTelefones/carregarTelefones, que pertencem ao dashboard.
 */
(function () {
  "use strict";

  var estado = {
    dados: { municipios: [] },
    municipioId: "",
    forumId: "",
    noId: "",
    mapa: null,
    geojson: null,
    resizeObserver: null,
    carregando: false,
    inicializado: false,
    buscaTimer: null
  };

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function host() { return document.getElementById("fc-content"); }
  function usuario() { return (typeof window.usuarioAtual !== "undefined" && window.usuarioAtual) || {}; }
  function perfil() { return String(usuario().perfil || "").toUpperCase(); }
  function ehGC() { return usuario().logado === true && usuario().ativo === true && perfil() === "GESTOR_CONTEUDO"; }
  function ehGS() { return usuario().logado === true && usuario().ativo === true && perfil() === "GESTOR_SISTEMA"; }
  function ehGestor() { return ehGC() || ehGS(); }

  function fmtTipoContato(tipo) {
    var t = String(tipo || "").trim().toUpperCase();
    if (t === "E_MAIL" || t === "EMAIL" || t === "E-MAIL") return "E-mail";
    if (t === "WHATSAPP") return "WhatsApp";
    if (t === "RAMAL") return "Ramal";
    if (t === "FAX") return "Fax";
    if (t === "TELEFONE") return "Telefone";
    return tipo || "Contato";
  }

  function fmtTipoNo(tipo) {
    var mapa = {
      UNIDADE: "Unidade",
      SECRETARIA: "Secretaria",
      VARA: "Vara",
      JUIZADO: "Juizado",
      SETOR: "Setor",
      GABINETE: "Gabinete",
      ASSESSORIA: "Assessoria",
      SALAAUDIENCIA: "Sala de audiência",
      GENERICO: "Unidade organizacional"
    };
    return mapa[String(tipo || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase()] ||
      String(tipo || "Unidade organizacional");
  }

  function fmtValor(tipo, valor) {
    var t = String(tipo || "").toUpperCase();
    var s = String(valor || "").trim();
    var n = s.replace(/\D/g, "");
    if (!s) return "";
    if ((t.indexOf("TELEFONE") >= 0 || t.indexOf("WHATSAPP") >= 0 || t === "CELULAR") && n.indexOf("27") === 0) {
      if (n.length === 10) return "(" + n.slice(0, 2) + ") " + n.slice(2, 6) + "-" + n.slice(6);
      if (n.length === 11) return "(" + n.slice(0, 2) + ") " + n.slice(2, 7) + "-" + n.slice(7);
    }
    return s;
  }

  function hrefContato(tipo, valor) {
    var t = String(tipo || "").toUpperCase();
    var s = String(valor || "").trim();
    var n = s.replace(/\D/g, "");
    if (!s) return "";
    if (t === "WHATSAPP" && n) return "https://wa.me/" + (n.indexOf("55") === 0 ? n : "55" + n);
    if ((t === "TELEFONE" || t === "CELULAR") && n) return "tel:+55" + (n.indexOf("55") === 0 ? n.slice(2) : n);
    if (t === "E-MAIL" || t === "EMAIL" || t === "E_MAIL") return "mailto:" + encodeURIComponent(s);
    return "";
  }

  function linkEndereco(endereco) {
    var texto = String(endereco || "").trim();
    if (!texto) return '<span class="fc-muted">Endereço não informado</span>';
    return '<span class="fc-address-inline"><a class="fc-endereco" href="https://www.google.com/maps/search/?api=1&query=' +
      encodeURIComponent(texto) + '" target="_blank" rel="noopener noreferrer">📍 ' + esc(texto) + "</a>" +
      '<button type="button" class="fc-icon-btn fc-copy-btn" data-copy-value="' + esc(texto) +
      '" data-copy-label="Endereço" title="Copiar endereço" aria-label="Copiar endereço">⧉</button></span>';
  }

  function todosNos(lista, saida) {
    saida = saida || [];
    (lista || []).forEach(function (no) {
      saida.push(no);
      todosNos(no.filhos || [], saida);
    });
    return saida;
  }

  function qtdSetores(lista) {
    return todosNos(lista || [], []).filter(function (no) {
      return String(no.tipo || "").toUpperCase() === "SETOR";
    }).length;
  }

  function rotuloQuantidade(valor, singular, plural) {
    var total = Number(valor || 0);
    return total > 0 ? total + " " + (total === 1 ? singular : plural) : "";
  }

  function badgeQuantidade(valor, singular, plural) {
    var texto = rotuloQuantidade(valor, singular, plural);
    return texto ? '<span class="fc-pill">' + esc(texto) + "</span>" : "";
  }

  function resumoQuantidades(itens) {
    return itens.filter(Boolean).join(" • ");
  }

  function encontrarMunicipio(id) {
    return (estado.dados.municipios || []).find(function (m) { return m.id === id; }) || null;
  }

  function encontrarForum(id) {
    var achado = null;
    (estado.dados.municipios || []).some(function (m) {
      var f = (m.foruns || []).find(function (item) { return item.id === id; });
      if (f) { achado = f; return true; }
      return false;
    });
    return achado;
  }

  function encontrarNo(lista, id) {
    for (var i = 0; i < (lista || []).length; i++) {
      if (lista[i].id === id) return lista[i];
      var filho = encontrarNo(lista[i].filhos || [], id);
      if (filho) return filho;
    }
    return null;
  }

  function municipioAtual() { return encontrarMunicipio(estado.municipioId); }
  function forumAtual() { return encontrarForum(estado.forumId); }
  function noAtual() {
    var f = forumAtual();
    return f ? encontrarNo(f.nos || [], estado.noId) : null;
  }

  function caminhoAteNo(lista, id, caminho) {
    caminho = caminho || [];
    for (var i = 0; i < (lista || []).length; i++) {
      var atual = caminho.concat(lista[i]);
      if (lista[i].id === id) return atual;
      var encontrado = caminhoAteNo(lista[i].filhos || [], id, atual);
      if (encontrado) return encontrado;
    }
    return null;
  }

  function breadcrumbHtml(municipio, forum, no) {
    var itens = [
      { tipo: "MUNICIPIO", id: municipio.id, nome: municipio.nome },
      { tipo: "FORUM", id: forum.id, nome: forum.nome }
    ];
    if (no) {
      (caminhoAteNo(forum.nos || [], no.id, []) || []).forEach(function (item) {
        itens.push({ tipo: "NO", id: item.id, nome: item.nome });
      });
    }

    return '<nav class="fc-breadcrumb" aria-label="Caminho da localidade">' + itens.map(function (item, indice) {
      var ultimo = indice === itens.length - 1;
      var conteudo = ultimo
        ? '<span class="fc-breadcrumb-current" aria-current="page">' + esc(item.nome) + "</span>"
        : '<button type="button" data-breadcrumb-type="' + esc(item.tipo) + '" data-breadcrumb-id="' +
          esc(item.id) + '">' + esc(item.nome) + "</button>";
      return conteudo + (ultimo ? "" : '<span class="fc-breadcrumb-separator" aria-hidden="true">›</span>');
    }).join("") + "</nav>";
  }

  function vincularBreadcrumbs() {
    document.querySelectorAll("[data-breadcrumb-type]").forEach(function (btn) {
      btn.onclick = function () {
        var tipo = btn.getAttribute("data-breadcrumb-type");
        var id = btn.getAttribute("data-breadcrumb-id");
        if (tipo === "MUNICIPIO") {
          estado.municipioId = id;
          estado.forumId = "";
          estado.noId = "";
          renderForuns();
        } else if (tipo === "FORUM") {
          estado.forumId = id;
          estado.noId = "";
          renderForum();
        } else if (tipo === "NO") abrirNo(id);
      };
    });
  }

  function acessosExplicitos() {
    return Array.isArray(usuario().acessos) ? usuario().acessos : [];
  }

  function idsGerenciaveis() {
    return Array.isArray(usuario().unidadeIds) ? usuario().unidadeIds.map(String) : [];
  }

  function possuiAcessoForumExplicito(id) {
    if (ehGS()) return true;
    if (!ehGC()) return false;
    return acessosExplicitos().some(function (a) {
      return String(a.tipo || "").toUpperCase() === "FORUM" && String(a.id || "") === String(id || "");
    });
  }

  function possuiAcessoNo(id) {
    if (ehGS()) return true;
    if (!ehGC()) return false;
    return idsGerenciaveis().indexOf(String(id || "")) !== -1;
  }

  function forumTemAlgumAcesso(forum) {
    if (ehGS()) return true;
    if (!ehGC()) return false;
    if (possuiAcessoForumExplicito(forum.id)) return true;
    return todosNos(forum.nos || [], []).some(function (no) { return possuiAcessoNo(no.id); });
  }

  function municipioTemAcesso(municipio) {
    if (ehGS()) return true;
    if (!ehGC()) return false;
    return (municipio.foruns || []).some(forumTemAlgumAcesso);
  }

  function podeGerenciarForum(forum) {
    return ehGS() || (ehGC() && forum && possuiAcessoForumExplicito(forum.id));
  }

  function podeGerenciarNo(no) {
    return ehGS() || (ehGC() && no && possuiAcessoNo(no.id));
  }

  function mostrarToastSeguro(msg, tipo) {
    if (typeof window.mostrarToast === "function") window.mostrarToast(msg, tipo || "info");
    else if (tipo === "error") console.error(msg);
    else console.log(msg);
  }

  function copiarTexto(texto, rotulo) {
    var valor = String(texto || "").trim();
    if (!valor) {
      mostrarToastSeguro("Não há conteúdo para copiar.", "warning");
      return;
    }

    function sucesso() {
      mostrarToastSeguro((rotulo || "Conteúdo") + " copiado.", "success");
    }

    function copiarComFallback() {
      var area = document.createElement("textarea");
      area.value = valor;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      try {
        if (document.execCommand("copy")) sucesso();
        else mostrarToastSeguro("Não foi possível copiar.", "error");
      } catch (erro) {
        mostrarToastSeguro("Não foi possível copiar.", "error");
      } finally {
        document.body.removeChild(area);
      }
    }

    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      navigator.clipboard.writeText(valor).then(sucesso).catch(copiarComFallback);
    } else copiarComFallback();
  }

  function vincularCopias() {
    document.querySelectorAll("[data-copy-value]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        copiarTexto(btn.getAttribute("data-copy-value"), btn.getAttribute("data-copy-label"));
      };
    });
  }

    var style = document.createElement("style");

      .fc-toolbar{display:flex;gap:8px;flex-wrap:wrap}.fc-btn{appearance:none;border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:9px;padding:8px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
      .fc-btn:hover{background:#f8fafc}.fc-btn--primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.fc-btn--primary:hover{background:#1e40af}
      .fc-btn--danger{border-color:#fecaca;color:#b91c1c;background:#fff}.fc-btn--danger:hover{background:#fef2f2}.fc-btn:disabled{opacity:.55;cursor:not-allowed}
      .fc-search{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 10px;font-size:14px}.fc-select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;margin-bottom:12px}
      .fc-section{margin-top:18px}.fc-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.fc-section h3{font-size:15px;margin:0;color:#0f172a}
      .fc-card{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-top:10px;background:#fff;transition:.15s}
      .fc-card[data-nav]{cursor:pointer}.fc-card[data-nav]:hover{box-shadow:0 8px 22px rgba(15,23,42,.08);transform:translateY(-1px)}
      .fc-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.fc-card h4{margin:0 0 6px;font-size:15px;color:#0f172a}.fc-card p{margin:3px 0;color:#475569;font-size:13px;line-height:1.45}
      .fc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fc-pill{font-size:11px;background:#f1f5f9;color:#334155;border-radius:999px;padding:4px 8px}.fc-pill--ok{background:#dcfce7;color:#166534}.fc-pill--locked{background:#fff7ed;color:#9a3412}.fc-pill-type{background:#dbeafe;color:#1e40af}
      .fc-back{border:0;background:transparent;color:#1d4ed8;font-weight:700;padding:0;margin-bottom:12px;cursor:pointer}
      .fc-contatos{display:grid;gap:9px}.fc-contato{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#f8fafc;border:1px solid #dbe3ed;border-radius:10px}
      .fc-contato-main{min-width:0}.fc-contato h4{margin:4px 0 0;font-size:14px;color:#0f172a}.fc-contato-tipo{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#475569}
      .fc-contato-side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.fc-contato-valor{color:#1d4ed8;font-size:14px;font-weight:700;text-decoration:none;overflow-wrap:anywhere}.fc-contato-actions{display:flex;gap:5px}
      .fc-icon-btn{border:1px solid #dbe3ed;background:#fff;border-radius:8px;padding:5px 7px;cursor:pointer;font-size:12px}.fc-icon-btn:hover{background:#f1f5f9}.fc-icon-btn--danger{color:#b91c1c;border-color:#fecaca}.fc-copy-btn{color:#1d4ed8;font-weight:800}
      .fc-address-inline{display:inline-flex;align-items:center;gap:6px;max-width:100%;vertical-align:middle}.fc-endereco{display:inline-block;color:#1d4ed8;font-size:13px;line-height:1.45;text-decoration:none;overflow-wrap:anywhere}.fc-endereco:hover{text-decoration:underline}.fc-muted{color:#64748b;font-size:13px}
      .fc-inherit{margin-top:10px;padding:10px 12px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;color:#475569;font-size:12px}
      .fc-empty{padding:20px;border:1px dashed #cbd5e1;border-radius:12px;color:#64748b;text-align:center}.fc-error{padding:16px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:12px;line-height:1.5}
      .fc-access{margin-top:10px;border:1px solid #93c5fd;background:#eff6ff;color:#1d4ed8;border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}

      .fc-total-comarcas{display:inline-flex;margin:12px 0 8px;background:#dbeafe;color:#1e40af;font-weight:800}.fc-print-all{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;line-height:1.2;margin-bottom:12px}.fc-print-footer{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid #e2e8f0}.fc-print-footer .fc-btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;padding-inline:18px}.fc-address-row{margin-top:10px}.fc-address-row .fc-inherit{margin-top:0}

      .fc-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
      @media(max-width:680px){.fc-form-grid{grid-template-columns:1fr}.fc-field--full{grid-column:auto}.fc-contato{align-items:flex-start;flex-direction:column}.fc-contato-side{justify-content:flex-start}}
      @media print{.fc-back,.fc-search,.fc-select,.fc-toolbar,.fc-access,.fc-print-footer,.fc-copy-btn{display:none!important}.fc-panel{height:auto;overflow:visible;border:0;box-shadow:none}.fc-contato,.fc-card{break-inside:avoid}}
    `;
    document.head.appendChild(style);
  }

  function chamadaHierarquia(termo, sucesso, falha) {
    if (typeof API === "undefined" || typeof API.hierarquiaForum !== "function") {
      falha(new Error("API de hierarquia não disponível."));
      return;
    }
    API.hierarquiaForum(
      termo || "",
      function (resp) {
        if (resp && resp.sucesso === true && resp.dados) sucesso(resp.dados);
        else falha(new Error((resp && resp.erro) || "Não foi possível carregar os contatos."));
      },
      falha
    );
  }

  function recarregar(opcoes) {
    opcoes = opcoes || {};
    if (estado.carregando) return;
    estado.carregando = true;
    if (opcoes.mostrarCarregando !== false && host()) {
      host().innerHTML = '<div class="fc-empty">Carregando contatos...</div>';
    }
    chamadaHierarquia(opcoes.termo || "", function (dados) {
      estado.carregando = false;
      estado.dados = dados || { municipios: [] };
      restaurarNavegacao();
      atualizarMapaDados();
    }, function (erro) {
      estado.carregando = false;
      console.error("Falha ao carregar hierarquia:", erro);
      renderErro(erro && erro.message ? erro.message : "Falha ao carregar dados.");
    });
  }

  function renderErro(mensagem) {
    var c = host();
    if (!c) return;
    c.innerHTML =
      '<div class="fc-error"><strong>Não foi possível carregar os contatos.</strong><br>' +
      esc(mensagem) +
      '<div style="margin-top:12px"><button type="button" class="fc-btn" id="fc-retry">Tentar novamente</button></div></div>';
    var retry = document.getElementById("fc-retry");
    if (retry) retry.onclick = function () { recarregar({ mostrarCarregando: true }); };
  }

  function restaurarNavegacao() {
    if (estado.noId && noAtual()) return renderNo();
    if (estado.forumId && forumAtual()) return renderForum();
    if (estado.municipioId && municipioAtual()) return renderForuns();
    estado.municipioId = "";
    estado.forumId = "";
    estado.noId = "";
    renderInicio();
  }

  function botaoSolicitar(tipo, id) {
    if (!ehGC()) return "";
    var possui = tipo === "FORUM" ? possuiAcessoForumExplicito(id) : possuiAcessoNo(id);
    if (possui) return "";
    return '<button type="button" class="fc-access" data-access-type="' + esc(tipo) +
      '" data-access-id="' + esc(id) + '">Solicitar acesso</button>';
  }

  function vincularSolicitacoes() {
    document.querySelectorAll("[data-access-type]").forEach(function (botao) {
      botao.onclick = function (evento) {
        evento.preventDefault();
        evento.stopPropagation();
        var tipo = botao.getAttribute("data-access-type");
        var id = botao.getAttribute("data-access-id");
        var u = usuario();
        var nome = u.nome || String(u.email || "").split("@")[0];
        botao.disabled = true;
        botao.textContent = "Enviando...";
        API.enviarFormularioAcesso(
          {
            nome: nome,
            nivel: 1,
            escopos: [{ tipo: tipo, id: id }],
            justificativa: "Solicitação enviada pela aba Contatos."
          },
          function (resp) {
            if (resp && resp.sucesso === true) {
              botao.textContent = "Solicitação enviada";
              mostrarToastSeguro("Solicitação de acesso enviada.", "success");
            } else {
              botao.disabled = false;
              botao.textContent = "Solicitar acesso";
              mostrarToastSeguro((resp && resp.erro) || "Não foi possível enviar a solicitação.", "error");
            }
          },
          function (erro) {
            botao.disabled = false;
            botao.textContent = "Solicitar acesso";
            mostrarToastSeguro((erro && erro.message) || "Falha ao enviar a solicitação.", "error");
          }
        );
      };
    });
  }

  function acoesLocalidade(tipo, item, pode, tipoNo) {
    var botoes = [];
    if (ehGestor() && pode) {
      botoes.push('<button type="button" class="fc-btn" data-edit-address="' + esc(tipo) + '" data-local-id="' + esc(item.id) + '">✎ Endereço</button>');
      botoes.push('<button type="button" class="fc-btn" data-add-locality="' + (tipo === "FORUM" ? "UNIDADE" : "SETOR") + '">' +
        (tipo === "FORUM" ? "＋ Unidade" : "＋ Setor") + "</button>");
      botoes.push('<button type="button" class="fc-btn fc-btn--primary" data-add-contact="' + esc(tipo) + '" data-local-id="' + esc(item.id) + '">＋ Contato</button>');
    }
    return botoes.length ? '<div class="fc-toolbar">' + botoes.join("") + "</div>" : "";
  }

  function botaoImpressaoLocalidade(tipo, tipoNo) {
    var rotulo = tipo === "FORUM" ? "Fórum" : (tipoNo === "Setor" ? "Setor" : "Unidade");
    var artigo = rotulo === "Unidade" ? "da" : "do";
    var id = tipo === "FORUM" ? "fc-print-forum" : "fc-print-unit";
    return '<div class="fc-print-footer"><button type="button" class="fc-btn" data-scroll-top title="Voltar ao início deste painel">↑ Voltar ao topo</button>' +
      '<button type="button" class="fc-btn" id="' + id + '" title="Imprimir / Salvar PDF dos contatos ' +
      artigo + " " + rotulo + '">🖨 Imprimir / Salvar PDF</button></div>';
  }

  function contatosCards(contatos, contexto) {
    if (!contatos || !contatos.length) return '<div class="fc-empty">Nenhum contato cadastrado.</div>';
    var pode = contexto.tipo === "FORUM" ? podeGerenciarForum(contexto.item) : podeGerenciarNo(contexto.item);
    return '<div class="fc-contatos">' + contatos.map(function (c) {
      var tipo = fmtTipoContato(c.tipo);
      var valor = fmtValor(c.tipo, c.valor);
      var href = hrefContato(c.tipo, c.valor);
      var externo = /^(https?:|mailto:)/.test(href);
      var valorHtml = href
        ? '<a class="fc-contato-valor" href="' + esc(href) + '" ' +
          (externo ? 'target="_blank" rel="noopener noreferrer"' : "") + ">" + esc(valor) + "</a>"
        : '<span class="fc-contato-valor">' + esc(valor) + "</span>";
      var acoes = '<div class="fc-contato-actions">' +
        '<button type="button" class="fc-icon-btn fc-copy-btn" data-copy-value="' + esc(valor) +
        '" data-copy-label="' + esc(tipo) + '" title="Copiar ' + esc(tipo) + '" aria-label="Copiar ' + esc(tipo) + '">⧉</button>' +
        (pode
          ? '<button type="button" class="fc-icon-btn" data-edit-contact="' + esc(c.id) + '" title="Editar contato">✎</button>' +
            '<button type="button" class="fc-icon-btn fc-icon-btn--danger" data-delete-contact="' + esc(c.id) + '" title="Excluir contato">🗑</button>'
          : "") +
        "</div>";
      var descricao = String(c.descricao || "").trim();
      var descricaoHtml = descricao && descricao.toLocaleLowerCase("pt-BR") !== String(tipo).toLocaleLowerCase("pt-BR")
        ? "<h4>" + esc(descricao) + "</h4>"
        : "";
      return '<article class="fc-contato">' +
        '<div class="fc-contato-main"><span class="fc-contato-tipo">' + esc(tipo) + "</span>" + descricaoHtml + "</div>" +
        '<div class="fc-contato-side">' + valorHtml + acoes + "</div></article>";
    }).join("") + "</div>";
  }

  function bindAcoesContexto(contexto) {
    vincularSolicitacoes();
    vincularCopias();

    document.querySelectorAll("[data-scroll-top]").forEach(function (btn) {
      btn.onclick = function () {
        var painel = document.querySelector("#consulta-detalhes .fc-panel");
        if (painel && typeof painel.scrollTo === "function") painel.scrollTo({ top: 0, behavior: "smooth" });
        else if (host()) host().scrollIntoView({ behavior: "smooth", block: "start" });
      };
    });

    document.querySelectorAll("[data-add-contact]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        abrirContatoDialog(contexto, null);
      };
    });

    document.querySelectorAll("[data-edit-address]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        abrirEnderecoDialog(contexto);
      };
    });

    document.querySelectorAll("[data-add-locality]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        abrirLocalidadeDialog(contexto, btn.getAttribute("data-add-locality"));
      };
    });

    document.querySelectorAll("[data-edit-contact]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-edit-contact");
        var contato = (contexto.item.contatos || []).find(function (c) { return c.id === id; });
        if (contato) abrirContatoDialog(contexto, contato);
      };
    });

    document.querySelectorAll("[data-delete-contact]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        excluirContato(btn.getAttribute("data-delete-contact"));
      };
    });
  }

  function opcoesComarcas(municipios, selecionado) {
    return '<option value="">Selecione a Comarca</option>' + (municipios || []).map(function (m) {
      return '<option value="' + esc(m.id) + '"' + (m.id === selecionado ? " selected" : "") + ">" + esc(m.nome) + "</option>";
    }).join("");
  }

  function renderInicio() {
    var c = host();
    if (!c) return;
    estado.municipioId = "";
    estado.forumId = "";
    estado.noId = "";

    var municipios = (estado.dados && estado.dados.municipios) || [];
    var conteudo = '<div class="fc-head"><div><h2 class="fc-title">Contatos do PJES</h2>' +
      '<p class="fc-subtitle fc-subtitle--intro">Consulte a estrutura completa por Comarca, Fórum, Unidade e Setor. Selecione uma Comarca no mapa ao lado ou no menu suspenso abaixo.</p></div></div>' +
      (municipios.length ? '<span class="fc-pill fc-total-comarcas">' + esc(rotuloQuantidade(municipios.length, "Comarca", "Comarcas")) + "</span>" : "") +
      '<select id="fc-comarca" class="fc-select">' + opcoesComarcas(municipios, "") + "</select>" +
      '<button type="button" class="fc-btn fc-print-all" id="fc-print-all" title="Imprimir / Salvar PDF de todos os contatos">🖨 Imprimir / Salvar PDF</button>';

    c.innerHTML = conteudo;

    var seletor = document.getElementById("fc-comarca");
    if (seletor) seletor.onchange = function () { if (seletor.value) abrirMunicipio(seletor.value); };

    var imprimir = document.getElementById("fc-print-all");
    if (imprimir) imprimir.onclick = imprimirTudo;
  }

  function abrirMunicipio(id) {
    estado.municipioId = id;
    estado.forumId = "";
    estado.noId = "";
    var m = municipioAtual();
    if (!m) return;
    renderForuns();
    if (estado.mapa && estado.geojson) destacarMunicipio(m.codigoIbge);
  }

  function renderForuns() {
    var c = host();
    var m = municipioAtual();
    if (!c || !m) return;

    var resumo = resumoQuantidades([
      rotuloQuantidade(m.qtdForuns, "Fórum", "Fóruns"),
      rotuloQuantidade(m.qtdUnidades, "Unidade", "Unidades"),
      rotuloQuantidade((m.foruns || []).reduce(function (total, f) { return total + qtdSetores(f.nos || []); }, 0), "Setor", "Setores"),
      rotuloQuantidade(m.qtdContatos, "Contato", "Contatos")
    ]);
    c.innerHTML = '<button class="fc-back" id="fc-back-home">← Comarcas</button>' +
      '<div class="fc-head"><div><h2 class="fc-title">' + esc(m.nome) + "</h2>" +
      '<p class="fc-subtitle">' + esc(resumo) + "</p></div></div>" +
      '<select id="fc-comarca" class="fc-select">' + opcoesComarcas(estado.dados.municipios || [], m.id) + "</select>" +
      '<div class="fc-section"><h3>Fóruns</h3>' +
      (m.foruns || []).map(function (f) {
        var acesso = forumTemAlgumAcesso(f);
        var podeForum = podeGerenciarForum(f);
        var badge = ehGC()
          ? (acesso ? '<span class="fc-pill fc-pill--ok">Com acesso</span>' : '<span class="fc-pill fc-pill--locked">Sem acesso</span>')
          : "";
        return '<div class="fc-card" data-nav="forum" data-forum="' + esc(f.id) + '">' +
          '<div class="fc-card-head"><div><h4>' + esc(f.nome) + "</h4>" + linkEndereco(f.endereco) +
          '</div>' + badge + "</div>" +
          '<div class="fc-meta">' + badgeQuantidade(f.qtdUnidades, "Unidade", "Unidades") +
          badgeQuantidade(qtdSetores(f.nos || []), "Setor", "Setores") +
          badgeQuantidade(f.qtdContatos, "Contato", "Contatos") + "</div>" +
          (podeForum ? "" : botaoSolicitar("FORUM", f.id)) +
          "</div>";
      }).join("") + "</div>";

    document.getElementById("fc-back-home").onclick = renderInicio;
    document.getElementById("fc-comarca").onchange = function () {
      if (this.value && this.value !== estado.municipioId) abrirMunicipio(this.value);
    };
    document.querySelectorAll("[data-forum]").forEach(function (el) {
      el.onclick = function () { abrirForum(el.getAttribute("data-forum")); };
    });
    vincularSolicitacoes();
    vincularCopias();
  }

  function abrirForum(id) {
    estado.forumId = id;
    estado.noId = "";
    renderForum();
  }

  function cardNo(no) {
    var tipo = fmtTipoNo(no.tipo);
    var pode = podeGerenciarNo(no);
    var acesso = possuiAcessoNo(no.id);
    var badgeAcesso = ehGC()
      ? (acesso ? '<span class="fc-pill fc-pill--ok">Com acesso</span>' : '<span class="fc-pill fc-pill--locked">Sem acesso</span>')
      : "";
    return '<div class="fc-card" data-nav="no" data-no="' + esc(no.id) + '">' +
      '<div class="fc-card-head"><div><h4>' + esc(no.nome) + "</h4></div>" + badgeAcesso + "</div>" +
      '<div class="fc-meta"><span class="fc-pill fc-pill-type">' + esc(tipo) + "</span>" +
      badgeQuantidade(qtdSetores(no.filhos || []), "Setor", "Setores") +
      badgeQuantidade(no.qtdContatos, "Contato", "Contatos") + "</div>" +
      (pode ? "" : botaoSolicitar("UNIDADE", no.id)) + "</div>";
  }

  function renderForum() {
    var c = host();
    var f = forumAtual();
    var m = municipioAtual();
    if (!c || !f || !m) return;

    var pode = podeGerenciarForum(f);
    var contexto = { tipo: "FORUM", item: f, forumId: f.id, noId: "" };

    c.innerHTML = '<button class="fc-back" id="fc-back-municipio">← ' + esc(m.nome) + "</button>" +
      '<div class="fc-head"><div><h2 class="fc-title">' + esc(f.nome) + "</h2>" +
      breadcrumbHtml(m, f, null) + "</div></div>" +
      '<div class="fc-meta"><span class="fc-pill fc-pill-type">Fórum</span>' +
      badgeQuantidade(f.qtdUnidades, "Unidade", "Unidades") + "</div>" +
      '<div class="fc-address-row"><div class="fc-inherit"><strong>Endereço do Fórum:</strong> ' + linkEndereco(f.endereco) +
      (f.cep ? " • CEP " + esc(f.cep) : "") + "</div></div>" +
      acoesLocalidade("FORUM", f, pode) +
      (pode ? "" : botaoSolicitar("FORUM", f.id)) +
      '<div class="fc-section"><div class="fc-section-title"><h3>Contatos gerais</h3></div>' +
      contatosCards(f.contatos || [], contexto) + "</div>" +
      '<div class="fc-section"><div class="fc-section-title"><h3>Unidades e Setores</h3></div>' +
      ((f.nos || []).length ? (f.nos || []).map(cardNo).join("") : '<div class="fc-empty">Nenhuma Unidade cadastrada.</div>') +
      "</div>" + botaoImpressaoLocalidade("FORUM");

    document.getElementById("fc-back-municipio").onclick = renderForuns;
    document.getElementById("fc-print-forum").onclick = imprimirForum;
    document.querySelectorAll("[data-no]").forEach(function (el) {
      el.onclick = function () { abrirNo(el.getAttribute("data-no")); };
    });
    vincularBreadcrumbs();
    bindAcoesContexto(contexto);
  }

  function abrirNo(id) {
    estado.noId = id;
    renderNo();
  }

  function encontrarPai(lista, id, pai) {
    for (var i = 0; i < (lista || []).length; i++) {
      if (lista[i].id === id) return pai || null;
      var achado = encontrarPai(lista[i].filhos || [], id, lista[i]);
      if (achado) return achado;
    }
    return null;
  }

  function renderNo() {
    var c = host();
    var f = forumAtual();
    var m = municipioAtual();
    var no = noAtual();
    if (!c || !f || !m || !no) return;

    var pai = encontrarPai(f.nos || [], no.id, null);
    var tipo = fmtTipoNo(no.tipo);
    var tipoTela = String(no.tipo || "").toUpperCase() === "SETOR" ? "Setor" : "Unidade";
    var pode = podeGerenciarNo(no);
    var contexto = { tipo: "UNIDADE", item: no, forumId: f.id, noId: no.id };

    c.innerHTML =
      '<button class="fc-back" id="fc-back-no">← ' + esc(pai ? pai.nome : f.nome) + "</button>" +
      '<div class="fc-head"><div><h2 class="fc-title">' + esc(no.nome) + "</h2>" +
      breadcrumbHtml(m, f, no) + "</div></div>" +
      '<div class="fc-meta"><span class="fc-pill fc-pill-type">' + esc(tipo) + "</span>" +
      badgeQuantidade(qtdSetores(no.filhos || []), "Setor", "Setores") + "</div>" +
      '<div class="fc-address-row"><div class="fc-inherit"><strong>Endereço:</strong> ' + linkEndereco(no.enderecoExibicao) +
      (no.cepExibicao ? " • CEP " + esc(no.cepExibicao) : "") +
      (no.endereco ? "" : " <span class=\"fc-muted\">(" + (pai ? "herdado da Unidade" : "herdado do Fórum") + ")</span>") + "</div></div>" +
      acoesLocalidade("UNIDADE", no, pode, tipoTela) +
      (pode ? "" : botaoSolicitar("UNIDADE", no.id)) +
      '<div class="fc-section"><div class="fc-section-title"><h3>Contatos ' + (tipoTela === "Setor" ? "deste setor" : "desta Unidade") + "</h3></div>" +
      contatosCards(no.contatos || [], contexto) + "</div>" +
      ((no.filhos || []).length
        ? '<div class="fc-section"><div class="fc-section-title"><h3>Setores</h3></div>' +
          no.filhos.map(cardNo).join("") + "</div>"
        : "") +
      botaoImpressaoLocalidade("UNIDADE", tipoTela);

    document.getElementById("fc-back-no").onclick = function () {
      if (pai) abrirNo(pai.id);
      else { estado.noId = ""; renderForum(); }
    };
    document.getElementById("fc-print-unit").onclick = imprimirUnidade;
    document.querySelectorAll("[data-no]").forEach(function (el) {
      el.onclick = function () { abrirNo(el.getAttribute("data-no")); };
    });
    vincularBreadcrumbs();
    bindAcoesContexto(contexto);
  }

  function dialogBase(titulo, subtitulo, corpo, botoes) {
    fecharDialog();
    var backdrop = document.createElement("div");
    backdrop.className = "fc-dialog-backdrop";
    backdrop.id = "fc-dialog-backdrop";
    backdrop.innerHTML = '<div class="fc-dialog" role="dialog" aria-modal="true">' +
      "<h3>" + esc(titulo) + "</h3><p>" + esc(subtitulo || "") + "</p>" +
      corpo + '<div class="fc-dialog-actions">' + botoes + "</div></div>";
    backdrop.onclick = function (e) { if (e.target === backdrop) fecharDialog(); };
    document.body.appendChild(backdrop);
    var cancelar = document.getElementById("fc-dialog-cancel");
    if (cancelar) cancelar.onclick = fecharDialog;
  }

  function fecharDialog() {
    var antigo = document.getElementById("fc-dialog-backdrop");
    if (antigo) antigo.remove();
  }

  function contextoPayload(contexto) {
    return {
      forumId: contexto.forumId || "",
      unidadeOrganizacionalId: contexto.noId || ""
    };
  }

  function abrirContatoDialog(contexto, contato) {
    var editando = !!contato;
    var tipos = ["Telefone", "Ramal", "WhatsApp", "E-mail", "Fax"];
    var corpo = '<div class="fc-form-grid">' +
      '<div class="fc-field"><label for="fc-form-type">Tipo</label><select id="fc-form-type">' +
      tipos.map(function (t) {
        return '<option value="' + esc(t) + '"' +
          (fmtTipoContato(contato && contato.tipo) === t ? " selected" : "") + ">" + esc(t) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="fc-field"><label for="fc-form-desc">Descrição</label><input id="fc-form-desc" maxlength="150" value="' +
      esc(contato && contato.descricao || "") + '" placeholder="Ex.: Balcão, Gabinete, Secretaria"></div>' +
      '<div class="fc-field fc-field--full"><label for="fc-form-value">Valor</label><input id="fc-form-value" value="' +
      esc(contato && contato.valor || "") + '" placeholder="Telefone, ramal, WhatsApp ou e-mail"></div>' +
      '<div class="fc-field fc-field--full"><label for="fc-form-obs">Observação</label><textarea id="fc-form-obs" maxlength="2000">' +
      esc(contato && contato.observacao || "") + "</textarea></div></div>";

    dialogBase(
      editando ? "Editar contato" : "Adicionar contato",
      contexto.item.nome || "Localidade",
      corpo,
      '<button type="button" class="fc-btn" id="fc-dialog-cancel">Cancelar</button>' +
      '<button type="button" class="fc-btn fc-btn--primary" id="fc-dialog-save">Salvar</button>'
    );

    document.getElementById("fc-dialog-save").onclick = function () {
      var btn = this;
      var dados = Object.assign(contextoPayload(contexto), {
        tipo: document.getElementById("fc-form-type").value,
        descricao: document.getElementById("fc-form-desc").value.trim(),
        valor: document.getElementById("fc-form-value").value.trim(),
        observacao: document.getElementById("fc-form-obs").value.trim()
      });
      if (!dados.tipo || !dados.valor) {
        mostrarToastSeguro("Informe o tipo e o valor do contato.", "warning");
        return;
      }
      btn.disabled = true;
      btn.textContent = "Salvando...";
      var callback = function (resp) {
        if (resp && resp.sucesso === true) {
          fecharDialog();
          mostrarToastSeguro(editando ? "Contato atualizado." : "Contato adicionado.", "success");
          recarregar({ mostrarCarregando: false });
        } else {
          btn.disabled = false;
          btn.textContent = "Salvar";
          mostrarToastSeguro((resp && resp.erro) || "Não foi possível salvar o contato.", "error");
        }
      };
      var falha = function (erro) {
        btn.disabled = false;
        btn.textContent = "Salvar";
        mostrarToastSeguro((erro && erro.message) || "Falha ao salvar o contato.", "error");
      };
      if (editando) API.atualizarContato(contato.id, dados, callback, falha);
      else API.criarContato(dados, callback, falha);
    };
  }

  function excluirContato(id) {
    if (!id) return;
    confirmarAcaoSistema({ titulo: "Excluir contato", mensagem: "Excluir este contato? Esta ação não poderá ser desfeita.", textoConfirmar: "Excluir contato", perigo: true, icone: "🗑" }).then(function (confirmado) {
      if (!confirmado) return;
      API.excluirContato(id, function (resp) {
        if (resp && resp.sucesso === true) {
          mostrarToastSeguro("Contato excluído.", "success");
          recarregar({ mostrarCarregando: false });
        } else {
          mostrarToastSeguro((resp && resp.erro) || "Não foi possível excluir o contato.", "error");
        }
      }, function (erro) {
        mostrarToastSeguro((erro && erro.message) || "Falha ao excluir o contato.", "error");
      });
    });
  }

  function abrirLocalidadeDialog(contexto, tipoNovo) {
    var ehSetor = tipoNovo === "SETOR";
    var rotulo = ehSetor ? "Setor" : "Unidade";
    var corpo = '<div class="fc-form-grid">' +
      '<div class="fc-field fc-field--full"><label for="fc-locality-name">Nome</label><input id="fc-locality-name" maxlength="150" placeholder="Nome da nova ' + rotulo + '"></div>' +
      '<div class="fc-field fc-field--full"><label for="fc-locality-address">Endereço</label><input id="fc-locality-address" maxlength="300" placeholder="Opcional; vazio para herdar"></div>' +
      '<div class="fc-field"><label for="fc-locality-cep">CEP</label><input id="fc-locality-cep" maxlength="10" placeholder="00000-000"></div></div>';

    dialogBase(
      "Adicionar " + rotulo,
      ehSetor ? "Novo Setor de " + contexto.item.nome : "Nova Unidade de " + contexto.item.nome,
      corpo,
      '<button type="button" class="fc-btn" id="fc-dialog-cancel">Cancelar</button>' +
      '<button type="button" class="fc-btn fc-btn--primary" id="fc-dialog-save">Salvar</button>'
    );

    document.getElementById("fc-dialog-save").onclick = function () {
      var btn = this;
      var dados = {
        forumId: contexto.forumId,
        paiId: ehSetor ? contexto.noId : "",
        tipo: tipoNovo,
        nome: document.getElementById("fc-locality-name").value.trim(),
        endereco: document.getElementById("fc-locality-address").value.trim(),
        cep: document.getElementById("fc-locality-cep").value.trim()
      };
      if (!dados.nome) {
        mostrarToastSeguro("Informe o nome da " + rotulo + ".", "warning");
        return;
      }
      btn.disabled = true;
      btn.textContent = "Salvando...";
      API.criarLocalidade(dados, function (resp) {
        if (resp && resp.sucesso === true) {
          fecharDialog();
          mostrarToastSeguro(
            resp.dados && resp.dados.existente
              ? rotulo + " já existente; nenhum registro duplicado foi criado."
              : rotulo + " adicionad" + (ehSetor ? "o" : "a") + ".",
            "success"
          );
          recarregar({ mostrarCarregando: false });
        } else {
          btn.disabled = false;
          btn.textContent = "Salvar";
          mostrarToastSeguro((resp && resp.erro) || "Não foi possível adicionar a localidade.", "error");
        }
      }, function (erro) {
        btn.disabled = false;
        btn.textContent = "Salvar";
        mostrarToastSeguro((erro && erro.message) || "Falha ao adicionar a localidade.", "error");
      });
    };
  }

  function abrirEnderecoDialog(contexto) {
    var item = contexto.item;
    var enderecoAtual = item.endereco || "";
    var cepAtual = item.cep || "";
    var corpo = '<div class="fc-form-grid">' +
      '<div class="fc-field fc-field--full"><label for="fc-address">Endereço</label><input id="fc-address" value="' +
      esc(enderecoAtual) + '" placeholder="Logradouro, número, bairro, cidade"></div>' +
      '<div class="fc-field"><label for="fc-cep">CEP</label><input id="fc-cep" value="' + esc(cepAtual) + '" placeholder="00000-000"></div>' +
      '</div><p style="margin-top:10px">Para remover o endereço próprio e voltar à herança da localidade superior, deixe Endereço e CEP vazios.</p>';

    dialogBase(
      enderecoAtual ? "Editar endereço" : "Adicionar endereço",
      item.nome || "Localidade",
      corpo,
      '<button type="button" class="fc-btn fc-btn--danger" id="fc-address-clear">Limpar endereço</button>' +
      '<button type="button" class="fc-btn" id="fc-dialog-cancel">Cancelar</button>' +
      '<button type="button" class="fc-btn fc-btn--primary" id="fc-dialog-save">Salvar</button>'
    );

    document.getElementById("fc-address-clear").onclick = function () {
      document.getElementById("fc-address").value = "";
      document.getElementById("fc-cep").value = "";
    };

    document.getElementById("fc-dialog-save").onclick = function () {
      var btn = this;
      btn.disabled = true;
      btn.textContent = "Salvando...";
      API.atualizarEnderecoLocalidade(
        contexto.tipo,
        item.id,
        {
          endereco: document.getElementById("fc-address").value.trim(),
          cep: document.getElementById("fc-cep").value.trim()
        },
        function (resp) {
          if (resp && resp.sucesso === true) {
            fecharDialog();
            mostrarToastSeguro("Endereço atualizado.", "success");
            recarregar({ mostrarCarregando: false });
          } else {
            btn.disabled = false;
            btn.textContent = "Salvar";
            mostrarToastSeguro((resp && resp.erro) || "Não foi possível atualizar o endereço.", "error");
          }
        },
        function (erro) {
          btn.disabled = false;
          btn.textContent = "Salvar";
          mostrarToastSeguro((erro && erro.message) || "Falha ao atualizar o endereço.", "error");
        }
      );
    };
  }

  function printEsc(v) { return esc(v); }

  function contatoPrint(c) {
    var tipo = fmtTipoContato(c.tipo);
    var descricao = String(c.descricao || "").trim();
    var complemento = descricao && descricao.toLocaleLowerCase("pt-BR") !== String(tipo).toLocaleLowerCase("pt-BR")
      ? " — " + printEsc(descricao)
      : "";
    return '<li><strong>' + printEsc(tipo) + ":</strong> " + printEsc(c.valor || "") + complemento + "</li>";
  }

  function noPrint(no, nivel) {
    nivel = nivel || 0;
    var titulo = Math.min(6, nivel + 3);
    var contatos = (no.contatos || []).length
      ? "<ul>" + (no.contatos || []).map(contatoPrint).join("") + "</ul>"
      : '<p class="muted">Sem contatos diretos.</p>';
    return '<section class="unit"><h' + titulo + ">" + printEsc(no.nome) + "</h" + titulo + ">" +
      '<p class="meta">' + printEsc(fmtTipoNo(no.tipo)) + " • " +
      printEsc(no.enderecoExibicao || "Endereço não informado") +
      (no.cepExibicao ? " • CEP " + printEsc(no.cepExibicao) : "") + "</p>" +
      contatos + (no.filhos || []).map(function (filho) { return noPrint(filho, nivel + 1); }).join("") +
      "</section>";
  }

  function forumPrint(f, municipioNome) {
    var contatos = (f.contatos || []).length
      ? "<ul>" + (f.contatos || []).map(contatoPrint).join("") + "</ul>"
      : '<p class="muted">Sem contatos gerais.</p>';
    return '<section class="forum"><h2>' + printEsc(f.nome) + "</h2>" +
      '<p class="meta">' + printEsc(municipioNome || "") + " • " +
      printEsc(f.endereco || "Endereço não informado") +
      (f.cep ? " • CEP " + printEsc(f.cep) : "") + "</p>" +
      contatos + (f.nos || []).map(function (no) { return noPrint(no, 0); }).join("") + "</section>";
  }

  function abrirImpressao(titulo, corpo) {
    var w = window.open("", "_blank");
    if (!w) {
      mostrarToastSeguro("Desbloqueie pop-ups para imprimir.", "warning");
      return;
    }
    var css =
      "body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;margin:24px;line-height:1.45}" +
      "h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;border-bottom:2px solid #0f172a;padding-bottom:5px;margin-top:24px}" +
      "h3,h4,h5,h6{font-size:15px;margin:16px 0 4px}.meta{color:#64748b;font-size:11px;margin:0 0 8px}.muted{color:#94a3b8;font-style:italic;font-size:12px}" +
      "ul{margin:5px 0 10px;padding-left:20px}li{font-size:12px;margin:2px 0}.forum{break-before:auto}.unit{break-inside:auto;page-break-inside:auto;border-left:2px solid #e2e8f0;padding-left:10px;margin:9px 0}.unit>h3,.unit>h4,.unit>h5,.unit>h6{break-after:avoid-page;page-break-after:avoid}.unit>ul{break-inside:avoid-page;page-break-inside:avoid}" +
      "@media print{@page{size:A4 portrait;margin:12mm}html,body{margin:0;padding:0}.forum,.unit{break-before:auto;page-break-before:auto}}";
    var html = '<!doctype html><html><head><meta charset="utf-8"><title>' + printEsc(titulo) +
      "</title><style>" + css + "</style></head><body><h1>" + printEsc(titulo) +
      '<p class="meta">Gerado em ' + printEsc(new Date().toLocaleString("pt-BR")) +
      "</p>" + corpo + "<script>window.onload=function(){setTimeout(function(){window.print();},250)}<\/script></body></html>";
    w.document.open();
    w.document.write(html);
    w.document.close();
  }

  function imprimirTudo() {
    var municipios = estado.dados.municipios || [];
    var corpo = municipios.map(function (m) {
      return '<section><h2>' + printEsc(m.nome) + "</h2>" +
        (m.foruns || []).map(function (f) { return forumPrint(f, m.nome); }).join("") + "</section>";
    }).join("");
    abrirImpressao("Todos os contatos do PJES", corpo || '<p class="muted">Nenhum contato cadastrado.</p>');
  }

  function imprimirForum() {
    var f = forumAtual();
    var m = municipioAtual();
    if (!f || !m) return;
    abrirImpressao("Contatos — " + f.nome, forumPrint(f, m.nome));
  }

  function imprimirUnidade() {
    var no = noAtual();
    var f = forumAtual();
    if (!no || !f) return;
    abrirImpressao("Contatos — " + no.nome, noPrint(no, 0));
  }

  function codigoMunicipio(feature) {
    var p = feature && feature.properties || {};
    return String(p.CD_MUN || p.codmun || p.id || p.code || "").replace(/\D/g, "");
  }

  function municipioComContatos(codigo) {
    return (estado.dados.municipios || []).some(function (m) {
      return String(m.codigoIbge || "").replace(/\D/g, "") === codigo && Number(m.qtdContatos || 0) > 0;
    });
  }

  function estiloMunicipio(feature) {
    var tem = municipioComContatos(codigoMunicipio(feature));
    return tem
      ? { color: "#2563eb", weight: 1.2, fillColor: "#60a5fa", fillOpacity: .42 }
      : { color: "#94a3b8", weight: .8, fillColor: "#cbd5e1", fillOpacity: .24 };
  }

  function destacarMunicipio(codigo) {
    if (!estado.mapa || !estado.geojson || !codigo) return;
    estado.geojson.eachLayer(function (layer) {
      var cod = codigoMunicipio(layer.feature);
      var alvo = String(codigo).replace(/\D/g, "");
      var ativo = cod === alvo;
      layer.setStyle(Object.assign({}, estiloMunicipio(layer.feature), {
        weight: ativo ? 3 : estiloMunicipio(layer.feature).weight,
        fillOpacity: ativo ? .58 : estiloMunicipio(layer.feature).fillOpacity
      }));
    });
  }

  function adicionarLegendaMapa() {
    if (!window.L || !estado.mapa) return;
    var legenda = L.control({ position: "bottomright" });
    legenda.onAdd = function () {
      var div = L.DomUtil.create("div", "fc-map-legenda");
      div.innerHTML = '<span class="tem-contato">● Comarcas com contatos</span><span class="sem-contato">● Sem contatos cadastrados</span>';
      return div;
    };
    legenda.addTo(estado.mapa);
  }

  function iniciarMapa() {
    if (!window.L) { setTimeout(iniciarMapa, 250); return; }
    var el = document.getElementById("fc-map");
    if (!el) return;

    try {
      if (estado.mapa) estado.mapa.remove();
      estado.mapa = L.map(el, { scrollWheelZoom: true }).setView([-19.7, -40.5], 7.6);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap"
      }).addTo(estado.mapa);

      fetch("https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-32-mun.json")
        .then(function (r) { return r.json(); })
        .then(function (data) {
          estado.geojson = L.geoJSON(data, {
            style: estiloMunicipio,
            onEachFeature: function (feature, layer) {
              var codigo = codigoMunicipio(feature);
              var p = feature.properties || {};
              var nome = String(p.name || p.NOME || p.NM_MUN || "Comarca");
              var tem = municipioComContatos(codigo);
              layer.bindTooltip(
                esc(nome) + (tem ? "<br><small>Possui contatos cadastrados</small>" : "<br><small>Sem contatos cadastrados</small>"),
                { sticky: true }
              );
              if (tem) {
                layer.on("click", function () {
                  var m = (estado.dados.municipios || []).find(function (x) {
                    return String(x.codigoIbge || "").replace(/\D/g, "") === codigo;
                  });
                  if (m) abrirMunicipio(m.id);
                });
              }
            }
          }).addTo(estado.mapa);
          adicionarLegendaMapa();
          estado.mapa.fitBounds(estado.geojson.getBounds(), { padding: [3, 3] });
        })
        .catch(function (err) { console.warn("GeoJSON não carregado", err); });

      if (window.ResizeObserver) {
        estado.resizeObserver = new ResizeObserver(function () {
          try { estado.mapa.invalidateSize(); } catch (e) {}
        });
        estado.resizeObserver.observe(el);
      }
    } catch (e) {
      console.warn("Mapa não inicializado", e);
    }
  }

  function atualizarMapaDados() {
    if (!estado.mapa) return;
    try {
      if (estado.geojson) {
        estado.geojson.eachLayer(function (layer) {
          layer.setStyle(estiloMunicipio(layer.feature));
        });
      }
      estado.mapa.invalidateSize();
    } catch (e) {}
  }

  function atualizarMapaIntegrado() {
    if (!estado.inicializado) {
      iniciarNavegacaoForum(true);
      return false;
    }
    setTimeout(function () {
      try {
        estado.mapa.invalidateSize();
        if (estado.geojson) estado.mapa.fitBounds(estado.geojson.getBounds(), { padding: [3, 3] });
      } catch (e) {}
    }, 80);
    return true;
  }

  function iniciarNavegacaoForum(forcar) {
    injectStyle();
    if (estado.inicializado && !forcar) {
      restaurarNavegacao();
      atualizarMapaIntegrado();
      return;
    }
    estado.inicializado = true;
    recarregar({ mostrarCarregando: true });
    if (!estado.mapa) setTimeout(iniciarMapa, 0);
  }

  window.iniciarNavegacaoForum = iniciarNavegacaoForum;
  window.recarregarNavegacaoForum = function () { recarregar({ mostrarCarregando: false }); };
  window.renderizarMapaConsulta = atualizarMapaIntegrado;
  window.tentarInicializarMapa = atualizarMapaIntegrado;
  window.fcInicio = renderInicio;
  window.fcMunicipio = renderForuns;
  window.fcForum = renderForum;
  window.fcNo = abrirNo;
  window.fcImprimirTudo = imprimirTudo;
  window.fcImprimirForum = imprimirForum;
  window.fcImprimirUnidade = imprimirUnidade;

  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(function () { iniciarNavegacaoForum(true); }, 120);
  });
})();
</script>
