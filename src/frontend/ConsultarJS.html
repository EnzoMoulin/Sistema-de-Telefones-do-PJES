function podeImprimirComarcaConsulta(comarca){
  try{
    if(typeof comarcasPermitidasDoUsuario!=="function") return true;
    var perm = comarcasPermitidasDoUsuario();
    if(perm===null) return true;
    if(!Array.isArray(perm)) return true;
    if(!perm.length) return true;
    var ck = typeof normalizarChaveTabela==="function" ? normalizarChaveTabela(comarca) : typeof normalizarChave==="function" ? normalizarChave(comarca) : String(comarca||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase();
    return perm.indexOf(ck)!==-1;
  }catch(e){ return true; }
}
function bloquearImpressaoSemPermissaoConsulta(comarca){
  if(!podeImprimirComarcaConsulta(comarca)){

}

/* ==========================================================

function contatoPreenchido(valor) {
  const v = String(valor || "").trim();

  return (
    v !== "" &&
    v !== "-" &&
    v !== "–" &&
    v !== "—"
  );
}

function agruparContatosDoSetor(registros) {
  const resultado = {
    telefones: [],
    ramais: [],
    whatsapps: [],
    emails: [],
    enderecos: []
  };

  const vistos = {
    telefones: new Set(),
    ramais: new Set(),
    whatsapps: new Set(),
    emails: new Set(),
    enderecos: new Set()
  };

  function adicionar(tipo, valor) {
    const texto =
      String(valor || "").trim();

    if (!contatoPreenchido(texto)) {
      return;
    }
    // v3.33: split múltiplos valores separados por vírgula/ponto-vírgula/quebra (telefone/ramal/whatsapp/email) — cada valor em linha própria com botão próprio
    let partes = [texto];
    if (tipo !== "enderecos") {
      if (/[,;\n]/.test(texto)) {
        partes = texto.split(/[,;\n]+/).map(function(s){ return String(s||"").trim(); }).filter(contatoPreenchido);
        if (tipo === "telefones" || tipo === "ramais" || tipo === "whatsapps") {
          let expandido = [];
          partes.forEach(function(part){
            if (part.indexOf("/") !== -1) {
              part.split("/").forEach(function(sub){
                let t = String(sub||"").trim();
                if (contatoPreenchido(t)) expandido.push(t);
              });
            } else {
              expandido.push(part);
            }
          });
          partes = expandido;
        }
      } else if ((tipo === "telefones" || tipo === "ramais" || tipo === "whatsapps") && texto.indexOf("/") !== -1) {
        partes = texto.split("/").map(function(s){ return String(s||"").trim(); }).filter(contatoPreenchido);
      }
    }
    partes.forEach(function(part){
      const t = String(part||"").trim();
      if (!contatoPreenchido(t) || vistos[tipo].has(t)) return;
      vistos[tipo].add(t);
      resultado[tipo].push(t);
    });
  }

  (
    Array.isArray(registros)
      ? registros
      : []
  ).forEach(registro => {
    adicionar(
      "telefones",
      campoTelefone(registro, [
        "telefone",
        "TELEFONE",
        "numero",
        "NUMERO"
      ])
    );

    adicionar(
      "ramais",
      campoTelefone(registro, [
        "ramal",
        "RAMAL"
      ])
    );

    adicionar(
      "whatsapps",
      campoTelefone(registro, [
        "whatsapp",
        "WHATSAPP",
        "WhatsApp"
      ])
    );

    adicionar(
      "emails",
      campoTelefone(registro, [
        "email",
        "EMAIL",
        "E-MAIL",
        "E_MAIL"
      ])
    );

    adicionar(
      "enderecos",
      campoTelefone(registro, [
        "endereco",
        "ENDERECO",
        "Endereço"
      ])
    );
  });

  return resultado;
}

/* ==========================================================
 * FORMATAÇÃO
 * ========================================================== */

function formatarTelefoneConsulta(valor) {
  const numeros =
    String(valor || "")
      .replace(/\D/g, "");

  if (!numeros) return "-";

  const local =
    numeros.startsWith("55")
      ? numeros.slice(2)
      : numeros;

  if (
    local.length === 11 &&
    local.startsWith("27")
  ) {
    return (
      "(" +
      local.slice(0, 2) +
      ") " +
      local.slice(2, 7) +
      "-" +
      local.slice(7)
    );
  }

  if (
    local.length === 10 &&
    local.startsWith("27")
  ) {
    return (
      "(" +
      local.slice(0, 2) +
      ") " +
      local.slice(2, 6) +
      "-" +
      local.slice(6)
    );
  }

  return String(valor || "-");
}

function formatarWhatsappConsulta(valor) {
  return contatoPreenchido(valor)
    ? formatarTelefoneConsulta(valor)
    : "-";
}

/* ==========================================================

function linkWhatsappConsulta(valor) {
  const numeros =
    String(valor || "")
      .replace(/\D/g, "");

  if (!numeros) return "";

  return (
    "https://wa.me/" +
    (
      numeros.startsWith("55")
        ? numeros
        : "55" + numeros
    )
  );
}

function linkTelefoneConsulta(valor) {
  const numeros =
    String(valor || "")
      .replace(/\D/g, "");

  if (!numeros) return "";

  const local =
    numeros.startsWith("55")
      ? numeros.slice(2)
      : numeros;

  return "tel:+55" + local;
}

function linkEnderecoConsulta(valor){
  var v = String(valor||"").trim();
  if(!v) return "";
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(v);
}
function linkEmailConsulta(valor) {
  return (
    "mailto:" +
    encodeURIComponent(
      String(valor || "")
    )
  );
}

function blocoContato(
  titulo,
  valores,
  formatador,

  const lista =

    '<div class="contato-bloco">' +
      '<div class="contato-titulo">' +
        escaparConsulta(titulo) +
      '</div>';

    return (
      html +
      '<div class="contato-vazio">-</div>' +
      '</div>'
    );
  }

  html +=
    '<div class="contato-lista">';

  // v3.33: um contato por linha — cada valor em div própria com botão próprio se permitido (GC/GS)
  lista.forEach(valor => {
    const texto =
      formatador
        ? formatador(valor)
        : valor;
    const href =
      (criadorLink && contatoPreenchido(valor))
        ? criadorLink(valor)
        : "";
    const idDoValor = (mapaIds && mapaIds[valor]) ? String(mapaIds[valor]||"").trim() : "";
    const comBotao = !!(podeEditar && idDoValor);
    if (comBotao) {
      html +=
        '<div class="contato-item" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:6px;">' +
        '<span style="flex:1;font-size:13px;word-break:break-word;">' +
        (href
          ? '<a class="contato-item-link ' + (classe || "") + '" href="' + escaparConsulta(href) + '"' + (classe === "whatsapp" || classe === "endereco" ? ' target="_blank" rel="noopener noreferrer"' : "") + ' style="color:' + (classe==="whatsapp" ? "#16a34a" : classe==="email" ? "#2563eb" : classe==="telefone" ? "#1d4ed8" : "#0f172a") + ';font-weight:600;text-decoration:none;">' + escaparConsulta(texto) + "</a>"
          : '<span style="color:#0f172a;font-weight:600;">' + escaparConsulta(texto) + "</span>") +
        "</span>" +
        '<span style="display:flex;gap:6px;flex-shrink:0;">' +
        '<button type="button" class="btn btn-primary" style="padding:4px 9px;font-size:11px;" onclick="abrirEditarTelefone(\'' + escaparJs(idDoValor) + '\')" title="Editar ' + escaparConsulta(titulo) + '">\u270F\uFE0F Editar</button>' +
        '<button type="button" class="btn btn-danger" style="padding:4px 9px;font-size:11px;" onclick="abrirExcluir(\'' + escaparJs(idDoValor) + '\')" title="Excluir">\uD83D\uDDD1\uFE0F Excluir</button>' +
        "</span></div>";
    } else if (
      criadorLink &&
      contatoPreenchido(valor)
    ) {
      const href2 =
        criadorLink(valor);

      html +=
        '<div class="contato-item">' +
        '<a class="contato-item-link ' +
        (classe || "") +
        '" href="' +
        escaparConsulta(href2) +
        '"' +
        (
          classe === "whatsapp" || classe === "endereco"
            ? ' target="_blank" rel="noopener noreferrer"'
            : ""
        ) +
        ">" +
        escaparConsulta(texto) +
        "</a>" +
        "</div>";
    } else {
      html +=
        '<div class="contato-item">' +
          escaparConsulta(texto) +
        "</div>";
    }
  });

  return (
    html +
    "</div></div>"
  );
}

/* ==========================================================

function obterDensidadeComarca(nomeComarca){
  var lista = (typeof setoresPorComarca!=="undefined" && setoresPorComarca[nomeComarca]) ? setoresPorComarca[nomeComarca] : [];
  return Array.isArray(lista) ? lista.length : 0;
}

function municipioParaComarcas(nomeMunicipio){
  var norm = normalizarTexto(nomeMunicipio||"");
  if(!norm) return [];
  if(typeof ordemComarcas==="undefined" || !ordemComarcas || !ordemComarcas.length) return [];
  // Show ALL comarcas of the municipio regardless of permission; filtering only applies to button visibility, not list presence.
  // Vitória fix: comarcas like "Vitória (Fórum Cível)" share base "vitoria"; parentheses stripped via normalizarTexto still allows includes match both directions.
  // Also handle município GeoJSON name sometimes including accents/case differences.
  var lista=[];
  for(var i=0;i<ordemComarcas.length;i++){
    var c=ordemComarcas[i];
    var cn=normalizarTexto(c);
    // Base comparison: extract base before parenthesis for Vitória-style disambiguation
    var cnBase = cn.split("(")[0].trim();
    var normBase = norm.split("(")[0].trim();
    var match=(cn===norm || cnBase===norm || cnBase===normBase || norm.indexOf(cn)!==-1 || cn.indexOf(norm)!==-1 || normBase.indexOf(cnBase)!==-1 || cnBase.indexOf(normBase)!==-1);
    if(!match) continue;
    if(lista.indexOf(c)===-1) lista.push(c);
  }
  return lista;
}

function municipioParaComarca(nomeMunicipio){
  var lista = (typeof municipioParaComarcas==="function") ? municipioParaComarcas(nomeMunicipio) : [];
  if(lista && lista.length) return lista[0];
  return "";
}

function corPorDensidade(dens){
  if(!dens || dens===0) return "#e2e8f0";
  if(dens<=3) return "#bfdbfe";
  if(dens<=7) return "#60a5fa";
  return "#1d63b8";
}

function estiloMunicipio(feature){
  var nome = String(feature.properties.name||feature.properties.NOME||"").trim();
  var comarcas = (typeof municipioParaComarcas==="function") ? municipioParaComarcas(nome) : [];
  var dens = 0;
  for(var i=0;i<comarcas.length;i++) dens += obterDensidadeComarca(comarcas[i]);
  var isSel = municipioSelecionado && normalizarTexto(nome)===normalizarTexto(municipioSelecionado);
  return {
    fillColor: isSel ? "#00adb5" : corPorDensidade(dens),
    fillOpacity: dens===0 ? 0.35 : 0.6,
    color: isSel ? "#0f172a" : "#ffffff",
    weight: isSel ? 2.2 : 1.2,
    opacity: 1
  };
}

function aoClicarMunicipio(nomeMunicipio, feature, layer){
  municipioSelecionado = String(nomeMunicipio||"").trim();
  var comarcas = (typeof municipioParaComarcas==="function") ? municipioParaComarcas(nomeMunicipio) : [];
  var compNomes = (comarcas && comarcas.length) ? comarcas.slice() : [];
  if(!compNomes.length){
    var single = municipioParaComarca(nomeMunicipio);
    if(single) compNomes=[single];
    else compNomes=[String(nomeMunicipio||"").trim()];
  }
  // Sort compNomes by ordemComarcas order (sheet order)
  try{
    if(typeof ordemComarcas!=="undefined" && ordemComarcas && ordemComarcas.length){
      var ordemIdx={};
      for(var _oi=0; _oi<ordemComarcas.length; _oi++) ordemIdx[ordemComarcas[_oi]]=_oi;
      compNomes.sort(function(a,b){
        var ia = ordemIdx.hasOwnProperty(a) ? ordemIdx[a] : 9999;
        var ib = ordemIdx.hasOwnProperty(b) ? ordemIdx[b] : 9999;
        return ia - ib;
      });
    }
  }catch(eSort){}
  // v3.30: GC clique município mostra TODAS comarcas daquele município para consulta (com Solicitar/Cancelar), inicial já filtra só permitidas via aoEntrarConsultaTelefonesView/renderizarComarcas
  var temComarcaReal = false;
  try{
    if(typeof ordemComarcas!=="undefined"){
      for(var ci=0; ci<compNomes.length; ci++){
        if(ordemComarcas.indexOf(compNomes[ci])!==-1){ temComarcaReal=true; break; }
      }
    } else { temComarcaReal=true; }
  }catch(e){ temComarcaReal=true; }
  if(temComarcaReal){
    // Directly render ALL comarcas of this municipality (unfiltered, all micros) in ordemComarcas order
    try{
      var campo = document.getElementById("campo-pesquisa-consulta");
      if(campo) campo.value = "";
      // Clear microrregiao selection - we show municipality's comarcas directly regardless of filter

      if(selClear) selClear.value = "";
      renderizarListaComarcasMunicipio(compNomes, temComarcaReal, layer);
      return;
    }catch(eDirect){ /* fallback to old flow */ }
  }
  var micros=[];
  var microSet={};
  try{
    for(var idx=0; idx<compNomes.length; idx++){
      var cc = compNomes[idx];
      var m = "";
      if(typeof microrregioesPorComarca!=="undefined") m = String(microrregioesPorComarca[cc]||"").trim();
      if(!m && typeof comarcasPorMicrorregiao!=="undefined"){
        for(var k in comarcasPorMicrorregiao){
          if((comarcasPorMicrorregiao[k]||[]).indexOf(cc)!==-1){ m=k; break; }
        }
      }
      if(m && !microSet[m]){ microSet[m]=true; micros.push(m); }
    }
  }catch(e){}
  var microEscolhida="";
  if(micros.length===1) microEscolhida=micros[0];
  else if(micros.length>1) microEscolhida=micros[0];
  else if(!temComarcaReal){
    try{
      var fallbackNome = String(nomeMunicipio||"").trim();
      if(typeof comarcasPorMicrorregiao!=="undefined"){
        for(var k2 in comarcasPorMicrorregiao){
          if((comarcasPorMicrorregiao[k2]||[]).indexOf(fallbackNome)!==-1){ microEscolhida=k2; break; }
        }
      }
    }catch(e2){}
  }
  if(microEscolhida && typeof selecionarMicrorregiaoConsulta==="function"){
    var sel = document.getElementById("filtro-microrregiao-consulta");
    if(sel) sel.value = microEscolhida;
    selecionarMicrorregiaoConsulta(microEscolhida);
  }

function initMapaLeaflet(containerId, isOverlay){

    } else {
      cont.innerHTML = '<div style="padding:24px;text-align:center;color:#dc2626;font-size:13px;">Leaflet n\u00e3o carregou \u2014 verifique conex\u00e3o ou recarregue a p\u00e1gina.<br><button type="button" class="btn btn-secondary" style="margin-top:10px;padding:6px 12px;font-size:12px;" onclick="location.reload()">Recarregar</button> <button type="button" class="btn btn-secondary" style="margin-top:10px;padding:6px 10px;font-size:12px;" onclick="initMapaLeaflet(\''+containerId+'\','+(isOverlay?'true':'false')+')">Tentar novamente</button></div>';

      .then(function(data){ geoJsonCache = data; desenhar(data); })

        var fallback = document.createElement("img");

        cont.appendChild(fallback);
      });
  }

  function desenhar(data){
    var layer = L.geoJSON(data, {
      style: estiloMunicipio,
      onEachFeature: function(feature, lyr){
        var nome = String(feature.properties.name||feature.properties.NOME||"").trim();
        lyr.bindTooltip(construirTooltipMunicipio(nome), { permanent:false, direction:"auto", className:"tooltip-premium", sticky:true });

              e.target.setStyle({fillColor:"#00adb5", fillOpacity:0.85, weight:2.4, color:"#0f172a"});

      var match = nome.indexOf(termoNorm)!==-1;

          var cn = normalizarTexto(lista[i]);
          if(cn.indexOf(termoNorm)!==-1 || termoNorm.indexOf(cn)!==-1){ match=true; break; }
        }
      } else if(!match){
        var comarca = normalizarTexto(municipioParaComarca(String(l.feature.properties.name||"")));
        match = comarca.indexOf(termoNorm)!==-1;
      }
      if(match){
        l.setStyle({opacity:1, fillOpacity:0.75});
        l.bringToFront();
      } else {

      }
    });

function criarMapaOverlay(){
  var overlay = document.getElementById("mapa-overlay");
  if(overlay) return overlay;
  overlay = document.createElement("div");
  overlay.id = "mapa-overlay";
  overlay.className = "mapa-overlay";
  overlay.innerHTML =
    '<div class="mapa-overlay-painel">' +
      '<div class="mapa-overlay-header">' +
        '<h3>Mapa Interativo \u2014 Esp\u00edrito Santo</h3>' +

      '</div>' +
      '<div class="mapa-overlay-area"><div id="mapa-leaflet-overlay"></div></div>' +
    '</div>';
  overlay.addEventListener("click", function(evento){
    if(evento.target===overlay) fecharMapaConsulta();
  });
  document.body.appendChild(overlay);
  return overlay;
}

function abrirMapaConsulta(){
  var overlay = criarMapaOverlay();
  if(!overlay){ console.error("N\u00e3o foi poss\u00edvel criar o mapa."); return; }
  overlay.classList.add("ativo");
  document.body.classList.add("mapa-aberto");
  var btnImp = document.getElementById("btn-imprimir-consulta-todos");
  if(btnImp) btnImp.style.display="none";
  var btnStub = document.getElementById("btn-imprimir-consulta");
  if(btnStub) btnStub.style.display="none";
  setTimeout(function(){
    if(!mapaLeafletOverlay){
      initMapaLeaflet("mapa-leaflet-overlay", true);

      try{ mapaLeafletOverlay.invalidateSize(); if(camadaGeoJsonOverlay) mapaLeafletOverlay.fitBounds(camadaGeoJsonOverlay.getBounds(), {padding:[6,6]}); }catch(e){}

}

function fecharMapaConsulta(){
  var overlay = document.getElementById("mapa-overlay");
  if(overlay) overlay.classList.remove("ativo");
  document.body.classList.remove("mapa-aberto");
  var detalhes = document.getElementById("consulta-detalhes-conteudo");
  var btnImp = document.getElementById("btn-imprimir-consulta-todos");
  if(btnImp){
    var isConsulta = !!(document.getElementById("consulta-telefones-view") && !document.getElementById("consulta-telefones-view").classList.contains("hidden"));
    btnImp.style.display = isConsulta ? "" : "none";
  }
  var btnStub = document.getElementById("btn-imprimir-consulta");
  if(btnStub) btnStub.style.display="none";
  setTimeout(function(){ try{ if(mapaLeaflet) mapaLeaflet.invalidateSize(); }catch(e){} }, 120);
}

function normalizarTextoConsulta(valor){
  try{ if(typeof normalizarTexto==="function") return normalizarTexto(valor); }catch(e){}
  return String(valor||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}


function filtrarSetoresConsulta() {
  // v3.33: se novos filtros existem, delegar para funcao unificada (preserva pesquisa geral + ordem planilha)
  try{
    var hasNovos=document.getElementById("filtro-comarca-consulta")||document.getElementById("filtro-setor-consulta");
    if(hasNovos && typeof filtrarListaConsultaPorComarcaSetor==="function" && !window._filtrarConsultaEmExecucao){
      return filtrarListaConsultaPorComarcaSetor();
    }
  }catch(e){}
  try{ if(typeof renderizarComarcas!=="function" && typeof window.renderizarComarcas!=="function"){ /* fallback: show all */ var all=document.querySelectorAll(".comarca-item,.setor-item"); all.forEach(function(e){ e.style.display=""; }); return; } }catch(e){}
  const campo =
    document.getElementById(
      "campo-pesquisa-consulta"
    );

  // v3.25 B: normalizarTexto case-insensitive + funciona para GESTOR_CONTEUDO e USUARIO_CONSULTA
  const termoRaw = campo?.value || "";
  const termo =
    (typeof normalizarTextoConsulta==="function" ? normalizarTextoConsulta(termoRaw) : (typeof normalizarTexto==="function" ? normalizarTexto(termoRaw) : String(termoRaw).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()));

  if (!termo) {
    if(typeof renderizarComarcas==="function"){ try{ renderizarComarcas(); }catch(e){} } else { try{ if(typeof normalizarTexto!=="undefined" && document.querySelector(".comarca-item")) document.querySelectorAll(".comarca-item").forEach(function(el){ el.style.display=""; }); var secs=document.querySelectorAll(".setor-item"); secs.forEach(function(s){ s.style.display=""; }); }catch(e2){} }
    return;
  }

  // Termo ativo: garante lista global em ordem da planilha (ordemComarcas)
  // Corrige fragilidade "no microrregião + termo" e "microrregião + termo": busca deve mostrar
  // TODAS as comarcas que casam em sheet order, ignorando microrregião. Evita loop verificando DOM.
  if (!document.querySelector(".comarca-item")) {
    if(typeof renderizarComarcas==="function"){ try{ renderizarComarcas(); }catch(e){} }
    return;
  }

  if (termo && microrregiaoSelecionada) {
    try {
      if (typeof ordemComarcas !== "undefined" && ordemComarcas.length) {
        const totalDOM = document.querySelectorAll(".comarca-item").length;
        const primeiroGlobal = normalizarTexto(ordemComarcas[0] || "");
        const primeiroDOM = normalizarTexto(document.querySelector(".comarca-item .comarca-nome")?.textContent || "");
        const precisaGlobal = totalDOM !== ordemComarcas.length || (primeiroGlobal && primeiroDOM !== primeiroGlobal);
        if (precisaGlobal) {
          if(typeof renderizarComarcas==="function"){ try{ renderizarComarcas(); }catch(e){} }
          return;
        }
      }
    } catch (e) {}
  }

  document
    .querySelectorAll(
      ".comarca-item"
    )
    .forEach(
      comarcaItem => {
        const setoresList =
          comarcaItem.nextElementSibling;

        const nomeComarca =
          normalizarTexto(
            comarcaItem.querySelector(
              ".comarca-nome"
            )?.textContent || ""
          );

        const setores =
          setoresList
            ? Array.from(
                setoresList.querySelectorAll(
                  ".setor-item"
                )
              )
            : [];

        const comarcaEncontrada =
          nomeComarca.includes(
            termo
          );

        let setorEncontrado =
          false;

        setores.forEach(
          setor => {
            const encontrou =
              normalizarTexto(
                setor.textContent
              ).includes(termo);

            setor.style.display =
              encontrou ? "" : "none";

            if (encontrou) {
              setorEncontrado = true;
            }
          }
        );

        const mostrar =
          comarcaEncontrada ||
          setorEncontrado;

        comarcaItem.style.display =
          mostrar ? "" : "none";

        if (!setoresList) {
          return;
        }

        if (!mostrar) {
          setoresList.classList.add("hidden");
          setoresList.style.display = "none";
          setores.forEach(function(s){ s.style.display = "none"; });
        } else if (comarcaEncontrada) {
          // Pesquisa casou no nome da comarca → mostra TODOS os setores dela (ordem da planilha)
          setores.forEach(function(s){ s.style.display = ""; });
          setoresList.classList.remove("hidden");
          setoresList.style.display = "";
        } else {
          // Pesquisa casou só em setor → mostra apenas setores filtrados
          // (já filtrados acima via setorEncontrado)
          setoresList.classList.remove("hidden");
          setoresList.style.display = "";
        }
      }
    );
  // v3.25: atualiza visibilidade de botões Imprimir conforme permissão (Gestor Conteúdo)
  try{ if(typeof atualizarVisibilidadeBotoesImpressaoConsulta==="function") setTimeout(atualizarVisibilidadeBotoesImpressaoConsulta, 20); }catch(e){}
  try{ var _tNorm = (typeof normalizarTextoConsulta==="function" ? normalizarTextoConsulta(campo?.value||"") : normalizarTexto(campo?.value||"")); destacarMapaPorBusca(_tNorm); }catch(e){}

}

function atualizarFiltroSetorConsultaPorComarca(){
  try{
    var selC=document.getElementById("filtro-comarca-consulta");
    var selS=document.getElementById("filtro-setor-consulta");
    if(!selS) return;
    var comarcaSel=selC ? String(selC.value||"").trim() : "";
    var valorAntes=String(selS.value||"").trim();
    var setoresSet=new Set();
    var normSel=(typeof normalizarTexto==="function"?normalizarTexto(comarcaSel):String(comarcaSel).toLowerCase());
    if(typeof setoresPorComarca!=="undefined" && setoresPorComarca){
      if(comarcaSel && setoresPorComarca[comarcaSel]){
        setoresPorComarca[comarcaSel].forEach(function(s){ if(s) setoresSet.add(String(s)); });
      } else if(!comarcaSel){
        if(typeof ordemComarcas!=="undefined" && Array.isArray(ordemComarcas) && ordemComarcas.length){
          ordemComarcas.forEach(function(c){ (setoresPorComarca[c]||[]).forEach(function(s){ if(s) setoresSet.add(String(s)); }); });
        } else {
          Object.keys(setoresPorComarca).forEach(function(c){ (setoresPorComarca[c]||[]).forEach(function(s){ setoresSet.add(String(s)); }); });
        }
      } else {
        var foundKey=Object.keys(setoresPorComarca).find(function(k){ var nk=(typeof normalizarTexto==="function"?normalizarTexto(k):String(k).toLowerCase()); return nk===normSel; });
        if(foundKey) setoresPorComarca[foundKey].forEach(function(s){ setoresSet.add(String(s)); });
      }
    }
    if(setoresSet.size===0 && typeof listaTelefones!=="undefined" && Array.isArray(listaTelefones)){
      listaTelefones.forEach(function(it){
        var c=String((typeof campoTelefone==="function"?campoTelefone(it,["comarca"]):it.comarca)||"").trim();
        var s=String((typeof campoTelefone==="function"?campoTelefone(it,["setor"]):it.setor)||"").trim();
        if(!s) return;
        if(comarcaSel){
          var nc=(typeof normalizarTexto==="function"?normalizarTexto(c):String(c).toLowerCase());
          if(nc!==normSel) return;
        }
        setoresSet.add(s);
      });
    }
    var listaOrdenada;
    if(typeof ordenarPorPlanilha==="function"){
      listaOrdenada=ordenarPorPlanilha(setoresSet,"setor");
    } else if(typeof obterOrdemSetoresPlanilha==="function"){
      var ordemS=obterOrdemSetoresPlanilha();
      var idxS={}; ordemS.forEach(function(v,i){ idxS[v]=i; });
      listaOrdenada=Array.from(setoresSet).sort(function(a,b){ var ia=idxS.hasOwnProperty(a)?idxS[a]:9999; var ib=idxS.hasOwnProperty(b)?idxS[b]:9999; return ia-ib; });
    } else {
      listaOrdenada=Array.from(setoresSet);
    }
    var atual=selS.value;
    selS.textContent="";
    var optTodos=document.createElement("option");
    optTodos.value=""; optTodos.textContent="Todos os setores";
    selS.appendChild(optTodos);
    listaOrdenada.forEach(function(v){
      var o=document.createElement("option");
      o.value=String(v); o.textContent=String(v);
      selS.appendChild(o);
    });
    if(valorAntes && Array.from(selS.options).some(function(o){ return o.value===valorAntes; })){
      selS.value=valorAntes;
    } else if(valorAntes){
      selS.value="";
    } else {
      selS.value=atual;
      if(!Array.from(selS.options).some(function(o){ return o.value===atual; })) selS.value="";
    }
  }catch(e){ console.error("atualizarFiltroSetorConsultaPorComarca",e); }

function filtrarListaConsultaPorComarcaSetor(){
  try{
    if(window._filtrarConsultaEmExecucao) return;
    window._filtrarConsultaEmExecucao=true;
    var selC=document.getElementById("filtro-comarca-consulta");
    var selS=document.getElementById("filtro-setor-consulta");
    var campo=document.getElementById("campo-pesquisa-consulta");
    var valC=selC ? String(selC.value||"").trim() : "";
    var valS=selS ? String(selS.value||"").trim() : "";
    var termoRaw=campo ? String(campo.value||"").trim() : "";
    var termo=(typeof normalizarTextoConsulta==="function" ? normalizarTextoConsulta(termoRaw) : (typeof normalizarTexto==="function" ? normalizarTexto(termoRaw) : String(termoRaw).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()));
    var normC=(typeof normalizarTexto==="function" ? normalizarTexto(valC) : String(valC).toLowerCase());
    var normS=(typeof normalizarTexto==="function" ? normalizarTexto(valS) : String(valS).toLowerCase());
    if(!termo && !normC && !normS){
      if(typeof renderizarComarcas==="function"){ try{ renderizarComarcas(); }catch(e){} }
      try{ if(typeof destacarMapaPorBusca==="function") destacarMapaPorBusca(""); }catch(e){}
      window._filtrarConsultaEmExecucao=false;
      return;
    }
    if(!document.querySelector(".comarca-item")){
      if(typeof renderizarComarcas==="function"){ try{ renderizarComarcas(); }catch(e){} }
      if(!document.querySelector(".comarca-item")){ window._filtrarConsultaEmExecucao=false; return; }
    }
    if(termo && typeof ordemComarcas!=="undefined" && ordemComarcas.length){
      try{
        var totalDOM=document.querySelectorAll(".comarca-item").length;
        var primeiroGlobal=normalizarTexto(ordemComarcas[0]||"");
        var primeiroDOM=normalizarTexto(document.querySelector(".comarca-item .comarca-nome")?.textContent||"");
        var precisaGlobal=totalDOM!==ordemComarcas.length || (primeiroGlobal && primeiroDOM!==primeiroGlobal);
        if(precisaGlobal){
          if(typeof renderizarComarcas==="function"){ try{ renderizarComarcas(); }catch(e){} }
        }
      }catch(e){}
    }
    try{
      if(typeof atualizarFiltroSetorConsultaPorComarca==="function" && normC){
        var prevS=valS;
        var selSBefore=document.getElementById("filtro-setor-consulta");
        var beforeVal=selSBefore?String(selSBefore.value||""):"";
        atualizarFiltroSetorConsultaPorComarca();
        var afterVal=selSBefore?String(selSBefore.value||""):"";
        if(prevS && beforeVal!==prevS){
          valS=String(selSBefore.value||"").trim();
          normS=(typeof normalizarTexto==="function" ? normalizarTexto(valS) : String(valS).toLowerCase());
        }
      }
    }catch(e){}
    var hasFiltro=!!(normC || normS || termo);
    document.querySelectorAll(".comarca-item").forEach(function(comarcaItem){
      var setoresList=comarcaItem.nextElementSibling;
      var nomeComarcaRaw=(comarcaItem.querySelector(".comarca-nome")?.textContent||"").trim();
      var nomeComarcaNorm=(typeof normalizarTexto==="function" ? normalizarTexto(nomeComarcaRaw) : String(nomeComarcaRaw).toLowerCase());
      var comarcaMatchFiltro=!normC || nomeComarcaNorm===normC || nomeComarcaNorm.indexOf(normC)!==-1 || normC.indexOf(nomeComarcaNorm)!==-1;
      var comarcaMatchTermo=!termo || nomeComarcaNorm.includes(termo);
      var setores=setoresList ? Array.from(setoresList.querySelectorAll(".setor-item")) : [];
      var setorEncontrado=false;
      setores.forEach(function(setorEl){
        var nomeSetorNorm=(typeof normalizarTexto==="function" ? normalizarTexto(setorEl.textContent) : String(setorEl.textContent).toLowerCase());
        var setorMatchFiltro=!normS || nomeSetorNorm===normS || nomeSetorNorm.includes(normS);
        var setorMatchTermo=!termo || nomeSetorNorm.includes(termo);
        var mostrarSetor=setorMatchFiltro && setorMatchTermo;
        setorEl.style.display=mostrarSetor?"":"none";
        if(mostrarSetor) setorEncontrado=true;
      });
      var mostrarComarca=false;
      if(!comarcaMatchFiltro){
        mostrarComarca=false;
      } else if(normS){
        mostrarComarca=setorEncontrado;
      } else if(termo){
        if(comarcaMatchTermo){
          mostrarComarca=true;
          setores.forEach(function(s){ s.style.display=""; });
          setorEncontrado=setores.length>0;
        } else {
          mostrarComarca=setorEncontrado;
        }
      } else {
        mostrarComarca=true;
        setores.forEach(function(s){ s.style.display=""; });
      }
      comarcaItem.style.display=mostrarComarca?"":"none";
      if(!setoresList) return;
      if(!mostrarComarca){
        setoresList.classList.add("hidden");
        setoresList.style.display="none";
      } else {
        if(hasFiltro){
          setoresList.classList.remove("hidden");
          setoresList.style.display="";
        }
      }
    });
    try{ if(typeof destacarMapaPorBusca==="function") destacarMapaPorBusca(termo); }catch(e){}
    try{ if(typeof atualizarVisibilidadeBotoesImpressaoConsulta==="function") setTimeout(atualizarVisibilidadeBotoesImpressaoConsulta,20); }catch(e){}
    window._filtrarConsultaEmExecucao=false;
  }catch(e){
    try{ window._filtrarConsultaEmExecucao=false; }catch(e2){}
    console.error("filtrarListaConsultaPorComarcaSetor",e);
  }
}

function imprimirConsultaPDF() {

  try{
    var _cPrint = (typeof tituloImpressaoComarca!=="undefined" && tituloImpressaoComarca) ? String(tituloImpressaoComarca||"").trim() : "";
    if(!_cPrint){ try{ var h2=document.querySelector(".detalhe-contatos-cabecalho h3"); if(h2) _cPrint=h2.textContent||""; }catch(e){} }
    if(_cPrint && typeof bloquearImpressaoSemPermissaoConsulta==="function" && bloquearImpressaoSemPermissaoConsulta(_cPrint)) return;
    if(_cPrint && typeof podeImprimirComarcaConsulta==="function" && !podeImprimirComarcaConsulta(_cPrint)){
      if(typeof mostrarToast==="function") mostrarToast("Sem permissão para imprimir esta comarca","warning");
      return;
    }
  }catch(e){}
  const tituloOriginal =
    document.title;

  const tituloInterface =
    document
      .querySelector(
        ".system-title h1"
      )
      ?.textContent
      .replace(/\s+/g, " ")
      .trim() ||
    "Diretório Institucional de Contatos - PJES";

  document.title =
    tituloInterface;

  window.addEventListener(
    "afterprint",
    function restaurarTitulo() {
      document.title =
        tituloOriginal;

      window.removeEventListener(
        "afterprint",
        restaurarTitulo
      );
    },
    { once: true }
  );

  window.print();
}
