<!-- Solicitação disponível somente para identidade reconhecida na URL privada. -->
<style>
  .fa-wrap{max-width:760px;margin:0 auto}.fa-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 10px 25px -8px rgba(15,23,42,.12);overflow:hidden}.fa-head{background:linear-gradient(135deg,#1e3a8a,#3b82f6);padding:25px 30px;color:#fff}.fa-head h2{margin:0 0 6px;font-size:20px}.fa-head p{margin:0;font-size:13px;line-height:1.5;opacity:.92}.fa-body{padding:26px 30px}.fa-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fa-full{grid-column:1/-1}.fa-field{display:flex;flex-direction:column;gap:6px}.fa-field label{font-size:13px;font-weight:700;color:#334155}.fa-field input,.fa-field select,.fa-field textarea{width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid #cbd5e1;border-radius:10px;font:inherit;background:#f8fafc}.fa-unidades{max-height:260px;overflow:auto;border:1px solid #cbd5e1;border-radius:10px;padding:8px;background:#f8fafc}.fa-unidade{display:flex;gap:9px;align-items:flex-start;padding:8px;border-radius:8px;font-size:13px}.fa-unidade:hover{background:#eff6ff}.fa-unidade small{display:block;color:#64748b;margin-top:2px}.fa-msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13px}.fa-acoes{display:flex;justify-content:flex-end;margin-top:20px}.fa-btn{padding:11px 22px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.fa-btn:disabled{opacity:.6;cursor:wait}@media(max-width:700px){.fa-grid{grid-template-columns:1fr}.fa-full{grid-column:auto}.fa-body{padding:20px}}
</style>

<div class="fa-wrap">
  <div class="fa-card">
    <div class="fa-head">
      <h2>Solicitar Acesso Administrativo</h2>
      <p id="acesso-identidade-info">O e-mail vem da conta Google identificada nesta URL privada. A solicitação ficará pendente até análise de um Gestor do Sistema.</p>
    </div>
    <div class="fa-body">
      <div class="fa-grid">
        <div id="grupo-acesso-nome" class="fa-field">
          <label for="acesso-nome">Nome completo *</label>
          <input id="acesso-nome" maxlength="150" autocomplete="name">
        </div>
        <div id="grupo-acesso-email" class="fa-field">
          <label for="acesso-email">Conta Google identificada</label>
          <input id="acesso-email" readonly aria-readonly="true">
        </div>
        <div class="fa-field fa-full">
          <label for="acesso-nivel">Alteração de nível de acesso</label>
          <select id="acesso-nivel" onchange="alternarUnidadesSolicitacao()">
            <option value="">Não solicitar alteração de nível</option>
            <option value="1">1 — Gestor de Conteúdo</option>
            <option value="2">2 — Gestor do Sistema</option>
          </select>
        </div>
        <div id="grupo-acesso-unidades" class="fa-field fa-full">
          <label>Fóruns/Unidades solicitados</label>
          <select id="acesso-municipio" onchange="renderizarSeletorLocalidadesAcesso()"><option value="">Selecione a Comarca/Órgão</option></select>
          <div id="acesso-unidades" class="fa-unidades" aria-live="polite">Carregando Fóruns e Unidades...</div>
        </div>
        <div class="fa-field fa-full">
          <label for="acesso-justificativa">Justificativa</label>
          <textarea id="acesso-justificativa" rows="4" maxlength="2000"></textarea>
        </div>
      </div>
      <div id="formulario-acesso-mensagem" class="fa-msg hidden" role="alert"></div>
      <div class="fa-acoes"><button id="btn-enviar-formulario-acesso" type="button" class="fa-btn" onclick="enviarFormularioAcesso()">Enviar solicitação</button></div>
    </div>
  </div>
</div>

<script>
var escoposDisponiveisAcesso = [];
var escoposAcessoSelecionados = new Set();
var forumAcessoAberto = "";
function chaveEscopoAcesso(escopo){return escopo.tipo+":"+escopo.id;}

function usuarioPossuiAcessoAdministrativoFormulario(usuario){
  var perfil=String((usuario&&usuario.perfil)||"").toUpperCase();
  return !!(usuario&&usuario.logado===true&&usuario.ativo===true&&(perfil==="GESTOR_CONTEUDO"||perfil==="GESTOR_SISTEMA"));
}

function ajustarCamposIdentidadeFormularioAcesso(){
  var usuario=typeof usuarioAtual!=="undefined"?usuarioAtual:{};
  var ocultar=usuarioPossuiAcessoAdministrativoFormulario(usuario);
  var grupoNome=document.getElementById("grupo-acesso-nome");
  var grupoEmail=document.getElementById("grupo-acesso-email");
  var aviso=document.getElementById("acesso-identidade-info");
  if(grupoNome){grupoNome.style.display=ocultar?"none":"";grupoNome.setAttribute("aria-hidden",ocultar?"true":"false");}
  if(grupoEmail){grupoEmail.style.display=ocultar?"none":"";grupoEmail.setAttribute("aria-hidden",ocultar?"true":"false");}
  if(aviso){
    aviso.textContent=ocultar
      ? "Seu nome e e-mail cadastrados serão usados automaticamente. A solicitação ficará pendente até análise de um Gestor do Sistema."
      : "Informe seu nome. O e-mail vem da conta Google identificada nesta URL privada. A solicitação ficará pendente até análise de um Gestor do Sistema.";
  }
}

function atualizarIdentidadeFormularioAcesso(){
  var email = document.getElementById("acesso-email");
  var nome = document.getElementById("acesso-nome");
  var usuario = typeof usuarioAtual !== "undefined" ? usuarioAtual : {};
  if(email) email.value = String(usuario.email || window.SESSAO_EMAIL || "");
  if(nome && !nome.value && usuario.nome && usuario.nome !== "Visitante") nome.value = usuario.nome;
  if(usuarioPossuiAcessoAdministrativoFormulario(usuario)){
    if(nome) nome.value=String(usuario.nome||"").trim();
    if(email) email.value=String(usuario.email||"").trim();
  }
  ajustarCamposIdentidadeFormularioAcesso();
  var nivel = document.getElementById("acesso-nivel");
  if(nivel && usuario.logado === true && usuario.perfil === "GESTOR_CONTEUDO"){
    nivel.value = "";
  } else if(nivel) nivel.value = "1";
}

function carregarUnidadesFormularioAcesso(){
  var holder = document.getElementById("acesso-unidades");
  if(!holder || !API || typeof API.listarEscoposParaAcesso !== "function") return;
  API.listarEscoposParaAcesso(function(resp){
    escoposDisponiveisAcesso = resp && resp.sucesso === true && Array.isArray(resp.dados) ? resp.dados : [];
    holder.textContent = "";
    if(!escoposDisponiveisAcesso.length){ holder.textContent = (resp && resp.erro) || "Nenhum escopo disponível."; return; }
    prepararSeletorLocalidadesAcesso();
  }, function(erro){ holder.textContent = (erro && erro.message) || "Falha ao carregar escopos."; });
}

function prepararSeletorLocalidadesAcesso(){
  var select=document.getElementById("acesso-municipio");if(!select)return;select.textContent="";var inicial=document.createElement("option");inicial.value="";inicial.textContent="Selecione a Comarca/Órgão";select.appendChild(inicial);
  var municipios=[];escoposDisponiveisAcesso.forEach(function(escopo){if(escopo.municipio&&municipios.indexOf(escopo.municipio)<0)municipios.push(escopo.municipio);});
  municipios.forEach(function(nome){var opcao=document.createElement("option");opcao.value=nome;opcao.textContent=nome;select.appendChild(opcao);});select.value=municipios[0]||"";renderizarSeletorLocalidadesAcesso();
}
function alternarEscopoAcesso(escopo,marcado){var chave=chaveEscopoAcesso(escopo);if(marcado){escoposAcessoSelecionados.add(chave);if(escopo.tipo==="FORUM")escoposDisponiveisAcesso.filter(function(item){return item.tipo==="UNIDADE"&&item.forumId===escopo.forumId;}).forEach(function(item){escoposAcessoSelecionados.delete(chaveEscopoAcesso(item));});}else escoposAcessoSelecionados.delete(chave);renderizarSeletorLocalidadesAcesso();}
function renderizarSeletorLocalidadesAcesso(){
  var municipio=document.getElementById("acesso-municipio"),holder=document.getElementById("acesso-unidades");if(!municipio||!holder)return;holder.textContent="";var atuais=(typeof usuarioAtual!=="undefined"&&Array.isArray(usuarioAtual.acessos))?usuarioAtual.acessos:[];var foruns=escoposDisponiveisAcesso.filter(function(item){return item.tipo==="FORUM"&&item.municipio===municipio.value;});var unidadesOrgao=escoposDisponiveisAcesso.filter(function(item){return item.tipo==="UNIDADE"&&!item.forumId&&item.municipio===municipio.value;});if(!foruns.length&&!unidadesOrgao.length){holder.textContent="Selecione uma Comarca/Órgão para visualizar os Fóruns ou Unidades.";return;}if(foruns.length){var titulo=document.createElement("strong");titulo.textContent="Fóruns";holder.appendChild(titulo);}
  foruns.forEach(function(forum){var jaVinculado=atuais.some(function(atual){return atual.tipo===forum.tipo&&atual.id===forum.id;});var linha=document.createElement("div");linha.style.marginTop="10px";var check=document.createElement("input");check.type="checkbox";check.checked=escoposAcessoSelecionados.has(chaveEscopoAcesso(forum));check.disabled=jaVinculado;check.onchange=function(){alternarEscopoAcesso(forum,check.checked);};var nome=document.createElement("button");nome.type="button";nome.className="btn";nome.style.marginLeft="8px";nome.textContent=forum.caminhoTexto||forum.nome;nome.onclick=function(){forumAcessoAberto=forumAcessoAberto===forum.id?"":forum.id;renderizarSeletorLocalidadesAcesso();};linha.appendChild(check);linha.appendChild(nome);if(jaVinculado)linha.appendChild(document.createTextNode(" já vinculada"));holder.appendChild(linha);
    if(forumAcessoAberto===forum.id){var subtitulo=document.createElement("strong");subtitulo.textContent="Unidades";subtitulo.style.cssText="display:block;margin:8px 0 4px 28px";holder.appendChild(subtitulo);escoposDisponiveisAcesso.filter(function(item){return item.tipo==="UNIDADE"&&item.forumId===forum.forumId;}).forEach(function(unidade){var existente=atuais.some(function(atual){return atual.tipo===unidade.tipo&&atual.id===unidade.id;});var unidadeLinha=document.createElement("label");unidadeLinha.style.cssText="display:block;margin:5px 0 5px 28px";var unidadeCheck=document.createElement("input");unidadeCheck.type="checkbox";unidadeCheck.checked=escoposAcessoSelecionados.has(chaveEscopoAcesso(unidade));unidadeCheck.disabled=check.checked||existente;unidadeCheck.onchange=function(){alternarEscopoAcesso(unidade,unidadeCheck.checked);};unidadeLinha.appendChild(unidadeCheck);unidadeLinha.appendChild(document.createTextNode(" "+(unidade.caminhoTexto||unidade.nome)+(existente?" já vinculada":"")));holder.appendChild(unidadeLinha);});}
  });
  if(unidadesOrgao.length){var tituloOrgao=document.createElement("strong");tituloOrgao.textContent="Unidades do Órgão";tituloOrgao.style.cssText="display:block;margin-top:14px";holder.appendChild(tituloOrgao);unidadesOrgao.forEach(function(unidade){var existente=atuais.some(function(atual){return atual.tipo===unidade.tipo&&atual.id===unidade.id;});var linha=document.createElement("label");linha.className="fa-unidade";var check=document.createElement("input");check.type="checkbox";check.checked=escoposAcessoSelecionados.has(chaveEscopoAcesso(unidade));check.disabled=existente;check.onchange=function(){alternarEscopoAcesso(unidade,check.checked);};linha.appendChild(check);linha.appendChild(document.createTextNode(" "+(unidade.caminhoTexto||unidade.nome)+(existente?" já vinculada":"")));holder.appendChild(linha);});}
}

function alternarUnidadesSolicitacao(){
  var nivel = Number(document.getElementById("acesso-nivel")?.value || 0);
  var grupo = document.getElementById("grupo-acesso-unidades");
  if(grupo) grupo.style.display = nivel === 2 ? "none" : "";
  if(nivel === 2){escoposAcessoSelecionados.clear();renderizarSeletorLocalidadesAcesso();}
}

function mensagemFormularioAcesso(texto, sucesso){
  var el = document.getElementById("formulario-acesso-mensagem"); if(!el) return;
  el.textContent = texto; el.classList.remove("hidden");
  el.style.background = sucesso ? "#dcfce7" : "#fee2e2";
  el.style.color = sucesso ? "#166534" : "#991b1b";
}

function enviarFormularioAcesso(){
  var usuario = typeof usuarioAtual !== "undefined" ? usuarioAtual : {};
  var usarIdentidadeCadastrada=usuarioPossuiAcessoAdministrativoFormulario(usuario);
  var nome = usarIdentidadeCadastrada
    ? String(usuario.nome || "").trim()
    : String(document.getElementById("acesso-nome")?.value || "").trim();
  var nivel = Number(document.getElementById("acesso-nivel")?.value || 0);
  var escopos = Array.from(escoposAcessoSelecionados).map(function(chave){var partes=chave.split(":");return {tipo:partes[0],id:partes.slice(1).join(":")};});
  var justificativa = String(document.getElementById("acesso-justificativa")?.value || "").trim();
  if(nome.length < 3){ mensagemFormularioAcesso(usarIdentidadeCadastrada?"Não foi possível identificar o nome cadastrado.":"Informe seu nome completo.", false); return; }
  if(!nivel && !escopos.length){ mensagemFormularioAcesso("Solicite uma alteração de nível, Fóruns/Unidades adicionais ou ambos.", false); return; }
  if(usuario.cadastrado !== true && nivel === 1 && !escopos.length){ mensagemFormularioAcesso("Selecione ao menos uma Comarca/Órgão, Fórum ou Unidade para o Gestor de Conteúdo.", false); return; }
  var botao = document.getElementById("btn-enviar-formulario-acesso"); if(botao) botao.disabled = true;
  API.enviarFormularioAcesso({nome:nome,nivel:nivel,escopos:escopos,justificativa:justificativa}, function(resp){
    if(botao) botao.disabled = false;
    if(resp && resp.sucesso === true){
      mensagemFormularioAcesso("Solicitação enviada e registrada como PENDENTE. Os acessos atuais serão preservados.", true);
      if(typeof mostrarToast === "function") mostrarToast("Solicitação enviada.", "success");
    } else mensagemFormularioAcesso((resp && resp.erro) || "Não foi possível enviar.", false);
  }, function(erro){ if(botao) botao.disabled = false; mensagemFormularioAcesso((erro && erro.message) || "Falha de comunicação.", false); });
}

document.addEventListener("DOMContentLoaded", function(){
  atualizarIdentidadeFormularioAcesso(); carregarUnidadesFormularioAcesso(); alternarUnidadesSolicitacao();
});
</script>
