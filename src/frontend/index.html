    <script>
      (function () {
        "use strict";

        var carregarTelefonesLegacy = window.carregarTelefones;
        var mostrarMapaConsultaLegacy = window.mostrarMapaConsulta;

        function usaNavegacaoForum() {
          return Boolean(
            document.getElementById("fc-content") &&
            document.getElementById("fc-map") &&
            typeof window.iniciarNavegacaoForum === "function"
          );
        }

        window.carregarTelefones = function () {
          if (usaNavegacaoForum()) {
            window.iniciarNavegacaoForum(false);
            return;
          }
          if (typeof carregarTelefonesLegacy === "function") {
            return carregarTelefonesLegacy.apply(this, arguments);
          }
        };

        window.mostrarMapaConsulta = function () {
          if (usaNavegacaoForum()) {
            try { window.iniciarNavegacaoForum(false); } catch (erro) {}
            try {
              if (typeof window.tentarInicializarMapa === "function") {
                window.tentarInicializarMapa();
              }
            } catch (erro) {}
            return;
          }
          if (typeof mostrarMapaConsultaLegacy === "function") {
            return mostrarMapaConsultaLegacy.apply(this, arguments);
          }
        };
      })();
    </script>

    <script>
      (function () {
        "use strict";

        function ocultarZeroUnidadesForum() {
          var painel = document.getElementById("fc-content");
          if (!painel) return;

          painel.querySelectorAll('.fc-card[data-forum] .fc-meta .fc-pill').forEach(function (badge) {
            var texto = String(badge.textContent || "").trim().toLowerCase();
            if (/^0\s+unidade(?:s)?$/.test(texto)) badge.remove();
          });
        }

        function observarBadgesForum() {
          var painel = document.getElementById("fc-content");
          if (!painel || painel.__pjesZeroUnidadesObserver) return;
          painel.__pjesZeroUnidadesObserver = true;
          ocultarZeroUnidadesForum();
          new MutationObserver(ocultarZeroUnidadesForum).observe(painel, {
            childList: true,
            subtree: true
          });
        }

        observarBadgesForum();
        document.addEventListener("DOMContentLoaded", observarBadgesForum);
      })();
    </script>
