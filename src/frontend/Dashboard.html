<div class="dashboard-container">
  <div class="page-header">
    <div>
      <h2>Dashboard</h2>
      <p>Visão geral do sistema</p>
    </div>
  </div>

  <div class="dashboard-cards">
    <div class="card">
      <div class="card-title">Total de contatos</div>
      <div id="total-telefones" class="card-value">0</div>
    </div>

    <div class="card">
      <div class="card-title">Quantidade de setores</div>
      <div id="total-setores" class="card-value">0</div>
    </div>

    <div class="card">
      <div class="card-title">Tipos de contatos cadastrados</div>
      <div id="total-tipos" class="card-value">0</div>
    </div>
  </div>

  <div class="dashboard-grid">
    <div class="panel">
      <h3>Contatos por tipo</h3>
      <div id="grafico-tipos" class="chart-container"></div>
    </div>

    <div class="panel">
      <h3>Contatos por comarca</h3>
      <div id="grafico-comarcas" class="chart-container"></div>
    </div>
  </div>

</div>
